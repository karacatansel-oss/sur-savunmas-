<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sur Savunması V13</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101713;
  font-family:Arial,Helvetica,sans-serif;
  user-select:none;
}
#game{
  position:relative;
  width:min(100vw,560px);
  height:100dvh;
  margin:auto;
  overflow:hidden;
  touch-action:none;
  background:#79add0;
}

/* =========================================================
   GÖKYÜZÜ / UZAK PLAN
========================================================= */

#sky{
  position:absolute;
  inset:0 0 72% 0;
  background:
    radial-gradient(circle at 80% 22%,#fff6c6 0 4%,#ffe899 5%,transparent 13%),
    linear-gradient(#66a5d0,#b5d3d3);
}

.cloud{
  position:absolute;
  height:15px;
  width:80px;
  border-radius:30px;
  background:#ffffffa8;
  filter:blur(.4px);
}
.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:#ffffffa8;
}
.cloud:before{
  width:34px;height:34px;
  left:12px;top:-17px;
}
.cloud:after{
  width:43px;height:43px;
  right:8px;top:-23px;
}
.cloud1{left:6%;top:8%;transform:scale(.7)}
.cloud2{right:8%;top:14%;transform:scale(.48)}
.cloud3{left:42%;top:5%;transform:scale(.4)}

#mountains{
  position:absolute;
  z-index:1;
  left:0;right:0;
  top:13%;
  height:17%;
  overflow:hidden;
}
.mountain{
  position:absolute;
  width:210px;
  height:210px;
  bottom:-145px;
  transform:rotate(45deg);
  background:linear-gradient(135deg,#6f8874,#425d50);
  border-radius:15px;
}
.mountain:before{
  content:"";
  position:absolute;
  width:65px;height:65px;
  left:0;top:0;
  background:#d8dfd5;
  clip-path:polygon(0 0,100% 0,0 100%);
}
.mountain:nth-child(1){left:-70px}
.mountain:nth-child(2){left:130px;transform:rotate(45deg) scale(1.2);background:linear-gradient(135deg,#789278,#506958)}
.mountain:nth-child(3){right:-80px}

/* =========================================================
   BÜYÜK SAVAŞ ALANI
========================================================= */

#field{
  position:absolute;
  z-index:2;
  left:0;
  right:0;
  top:22%;
  height:43%;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 8% 18%,#3f703b 0 3px,transparent 4px),
    radial-gradient(ellipse at 19% 60%,#477b40 0 3px,transparent 4px),
    radial-gradient(ellipse at 80% 35%,#426e3b 0 3px,transparent 4px),
    radial-gradient(ellipse at 90% 74%,#527f45 0 2px,transparent 3px),
    linear-gradient(#729c55,#64894b 60%,#617f48);
}

#battleRoad{
  position:absolute;
  z-index:3;
  left:28%;
  width:44%;
  top:22%;
  height:44%;
  clip-path:polygon(43% 0,57% 0,91% 100%,9% 100%);
  background:
    radial-gradient(circle at 35% 22%,#756249 0 2px,transparent 3px),
    radial-gradient(circle at 62% 43%,#79664b 0 2px,transparent 3px),
    radial-gradient(circle at 45% 75%,#705b43 0 3px,transparent 4px),
    linear-gradient(90deg,#75664d,#a99268 25%,#bca778 50%,#a99268 75%,#75664d);
}

.grass{
  position:absolute;
  z-index:4;
  width:2px;
  height:12px;
  background:#315f32;
  transform-origin:bottom;
}
.g1{left:7%;top:31%;transform:rotate(-20deg)}
.g2{left:14%;top:45%;transform:rotate(15deg)}
.g3{right:9%;top:35%;transform:rotate(20deg)}
.g4{right:16%;top:51%;transform:rotate(-13deg)}
.g5{left:24%;top:57%;transform:rotate(8deg)}
.g6{right:26%;top:59%;transform:rotate(-9deg)}

.rock{
  position:absolute;
  z-index:4;
  width:17px;height:10px;
  border-radius:55% 45% 40% 35%;
  background:linear-gradient(#85887d,#555b54);
  box-shadow:3px 4px 3px #0003;
}
.r1{left:10%;top:38%}
.r2{right:11%;top:43%;transform:scale(.7)}
.r3{left:20%;top:57%;transform:scale(.55)}

/* =========================================================
   GERÇEKÇİ SUR
========================================================= */

#wallShadow{
  position:absolute;
  z-index:20;
  left:-3%;
  width:106%;
  top:64%;
  height:30px;
  border-radius:50%;
  background:#0005;
  filter:blur(9px);
}

#wall{
  position:absolute;
  z-index:30;
  left:-2%;
  width:104%;
  top:61%;
  height:92px;
  border-top:6px solid #595b57;
  border-bottom:9px solid #494b48;
  background:
    linear-gradient(90deg,transparent 0 9%,#6e706b 9.5% 10%,transparent 10.5% 23%,#72746f 23.5% 24%,transparent 24.5% 38%,#737570 38.5% 39%,transparent 39.5% 56%,#747670 56.5% 57%,transparent 57.5% 74%,#70726d 74.5% 75%,transparent 75.5% 90%,#70726c 90.5% 91%,transparent 91.5%),
    repeating-linear-gradient(0deg,transparent 0 22px,#72746f 22px 25px),
    repeating-linear-gradient(90deg,#aaa99f 0 37px,#858781 37px 40px,#b6b4aa 40px 78px);
  box-shadow:
    inset 0 6px #d0cec2,
    inset 0 -9px #666863,
    0 11px 15px #0006;
}

#wall:before{
  content:"";
  position:absolute;
  left:0;right:0;
  height:25px;
  top:-23px;
  background:
    repeating-linear-gradient(
      90deg,
      #aaa99f 0 24px,
      #aaa99f 24px 26px,
      transparent 26px 39px
    );
  filter:drop-shadow(0 4px 1px #0004);
}

.stoneCrack{
  position:absolute;
  width:16px;height:14px;
  border-left:2px solid #666761;
  border-bottom:2px solid #666761;
  transform:skew(-18deg) rotate(-20deg);
  opacity:.6;
}
.cr1{left:24%;top:25px}
.cr2{right:25%;top:50px}
.cr3{left:71%;top:14px}

/* GATE */
#gateFrame{
  position:absolute;
  z-index:5;
  left:50%;
  bottom:-7px;
  transform:translateX(-50%);
  width:31%;
  height:92px;
  border:9px solid #50514e;
  border-bottom:0;
  border-radius:60px 60px 0 0;
  box-shadow:inset 0 0 15px #0008;
}

#gate{
  position:absolute;
  inset:7px 7px 0;
  border-radius:48px 48px 0 0;
  overflow:hidden;
  background:
    repeating-linear-gradient(90deg,#775036 0 10px,#4d3224 10px 13px);
}

#gate:before,
#gate:after{
  content:"";
  position:absolute;
  left:0;right:0;
  height:7px;
  background:linear-gradient(#4c5355,#252a2c);
}
#gate:before{top:31px}
#gate:after{top:61px}

.gateStuds{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle,#b5b9b8 0 2px,transparent 3px) 2px 12px/20px 29px;
}

/* WALL TOWERS */
.wallTower{
  position:absolute;
  z-index:9;
  bottom:-7px;
  width:72px;
  height:126px;
  border:6px solid #535652;
  background:
    repeating-linear-gradient(0deg,#9d9d95 0 23px,#777974 23px 26px);
  box-shadow:
    inset 8px 0 #ffffff13,
    inset -8px 0 #00000012,
    5px 6px 5px #0004;
}
.wallTower.left{left:1%}
.wallTower.right{right:1%}

.wallTower:before{
  content:"";
  position:absolute;
  left:-7px;
  top:-23px;
  width:74px;
  height:27px;
  background:
    repeating-linear-gradient(90deg,#a5a59d 0 15px,transparent 15px 23px);
}
.wallTower:after{
  content:"";
  position:absolute;
  left:25px;
  top:32px;
  width:11px;
  height:23px;
  border-radius:8px 8px 1px 1px;
  background:#303637;
  box-shadow:0 48px #303637;
}

/* =========================================================
   AVLU VE KALE
========================================================= */

#yard{
  position:absolute;
  z-index:2;
  left:0;right:0;
  top:68%;
  bottom:0;
  background:
    radial-gradient(circle at 11% 20%,#735a40 0 2px,transparent 3px),
    radial-gradient(circle at 88% 37%,#7b6246 0 2px,transparent 3px),
    radial-gradient(circle at 35% 68%,#816548 0 2px,transparent 3px),
    linear-gradient(#b59a69,#8d704c);
}

#castle{
  position:absolute;
  z-index:9;
  left:50%;
  bottom:7%;
  transform:translateX(-50%);
  width:146px;
  height:115px;
  filter:drop-shadow(9px 12px 5px #0007);
}

.keep{
  position:absolute;
  left:34px;
  bottom:0;
  width:78px;
  height:91px;
  border:6px solid #515451;
  background:
    repeating-linear-gradient(0deg,#a9a89f 0 20px,#777974 20px 23px);
}
.keep:before{
  content:"";
  position:absolute;
  left:-6px;right:-6px;
  top:-23px;height:27px;
  background:repeating-linear-gradient(90deg,#aaa99f 0 16px,transparent 16px 24px);
}
.keepWindow{
  position:absolute;
  width:10px;height:22px;
  border-radius:7px 7px 1px 1px;
  background:#293233;
  top:23px;
}
.kw1{left:12px}.kw2{right:12px}

.keepDoor{
  position:absolute;
  left:50%;
  bottom:-6px;
  transform:translateX(-50%);
  width:29px;height:42px;
  border:5px solid #4c4036;
  border-radius:18px 18px 0 0;
  background:repeating-linear-gradient(90deg,#735039 0 8px,#4d3427 8px 10px);
}

.castleTower{
  position:absolute;
  bottom:0;
  width:42px;
  height:103px;
  border:6px solid #515451;
  background:repeating-linear-gradient(0deg,#999991 0 21px,#737570 21px 24px);
}
.castleTower.left{left:0}
.castleTower.right{right:0}
.castleTower:before{
  content:"";
  position:absolute;
  left:-6px;right:-6px;
  top:-21px;height:25px;
  background:repeating-linear-gradient(90deg,#a1a198 0 13px,transparent 13px 20px);
}
.castleTower:after{
  content:"";
  position:absolute;
  width:9px;height:20px;
  left:10px;top:25px;
  background:#293233;
  border-radius:7px 7px 0 0;
}

/* =========================================================
   HUD
========================================================= */

#hud{
  position:absolute;
  z-index:500;
  top:max(7px,env(safe-area-inset-top));
  left:7px;right:7px;
  display:flex;
  gap:5px;
  justify-content:space-between;
}

.hudBox{
  flex:1;
  padding:8px 4px;
  text-align:center;
  border-radius:16px;
  border:2px solid #ffffff55;
  background:linear-gradient(#354e43ee,#172820ee);
  color:#fff;
  font-weight:900;
  font-size:13px;
  box-shadow:0 5px 9px #0005;
}

/* =========================================================
   BUILDING SLOTS
========================================================= */

.slot{
  position:absolute;
  z-index:100;
  width:72px;height:72px;
  transform:translate(-50%,-50%);
  border:3px dashed #59442e;
  border-radius:50%;
  display:grid;
  place-items:center;
  text-align:center;
  color:#473621;
  background:#efd49780;
  font-size:10px;
  font-weight:bold;
}
.slot.building{
  border:0;
  background:transparent;
}
.slot.dragging{opacity:.22}
.slot.mergeTarget .buildingModel{
  transform:scale(1.18);
  filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 14px #ffd43d);
}

.buildingModel{
  position:relative;
  width:72px;height:69px;
  filter:drop-shadow(5px 7px 3px #0005);
  transition:.15s;
}
.bHouse{
  position:absolute;
  left:8px;right:8px;
  bottom:4px;
  height:40px;
  border:3px solid #4d3c2d;
  background:linear-gradient(90deg,#99704a,#c69f69,#88613f);
}
.bRoof{
  position:absolute;
  left:2px;right:2px;
  top:0;height:31px;
  clip-path:polygon(50% 0,100% 100%,0 100%);
  background:#914339;
  border-bottom:4px solid #54332b;
}
.archerBuilding .bRoof{background:#456f45}
.cavalryBuilding .bRoof{background:#496a84}
.artilleryBuilding .bRoof{background:#555452}
.bDoor{
  position:absolute;
  width:15px;height:20px;
  left:29px;bottom:5px;
  background:#543728;
  border-radius:8px 8px 0 0;
}
.bFlag{
  position:absolute;
  right:4px;top:16px;
  width:26px;height:25px;
  display:grid;place-items:center;
  border:2px solid #4d3c2d;
  border-radius:50%;
  background:#e4d09d;
}
.level{
  position:absolute;
  left:0;bottom:-3px;
  padding:2px 5px;
  border-radius:7px;
  color:#fff;
  background:#4c3476;
  font-size:9px;
}
.prod{
  position:absolute;
  left:8px;right:8px;
  bottom:-8px;
  height:6px;
  border-radius:5px;
  overflow:hidden;
  border:1px solid #fff;
  background:#1d2a23;
}
.prod i{
  display:block;
  height:100%;
  width:0;
  background:#e4bb42;
}
.dragGhost{
  position:absolute;
  z-index:900;
  pointer-events:none;
  width:72px;height:72px;
  transform:translate(-50%,-50%) scale(1.1);
}

/* =========================================================
   ORTAK BİRLİK
========================================================= */

.unit{
  position:absolute;
  z-index:80;
  width:52px;height:70px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.shadow{
  position:absolute;
  z-index:0;
  left:7px;
  bottom:2px;
  width:40px;height:10px;
  border-radius:50%;
  background:#0006;
  filter:blur(2px);
}

.soldier{
  position:absolute;
  z-index:2;
  left:6px;top:1px;
  width:42px;height:62px;
}

.sHead{
  position:absolute;
  z-index:8;
  left:14px;top:5px;
  width:15px;height:17px;
  border-radius:48%;
  border:1px solid #6d4935;
  background:linear-gradient(90deg,#a86e4c,#e0a47b);
}
.face{
  position:absolute;
  z-index:10;
  left:24px;top:11px;
  width:2px;height:2px;
  border-radius:50%;
  background:#241c18;
}
.hair{
  position:absolute;
  z-index:9;
  left:13px;top:3px;
  width:17px;height:8px;
  border-radius:10px 10px 3px 3px;
  background:#39291f;
}
.helmet{
  position:absolute;
  z-index:11;
  left:11px;top:1px;
  width:20px;height:13px;
  border:2px solid #414a4e;
  border-radius:11px 11px 3px 3px;
  background:linear-gradient(90deg,#555f64,#b6bec0,#4d575c);
}
.helmet:after{
  content:"";
  position:absolute;
  width:4px;height:11px;
  left:7px;top:9px;
  background:#636c70;
}

.chest{
  position:absolute;
  z-index:6;
  left:10px;top:21px;
  width:23px;height:23px;
  border-radius:6px 6px 4px 4px;
  border:1px solid #42382f;
  background:#775c44;
}
.waist{
  position:absolute;
  z-index:8;
  left:9px;top:39px;
  width:25px;height:5px;
  background:#3e2c20;
}
.arm{
  position:absolute;
  z-index:5;
  top:23px;
  width:7px;height:23px;
  border-radius:5px;
  background:#a47454;
  transform-origin:50% 2px;
}
.arm.left{left:5px}
.arm.right{right:3px}

.leg{
  position:absolute;
  z-index:4;
  top:42px;
  width:8px;height:19px;
  border-radius:4px;
  background:#393a37;
  transform-origin:50% 1px;
}
.leg.left{left:11px}
.leg.right{right:8px}

.unit.walk .soldier{
  animation:bodyWalk .28s ease-in-out infinite alternate;
}
.unit.walk .leg.left{
  animation:legA .28s infinite alternate;
}
.unit.walk .leg.right{
  animation:legB .28s infinite alternate;
}
.unit.walk .arm.left{
  animation:legB .28s infinite alternate;
}
.unit.walk .arm.right{
  animation:legA .28s infinite alternate;
}
@keyframes bodyWalk{to{transform:translateY(-2px)}}
@keyframes legA{from{transform:rotate(25deg)}to{transform:rotate(-25deg)}}
@keyframes legB{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}

/* =========================================================
   PİYADE
========================================================= */

.warrior .chest{
  background:linear-gradient(90deg,#59656a,#a9b1b2,#505a60);
}
.sword{
  position:absolute;
  z-index:15;
  right:-5px;top:15px;
  width:5px;height:37px;
  border-radius:2px;
  background:linear-gradient(90deg,#536065,#f1f3f1,#68757a);
  border:1px solid #414a4e;
  transform:rotate(-25deg);
  transform-origin:50% 88%;
}
.sword:before{
  content:"";
  position:absolute;
  left:-6px;bottom:6px;
  width:16px;height:4px;
  background:#b08a43;
}
.sword:after{
  content:"";
  position:absolute;
  left:0;bottom:-7px;
  width:4px;height:10px;
  background:#503521;
}

.shield{
  position:absolute;
  z-index:14;
  left:-6px;top:23px;
  width:22px;height:28px;
  border:3px solid #4c3829;
  border-radius:10px 10px 15px 15px;
  background:
    linear-gradient(90deg,#87352f 0 45%,#d3a53c 46% 54%,#87352f 55%);
  box-shadow:inset 0 0 5px #0005;
}
.shield:after{
  content:"";
  position:absolute;
  left:7px;top:9px;
  width:5px;height:5px;
  border-radius:50%;
  background:#d2d7d7;
}

.unit.melee .sword{
  animation:swordSwing .32s ease-out;
}
.unit.melee .soldier{
  animation:lunge .32s;
}
@keyframes swordSwing{
  0%{transform:rotate(-60deg)}
  45%{transform:rotate(95deg)}
  100%{transform:rotate(-25deg)}
}
@keyframes lunge{
  50%{transform:translate(5px,-2px)}
}

/* =========================================================
   OKÇU
========================================================= */

.archerSoldier .chest{
  background:linear-gradient(90deg,#36583b,#68825b,#314e35);
}
.bow{
  position:absolute;
  z-index:15;
  right:-10px;top:15px;
  width:22px;height:38px;
  border-right:4px solid #714b28;
  border-radius:0 100% 100% 0;
  transform-origin:center;
}
.bow:after{
  content:"";
  position:absolute;
  right:15px;top:1px;
  width:1px;height:35px;
  background:#eee8d9;
}
.quiver{
  position:absolute;
  z-index:2;
  left:2px;top:18px;
  width:9px;height:29px;
  border:2px solid #49311f;
  border-radius:4px 4px 7px 7px;
  background:#76502f;
  transform:rotate(18deg);
}
.quiver:before{
  content:"↑↑↑";
  position:absolute;
  top:-13px;left:-3px;
  font-size:9px;
  color:#d1d1c7;
}
.unit.shoot .bow{
  animation:bowFire .32s;
}
@keyframes bowFire{
  0%,100%{transform:scaleX(1)}
  50%{transform:scaleX(.55)}
}

/* =========================================================
   YENİ AT / SÜVARİ
========================================================= */

.cavalryUnit{
  width:96px;
  height:78px;
}

.cavalryUnit .shadow{
  left:9px;
  width:77px;
  height:13px;
}

.horse{
  position:absolute;
  left:4px;
  top:20px;
  width:88px;
  height:54px;
}

.horseTorso{
  position:absolute;
  z-index:4;
  left:15px;top:14px;
  width:54px;height:27px;
  border:2px solid #4a3023;
  border-radius:48% 55% 45% 50%;
  background:
    linear-gradient(180deg,#a1734d,#815638 70%,#6a442f);
}

.horseShoulder{
  position:absolute;
  z-index:5;
  right:13px;top:12px;
  width:21px;height:31px;
  border-radius:50%;
  background:#8b5e3e;
}

.horseNeck{
  position:absolute;
  z-index:5;
  right:8px;top:-1px;
  width:17px;height:38px;
  border-radius:12px;
  border:2px solid #4a3023;
  background:#8d5f3f;
  transform:rotate(-27deg);
}

.horseHead{
  position:absolute;
  z-index:7;
  right:-7px;top:-10px;
  width:29px;height:17px;
  border:2px solid #4a3023;
  border-radius:12px 15px 11px 9px;
  background:linear-gradient(#986847,#795038);
  transform:rotate(4deg);
}

.horseHead:before{
  content:"";
  position:absolute;
  right:6px;top:5px;
  width:3px;height:3px;
  border-radius:50%;
  background:#111;
  box-shadow:0 0 2px #fff;
}

.ear{
  position:absolute;
  z-index:6;
  top:-16px;
  width:7px;height:13px;
  background:#815538;
  clip-path:polygon(50% 0,100% 100%,0 100%);
}
.ear.e1{right:5px;transform:rotate(10deg)}
.ear.e2{right:14px;transform:rotate(-8deg)}

.mane{
  position:absolute;
  z-index:3;
  right:17px;top:-1px;
  width:11px;height:36px;
  background:#35261d;
  clip-path:polygon(20% 0,100% 10%,45% 30%,100% 45%,40% 63%,90% 80%,0 100%);
}

.tail{

  <h3>Birlik Binası</h3>
  <div id="buildChoices" class="choices"></div>

    Aynı tür ve aynı seviyedeki iki binayı birbirinin üzerine sürükle.
  </div>

    <button data-up="production">⏱ Üretim +15%</button>

    <button data-up="money">🪙 +120</button>
  </div>

<script>
const game=document.getElementById("game");
const $=id=>document.getElementById(id);

let money=400;
let wallHP=1000;
let wave=0;
let waveActive=false;
let gameSpeed=1;

let damageBonus=1;
let productionBonus=1;

let buildings=[];
let units=[];
let enemies=[];
let projectiles=[];

let buildSlot=null;
let drag=null;

let enemiesToSpawn=0;
let lastSpawn=0;
let lastFrame=performance.now();

let areaPrice=120;

const slots=[
  {x:17,y:76,open:true},
  {x:37,y:81,open:true},
  {x:63,y:81,open:true},
  {x:83,y:76,open:true},
  {x:17,y:90,open:false},
  {x:83,y:90,open:false}
];

const BUILDINGS={
  barracks:{
    name:"Kışla",
    icon:"⚔",
    cost:75,
    rate:2700
  },
  archer:{
    name:"Okçu Ocağı",
    icon:"➶",
    cost:90,
    rate:3600
  },
  cavalry:{
    name:"Süvari Kışlası",
    icon:"♞",
    cost:130,
    rate:4500
  },
  artillery:{
    name:"Topçu Kışlası",
    icon:"●",
    cost:150,
    rate:5400
  }
};

const MONSTERS=[
  {type:"goblin",name:"Goblin",unlock:1,hp:.65,speed:1.25,damage:3,wall:18,reward:4},
  {type:"orc",name:"Ork",unlock:2,hp:.95,speed:1,damage:4,wall:25,reward:6},
  {type:"wolf",name:"Kurt Yaratık",unlock:3,hp:.72,speed:1.55,damage:4,wall:22,reward:7},
  {type:"raider",name:"Yağmacı",unlock:4,hp:1.15,speed:1.12,damage:5,wall:30,reward:8},
  {type:"armored",name:"Zırhlı Ork",unlock:5,hp:1.65,speed:.82,damage:7,wall:40,reward:11},
  {type:"brute",name:"Vahşi",unlock:6,hp:2,speed:.75,damage:8,wall:48,reward:14},
  {type:"ogre",name:"Ogre",unlock:7,hp:2.6,speed:.62,damage:10,wall:60,reward:18},
  {type:"warlord",name:"Savaş Lordu",unlock:8,hp:3.1,speed:.68,damage:12,wall:70,reward:22},
  {type:"demon",name:"İblis",unlock:9,hp:3.7,speed:.72,damage:13,wall:80,reward:27},
  {type:"boss",name:"Kadim Muhafız",unlock:10,hp:5,speed:.58,damage:17,wall:100,reward:40}
];

/* =========================================================
   UI
========================================================= */

function showNotice(text){
  const n=$("notice");
  n.textContent=text;
  n.classList.add("show");

  clearTimeout(showNotice.timer);
  showNotice.timer=setTimeout(()=>{
    n.classList.remove("show");
  },1500);
}

function sync(){
  $("money").textContent=Math.floor(money);
  $("wallHP").textContent=Math.max(0,Math.floor(wallHP));
  $("wave").textContent=wave;
  $("areaPrice").textContent=areaPrice;

  $("areaButton").disabled=
    money<areaPrice ||
    slots.every(s=>s.open);

  renderBuildChoices();
}

function renderBuildChoices(){
  const box=$("buildChoices");
  box.innerHTML="";

  Object.entries(BUILDINGS).forEach(([type,b])=>{
    const btn=document.createElement("button");

    btn.innerHTML=
      b.icon+" "+b.name+
      "<br>"+b.cost+" 🪙";

    btn.disabled=money<b.cost;

    btn.onclick=()=>build(type);

    box.appendChild(btn);
  });
}

/* =========================================================
   BİNALAR
========================================================= */

function buildingHTML(b){
  const extra=
    b.type==="archer"?"archerBuilding":
    b.type==="cavalry"?"cavalryBuilding":
    b.type==="artillery"?"artilleryBuilding":"";

  return `
    <div class="buildingModel ${extra}">
      <i class="bHouse"></i>
      <i class="bRoof"></i>
      <i class="bDoor"></i>
      <i class="bFlag">${BUILDINGS[b.type].icon}</i>
    </div>
    <span class="level">Lv.${b.level}</span>
    <span class="prod"><i></i></span>
  `;
}

function renderSlots(){

  document.querySelectorAll(".slot").forEach(el=>el.remove());

  slots.forEach((s,index)=>{

    if(!s.open)return;

    const el=document.createElement("div");

    el.className="slot";
    el.dataset.slot=index;
    el.style.left=s.x+"%";
    el.style.top=s.y+"%";

    const building=buildings.find(b=>b.slot===index);

    if(building){

      el.classList.add("building");
      el.innerHTML=buildingHTML(building);

      el.addEventListener("pointerdown",event=>{
        startBuildingDrag(event,building,el);
      });

    }else{

      el.innerHTML="＋<br>YAPI";

      el.addEventListener("pointerup",()=>{
        if(!drag){
          buildSlot=index;
          $("buildPanel").style.display="block";
          renderBuildChoices();
        }
      });
    }

    game.appendChild(el);
  });
}

function build(type){

  if(buildSlot===null)return;

  const data=BUILDINGS[type];

  if(money<data.cost)return;

  money-=data.cost;

  buildings.push({
    slot:buildSlot,
    type,
    level:1,
    lastProduction:performance.now()
  });

  buildSlot=null;

  $("buildPanel").style.display="none";

  renderSlots();
  sync();
}

$("closeBuild").onclick=()=>{
  buildSlot=null;
  $("buildPanel").style.display="none";
};

$("areaButton").onclick=()=>{

  const locked=slots.find(s=>!s.open);

/* =========================================================
   BİNA SÜRÜKLEME / BİRLEŞTİRME
========================================================= */

function startBuildingDrag(event,building,source){

  event.preventDefault();

  drag={
    building,
    source,
    startX:event.clientX,
    startY:event.clientY,
    moved:false,
    ghost:null
  };

  source.setPointerCapture?.(event.pointerId);

  source.addEventListener("pointermove",moveBuilding);
  source.addEventListener("pointerup",dropBuilding);
  source.addEventListener("pointercancel",dropBuilding);
}

function moveBuilding(event){

  if(!drag)return;

  const movement=Math.hypot(
    event.clientX-drag.startX,
    event.clientY-drag.startY
  );

  if(!drag.moved && movement<7)return;

  if(!drag.moved){

    drag.moved=true;

    drag.source.classList.add("dragging");

    const ghost=document.createElement("div");

    ghost.className="dragGhost";
    ghost.innerHTML=buildingHTML(drag.building);

    game.appendChild(ghost);

    drag.ghost=ghost;
  }

  const rect=game.getBoundingClientRect();

  drag.ghost.style.left=
    event.clientX-rect.left+"px";

  drag.ghost.style.top=
    event.clientY-rect.top+"px";

  document.querySelectorAll(".slot")
    .forEach(el=>el.classList.remove("mergeTarget"));

  const target=findMergeTarget(
    event.clientX,
    event.clientY,
    drag.building
  );

  if(target!==null){
    document
      .querySelector(`.slot[data-slot="${target}"]`)
      ?.classList.add("mergeTarget");
  }
}

function findMergeTarget(x,y,source){

  let target=null;
  let best=58;

  document
    .querySelectorAll(".slot.building")
    .forEach(el=>{

      const slot=Number(el.dataset.slot);

      if(slot===source.slot)return;

      const other=
        buildings.find(b=>b.slot===slot);

      if(
        !other ||
        other.type!==source.type ||
        other.level!==source.level ||
        other.level>=5
      )return;

      const r=el.getBoundingClientRect();

      const distance=Math.hypot(
        x-(r.left+r.width/2),
        y-(r.top+r.height/2)
      );

      if(distance<best){
        best=distance;
        target=slot;
      }
    });

  return target;
}

function dropBuilding(event){

  if(!drag)return;

  const old=drag;

  old.source.removeEventListener("pointermove",moveBuilding);
  old.source.removeEventListener("pointerup",dropBuilding);
  old.source.removeEventListener("pointercancel",dropBuilding);

  if(old.moved){

    const targetSlot=
      findMergeTarget(
        event.clientX,
        event.clientY,
        old.building
      );

    if(targetSlot!==null){

      const target=
        buildings.find(b=>b.slot===targetSlot);

      if(
        target &&
        target.type===old.building.type &&
        target.level===old.building.level &&
        target.level<5
      ){

        target.level++;

        target.lastProduction=
          performance.now();

        buildings=
          buildings.filter(b=>b!==old.building);

        showNotice(
          BUILDINGS[target.type].name+
          " → Lv."+target.level
        );
      }

    }else{

      showNotice(
        "Aynı tür ve seviyedeki binanın üzerine bırak."
      );
    }
  }

  old.ghost?.remove();

  document.querySelectorAll(".slot")
    .forEach(el=>{
      el.classList.remove("mergeTarget");
      el.classList.remove("dragging");
    });

  drag=null;

  renderSlots();
  sync();
}

function chooseMonster(){

  const available=
    MONSTERS.filter(m=>m.unlock<=wave);

  if(Math.random()<.34){
    return available[available.length-1];
  }

  return available[
    Math.floor(Math.random()*available.length)
  ];
}

function monsterHTML(type){

  return `

    <div class="monster ${type}">
      <i class="mLeg ml1"></i>
      <i class="mLeg ml2"></i>

      <i class="mArm ma1"></i>

  const m=chooseMonster();

    32+wave*11;

  const enemy={
    type:m.type,

    x:35+Math.random()*30,
    y:24,

    hp:baseHP*m.hp,
    maxHP:baseHP*m.hp,

      (.006+wave*.00016)*
      m.speed,

      m.damage+wave*.22,

    "enemy walk";

}

   BİRLİK OLUŞTURMA
========================================================= */

function spawnUnit(building){

  const slot=
    slots[building.slot];

  const level=
    building.level;

  const statTable={

    barracks:{
      hp:48+level*16,
      damage:10+level*6,
      speed:.010,
      range:3.4,
      attackRate:650,
      preferredY:53
    },

    archer:{
      hp:30+level*10,
      damage:10+level*7,
      speed:.007,
      range:24+level*2,
      attackRate:1000,
      preferredY:56
    },

    cavalry:{
      hp:60+level*19,
      damage:17+level*9,
      speed:.017,
      range:4.2,
      attackRate:850,
      preferredY:48
    },

    artillery:{
      hp:42+level*13,
      damage:28+level*16,
      speed:.0045,
      range:32+level*2,
      attackRate:2100,
      preferredY:58
    }
  };

  const stats=
    statTable[building.type];

  const unit={

    type:building.type,
    level,

    x:
      slot.x+
      (Math.random()-.5)*4,

    y:
      Math.min(slot.y-7,82),

    hp:stats.hp,
    maxHP:stats.hp,

    damage:
      stats.damage*
      damageBonus,

    speed:stats.speed,
    range:stats.range,

    attackRate:
      stats.attackRate,

    preferredY:
      stats.preferredY,

    lastAttack:0,

    charged:true,

    dustTimer:0,

    element:
      document.createElement("div")
  };

  unit.element.className=
    "unit walk";

  if(unit.type==="barracks"){
    unit.element.innerHTML=
      infantryHTML(level);
  }

  if(unit.type==="archer"){
    unit.element.innerHTML=
      archerHTML(level);
  }

  if(unit.type==="cavalry"){
    unit.element.classList.add("cavalryUnit");
    unit.element.innerHTML=
      cavalryHTML(level);
  }

  if(unit.type==="artillery"){
    unit.element.classList.add("artilleryUnit");
    unit.element.innerHTML=
      artilleryHTML(level);
  }

  game.appendChild(unit.element);

  units.push(unit);
}

/* =========================================================
   MATEMATİK
========================================================= */

function distance(a,b){
  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function nearestEnemy(unit){

  let target=null;
  let best=Infinity;

  enemies.forEach(enemy=>{

    const d=
      distance(unit,enemy);

    if(d<best){
      best=d;
      target=enemy;
    }
  });

  return target;
}

function nearestDefender(enemy){

  let target=null;
  let best=Infinity;

  units.forEach(unit=>{

    const d=
      distance(enemy,unit);

    if(d<best){
      best=d;
      target=unit;
    }
  });

  return target;
}

========================================================= */

function hitSpark(x,y){

  const spark=
    document.createElement("div");

  spark.className="hitSpark";

  spark.style.left=x+"%";
  spark.style.top=y+"%";

  game.appendChild(spark);

  setTimeout(()=>{
    spark.remove();
  },300);
}

function createDust(x,y){

  const dust=
    document.createElement("div");

  dust.className="dust";

  dust.style.left=
    (x+(Math.random()-.5)*2)+"%";

  dust.style.top=
    (y+2)+"%";

  game.appendChild(dust);

  setTimeout(()=>{
    dust.remove();
  },500);
}

function muzzleFlash(unit){

  const flash=
    document.createElement("div");

  flash.className=
    "muzzleFlash";

  flash.style.left=
    (unit.x+6)+"%";

  flash.style.top=
    (unit.y-1.5)+"%";

  game.appendChild(flash);

  setTimeout(()=>{
    flash.remove();
  },230);
}

function createExplosion(x,y,damage,level){

  const boom=
    document.createElement("div");

  boom.className="explosion";

  boom.style.left=x+"%";
  boom.style.top=y+"%";

  boom.innerHTML=
    '<i class="core"></i><i class="ring"></i>';

  game.appendChild(boom);

  setTimeout(()=>{
    boom.remove();
  },800);

  for(let i=0;i<6;i++){

    const smoke=
      document.createElement("div");

    smoke.className="smoke";

    smoke.style.left=
      (x+(Math.random()-.5)*5)+"%";

    smoke.style.top=
      (y+(Math.random()-.5)*3)+"%";

    game.appendChild(smoke);

    setTimeout(()=>{
      smoke.remove();
    },1300);
  }

  const radius=
    5.5+level*.9;

  [...enemies].forEach(enemy=>{

    const d=Math.hypot(
      enemy.x-x,
      enemy.y-y
    );

    if(d<=radius){

      damageEnemy(
        enemy,
        damage*
        (d<2.3 ? 1 : .55)
      );
    }
  });
}

/* =========================================================
   HASAR
========================================================= */

function damageEnemy(enemy,damage){

  if(!enemy ||
     !enemies.includes(enemy))return;

  enemy.hp-=damage;

  enemy.element.classList.remove("hit");

  void enemy.element.offsetWidth;

  enemy.element.classList.add("hit");

  hitSpark(enemy.x,enemy.y);

  if(enemy.hp<=0){

    money+=
      5+
      wave+
      enemy.reward;

    enemy.element.remove();

    enemies=
      enemies.filter(e=>e!==enemy);

    sync();
  }
}

function damageUnit(unit,damage){

  if(!unit ||
     !units.includes(unit))return;

  unit.hp-=damage;

  unit.element.animate(
    [
      {transform:"translate(-50%,-50%)"},
      {transform:"translate(-50%,-50%) translateX(6px)"},
      {transform:"translate(-50%,-50%)"}
    ],
    {duration:180}
  );

  if(unit.hp<=0){

    unit.element.remove();

    units=
      units.filter(u=>u!==unit);
  }
}

/* =========================================================
   MERMİ
========================================================= */

function fireProjectile(unit,target,type){

  if(!target)return;

  if(type==="cannon"){

    unit.element.classList.remove("fire");
    void unit.element.offsetWidth;
    unit.element.classList.add("fire");

    muzzleFlash(unit);

  }else{

    unit.element.classList.remove("shoot");
    void unit.element.offsetWidth;
    unit.element.classList.add("shoot");
  }

  const projectile={

    x:unit.x,
    y:unit.y,

    target,
    type,

    damage:unit.damage,
    level:unit.level,

    element:
      document.createElement("div")
  };

  projectile.element.className=
    "projectile "+
    (
      type==="cannon"
      ?"cannonball"
      :"arrowProjectile"
    );

  game.appendChild(
    projectile.element
  );

  projectiles.push(
    projectile
  );
}

/* =========================================================
   BİNA ÜRETİMİ
========================================================= */

function updateBuildings(time){

  if(!waveActive)return;

  buildings.forEach(building=>{

    const data=
      BUILDINGS[building.type];

    const productionTime=
      data.rate/
      (1+(building.level-1)*.20)/
      productionBonus;

    const slot=
      document.querySelector(
        `.slot[data-slot="${building.slot}"]`
      );

    const bar=
      slot?.querySelector(".prod i");

    const effective=
      productionTime/gameSpeed;

    if(bar){

      bar.style.width=
        Math.min(
          100,
          (time-building.lastProduction)/
          effective*100
        )+"%";
    }

    if(
      time-building.lastProduction>
      effective
    ){

      building.lastProduction=time;

      spawnUnit(building);
    }
  });
}

/* =========================================================
   BİRLİK HAREKET / SAVAŞ
========================================================= */

function drawUnit(unit){

  unit.element.style.left=
    unit.x+"%";

  unit.element.style.top=
    unit.y+"%";
}

function moveUnit(unit,dx,dy,distanceValue,amount,dt){

  unit.x+=
    dx/distanceValue*
    amount*
    dt;

  unit.y+=
    dy/distanceValue*
    amount*
    dt;

  unit.element.classList.add("walk");

  unit.dustTimer+=dt;

  if(unit.dustTimer>350){

    if(
      unit.type==="cavalry" ||
      unit.type==="artillery"
    ){
      createDust(unit.x,unit.y);
    }

    unit.dustTimer=0;
  }
}

function updateUnits(time,dt){

  for(const unit of [...units]){

    const enemy=
      nearestEnemy(unit);

    if(!enemy){

      const dx=
        50-unit.x;

      const dy=
        unit.preferredY-unit.y;

      const d=
        Math.hypot(dx,dy)||1;

      if(d>2){

        moveUnit(
          unit,
          dx,dy,d,
          unit.speed*.45,
          dt
        );

      }else{

        unit.element
          .classList.remove("walk");
      }

      drawUnit(unit);

      continue;
    }

    const dx=
      enemy.x-unit.x;

    const dy=
      enemy.y-unit.y;

    const d=
      Math.hypot(dx,dy)||1;

    /* PİYADE */

    if(unit.type==="barracks"){

      if(d>unit.range){

        moveUnit(
          unit,
          dx,dy,d,
          unit.speed,
          dt
        );

      }else{

        unit.element
          .classList.remove("walk");

        if(
          time-unit.lastAttack>
          unit.attackRate/gameSpeed
        ){

          unit.lastAttack=time;

          unit.element
            .classList.remove("melee");

          void unit.element.offsetWidth;

          unit.element
            .classList.add("melee");

          damageEnemy(
            enemy,
            unit.damage
          );
        }
      }
    }

    /* OKÇU */

    else if(unit.type==="archer"){

      if(d>unit.range){

        moveUnit(
          unit,
          dx,dy,d,
          unit.speed,
          dt
        );

      }else if(d<11){

        moveUnit(
          unit,
          -dx,-dy,d,
          unit.speed*.55,
          dt
        );

      }else{

        unit.element
          .classList.remove("walk");

        if(
          time-unit.lastAttack>
          unit.attackRate/gameSpeed
        ){

          unit.lastAttack=time;

          fireProjectile(
            unit,
            enemy,
            "arrow"
          );
        }
      }
    }

    /* SÜVARİ */

    else if(unit.type==="cavalry"){

      if(d>unit.range){

        moveUnit(
          unit,
          dx,dy,d,
          unit.speed,
          dt
        );

      }else{

        unit.element
          .classList.remove("walk");

        if(
          time-unit.lastAttack>
          unit.attackRate/gameSpeed
        ){

          unit.lastAttack=time;

          unit.element
            .classList.remove("charge");

          void unit.element.offsetWidth;

          unit.element
            .classList.add("charge");

          let damage=
            unit.damage;

          if(unit.charged){

            damage*=1.8;

            unit.charged=false;
          }

          damageEnemy(
            enemy,
            damage
          );
        }
      }
    }

    /* TOPÇU */

    else if(unit.type==="artillery"){

      if(d>unit.range){

        moveUnit(
          unit,
          dx,dy,d,
          unit.speed,
          dt
        );

      }else if(d<14){

        moveUnit(
          unit,
          -dx,-dy,d,
          unit.speed*.7,
          dt
        );

      }else{

        unit.element
          .classList.remove("walk");

        if(
          time-unit.lastAttack>
          unit.attackRate/gameSpeed
        ){

          unit.lastAttack=time;

          fireProjectile(
            unit,
            enemy,
            "cannon"
          );
        }
      }
    }

    unit.x=
      Math.max(
        6,
        Math.min(94,unit.x)
      );

    unit.y=
      Math.max(
        25,
        Math.min(83,unit.y)
      );

    drawUnit(unit);
  }
}

/* =========================================================
   DÜŞMAN AI
   BİR SAVUNMACI BİLE VARSA SURA SALDIRAMAZ
========================================================= */

function updateEnemies(time,dt){

  for(const enemy of [...enemies]){

    if(units.length>0){

      const defender=
        nearestDefender(enemy);

      if(defender){

        const dx=
          defender.x-enemy.x;

        const dy=
          defender.y-enemy.y;

        const d=
          Math.hypot(dx,dy)||1;

        if(d>3.7){

          enemy.element
            .classList.add("walk");

          enemy.x+=
            dx/d*
            enemy.speed*
            dt;

          enemy.y+=
            dy/d*
            enemy.speed*
            dt;

        }else{

          enemy.element
            .classList.remove("walk");

          if(
            time-enemy.lastAttack>
            850/gameSpeed
          ){

            enemy.lastAttack=time;

            damageUnit(
              defender,
              enemy.damage
            );
          }
        }
      }

    }else{

      /* SADECE SAVUNMACI KALMADIYSA KAPIYA GİDER */

      const gateX=50;
      const gateY=61;

      const dx=
        gateX-enemy.x;

      const dy=
        gateY-enemy.y;

      const d=
        Math.hypot(dx,dy)||1;

      enemy.element
        .classList.add("walk");

      enemy.x+=
        dx/d*
        enemy.speed*
        dt;

      enemy.y+=
        dy/d*
        enemy.speed*
        dt;

      if(d<1.6){

        wallHP-=
          enemy.wallDamage;

        enemy.element.remove();

        enemies=
          enemies.filter(e=>e!==enemy);

        sync();

        if(wallHP<=0){

          wallHP=0;

          waveActive=false;

          $("waveButton").disabled=true;

          showNotice("SUR YIKILDI!");

          sync();

          continue;
        }
      }
    }

    enemy.element.style.left=
      enemy.x+"%";

    enemy.element.style.top=
      enemy.y+"%";

    const hp=
      enemy.element.querySelector(
        ".hpbar i"
      );

    if(hp){

      hp.style.width=
        Math.max(
          0,
          enemy.hp/enemy.maxHP*100
        )+"%";
    }
  }
}

/* =========================================================
   MERMİ HAREKETİ
========================================================= */

function updateProjectiles(dt){

  for(const projectile of [...projectiles]){

    if(
      !projectile.target ||
      !enemies.includes(projectile.target)
    ){

      projectile.element.remove();

      projectiles=
        projectiles.filter(
          p=>p!==projectile
        );

      continue;
    }

    const dx=
      projectile.target.x-
      projectile.x;

    const dy=
      projectile.target.y-
      projectile.y;

    const d=
      Math.hypot(dx,dy)||1;

    const speed=
      projectile.type==="cannon"
      ?.024
      :.045;

    if(d<1.7){

      const x=
        projectile.target.x;

      const y=
        projectile.target.y;

      if(
        projectile.type==="cannon"
      ){

        createExplosion(
          x,
          y,
          projectile.damage,
          projectile.level
        );

      }else{

        damageEnemy(
          projectile.target,
          projectile.damage
        );
      }

      projectile.element.remove();

      projectiles=
        projectiles.filter(
          p=>p!==projectile
        );

      continue;
    }

    projectile.x+=
      dx/d*
      speed*
      dt;

    projectile.y+=
      dy/d*
      speed*
      dt;

    projectile.element.style.left=
      projectile.x+"%";

    projectile.element.style.top=
      projectile.y+"%";

    if(
      projectile.type==="arrow"
    ){

      projectile.element.style.transform=
        `translate(-50%,-50%)
         rotate(${Math.atan2(dy,dx)*180/Math.PI}deg)`;
    }
  }
}

/* =========================================================
   DALGA SONU
========================================================= */

function checkWaveEnd(){

  if(
    !waveActive ||
    enemiesToSpawn>0 ||
    enemies.length>0
  )return;

  waveActive=false;

  units.forEach(unit=>{
    unit.element.remove();
  });

  units=[];

  projectiles.forEach(p=>{
    p.element.remove();
  });

  projectiles=[];

  document
    .querySelectorAll(".prod i")
    .forEach(el=>{
      el.style.width="0%";
    });

  $("waveButton").disabled=false;

  $("upgradePanel").style.display="block";
}

/* =========================================================
   DALGA ÖDÜLÜ
========================================================= */

document
  .querySelectorAll("[data-up]")
  .forEach(button=>{

    button.onclick=()=>{

      const type=
        button.dataset.up;

      if(type==="damage"){
        damageBonus*=1.20;
      }

      if(type==="production"){
        productionBonus*=1.15;
      }

      if(type==="wall"){
        wallHP=
          Math.min(
            1500,
            wallHP+100
          );
      }

      if(type==="money"){
        money+=120;
      }

      $("upgradePanel").style.display="none";

      sync();
    };
  });

/* =========================================================
   ANA LOOP
========================================================= */

function loop(time){

  const realDT=
    Math.min(
      40,
      time-lastFrame
    );

  const dt=
    realDT*
    gameSpeed;

  lastFrame=time;

  if(
    waveActive &&
    enemiesToSpawn>0 &&
    time-lastSpawn>
      700/gameSpeed
  ){

    spawnEnemy();

    enemiesToSpawn--;

    lastSpawn=time;
  }

  updateBuildings(time);
  updateUnits(time,dt);
  updateEnemies(time,dt);
  updateProjectiles(dt);

  checkWaveEnd();

  requestAnimationFrame(loop);
}

/* =========================================================
   BAŞLAT
========================================================= */

renderSlots();
sync();

requestAnimationFrame(loop);
</script>
