<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sur Savunması V9</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#17241d;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#g{
  position:relative;
  width:min(100vw,520px);
  height:100dvh;
  margin:auto;
  overflow:hidden;
  touch-action:manipulation;
  background:
    linear-gradient(
      #82bddd 0 20%,
      #a8cc79 20% 54%,
      #b79764 54% 100%
    );
}

/* =========================================================
   ARKA PLAN
========================================================= */

.sun{
  position:absolute;
  z-index:0;
  right:10%;
  top:8%;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#ffe08a;
  box-shadow:0 0 25px #ffe8a9;
}

.mountains{
  position:absolute;
  z-index:0;
  top:10%;
  left:0;
  right:0;
  height:23%;
  overflow:hidden;
}

.mountain{
  position:absolute;
  bottom:-65px;
  width:210px;
  height:190px;
  transform:rotate(45deg);
  border-radius:22px;
  background:linear-gradient(135deg,#839e76,#58735e);
}

.mountain:after{
  content:"";
  position:absolute;
  left:2px;
  top:2px;
  width:58px;
  height:58px;
  background:#e6e9d7;
  clip-path:polygon(0 0,100% 0,0 100%);
}

.m1{left:-80px}
.m2{
  left:105px;
  width:240px;
  height:210px;
  background:linear-gradient(135deg,#95aa79,#687f64);
}
.m3{right:-90px}

.road{
  position:absolute;
  z-index:1;
  top:25%;
  left:34%;
  width:32%;
  height:34%;
  clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);
  background:
    linear-gradient(
      90deg,
      #a88b60,
      #d4b982 48%,
      #ad8e61
    );
}

.grass{
  position:absolute;
  z-index:1;
  top:20%;
  left:0;
  right:0;
  height:35%;
  opacity:.7;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 7% 25%,#527843 0 3px,transparent 4px),
    radial-gradient(ellipse at 16% 66%,#527843 0 3px,transparent 4px),
    radial-gradient(ellipse at 27% 40%,#668b4c 0 2px,transparent 3px),
    radial-gradient(ellipse at 74% 32%,#668b4c 0 2px,transparent 3px),
    radial-gradient(ellipse at 85% 70%,#527843 0 3px,transparent 4px),
    radial-gradient(ellipse at 94% 30%,#527843 0 3px,transparent 4px);
}

.trees{
  position:absolute;
  z-index:2;
  top:25%;
  left:0;
  right:0;
  height:27%;
  pointer-events:none;
}

.tree{
  position:absolute;
  width:34px;
  height:52px;
}

.tree:before{
  content:"";
  position:absolute;
  left:14px;
  bottom:0;
  width:7px;
  height:20px;
  background:#67472c;
  border-radius:3px;
}

.tree:after{
  content:"";
  position:absolute;
  left:1px;
  top:0;
  width:32px;
  height:39px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,#72a65c 0 23%,transparent 24%),
    radial-gradient(circle at 67% 30%,#5c934c 0 26%,transparent 27%),
    radial-gradient(circle at 50% 62%,#3f743a 0 44%,transparent 45%);
  filter:drop-shadow(0 4px 2px #0003);
}

.tree1{left:2%;top:3%}
.tree2{left:10%;top:48%;transform:scale(.8)}
.tree3{right:2%;top:8%}
.tree4{right:10%;top:50%;transform:scale(.85)}

/* =========================================================
   SUR
========================================================= */

.wall{
  position:absolute;
  z-index:8;
  top:53%;
  left:-2%;
  width:104%;
  height:78px;
  border-top:5px solid #696962;
  border-bottom:7px solid #5e5e58;
  background:
    linear-gradient(#999a91 0 8px,transparent 8px),
    repeating-linear-gradient(
      90deg,
      #b8b7ab 0 38px,
      #8d8d84 38px 42px,
      #aaa99e 42px 76px
    );
  box-shadow:
    0 8px 0 #0002,
    inset 0 7px 0 #d5d3c7;
}

.wall:before{
  content:"";
  position:absolute;
  top:-18px;
  left:0;
  right:0;
  height:21px;
  background:
    repeating-linear-gradient(
      90deg,
      #aaa99d 0 27px,
      transparent 27px 39px
    );
}

.gate{
  position:absolute;
  left:50%;
  bottom:-1px;
  transform:translateX(-50%);
  width:28%;
  height:73px;
  border:6px solid #575149;
  border-bottom:0;
  border-radius:45px 45px 0 0;
  background:
    repeating-linear-gradient(
      90deg,
      #875b3b 0 11px,
      #5e3e2a 11px 14px
    );
  box-shadow:inset 0 0 0 3px #aa7b50;
}

.gate:after{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:4px;
  background:#503426;
  transform:translateX(-50%);
}

.wallTower{
  position:absolute;
  z-index:2;
  bottom:-7px;
  width:52px;
  height:96px;
  background:#aaa99e;
  border:5px solid #62625d;
}

.wallTower.left{left:3%}
.wallTower.right{right:3%}

.wallTower:before{
  content:"";
  position:absolute;
  top:-14px;
  left:-5px;
  width:52px;
  height:18px;
  background:
    repeating-linear-gradient(
      90deg,
      #aaa99e 0 12px,
      transparent 12px 19px
    );
}

/* =========================================================
   İÇ AVLU / KALE
========================================================= */

.courtyard{
  position:absolute;
  z-index:0;
  top:61%;
  left:0;
  right:0;
  bottom:0;
  background:
    radial-gradient(circle at 14% 25%,#d6bd88 0 3px,transparent 4px),
    radial-gradient(circle at 86% 28%,#d6bd88 0 3px,transparent 4px),
    radial-gradient(circle at 40% 75%,#9e8155 0 2px,transparent 3px),
    radial-gradient(circle at 64% 68%,#9e8155 0 2px,transparent 3px),
    linear-gradient(#c4a771,#aa8a58);
}

.castle{
  position:absolute;
  z-index:2;
  left:50%;
  bottom:8%;
  width:112px;
  height:83px;
  transform:translateX(-50%);
  pointer-events:none;
  filter:drop-shadow(0 6px 3px #0004);
}

.keep{
  position:absolute;
  left:23px;
  bottom:0;
  width:66px;
  height:62px;
  border:4px solid #62625d;
  background:#aaa99f;
}

.keep:before{
  content:"";
  position:absolute;
  top:-15px;
  left:-4px;
  width:66px;
  height:19px;
  background:
    repeating-linear-gradient(
      90deg,
      #aaa99f 0 14px,
      transparent 14px 22px
    );
}

.keepDoor{
  position:absolute;
  left:50%;
  bottom:-4px;
  width:22px;
  height:29px;
  transform:translateX(-50%);
  border:3px solid #4b3528;
  border-radius:13px 13px 0 0;
  background:#694832;
}

.castleTower{
  position:absolute;
  bottom:0;
  width:31px;
  height:73px;
  border:4px solid #595a56;
  background:#96968e;
}

.castleTower.left{left:0}
.castleTower.right{right:0}

.castleTower:before{
  content:"";
  position:absolute;
  top:-13px;
  left:-4px;
  width:31px;
  height:17px;
  background:
    repeating-linear-gradient(
      90deg,
      #96968e 0 8px,
      transparent 8px 13px
    );
}

/* =========================================================
   HUD
========================================================= */

.hud{
  position:absolute;
  z-index:60;
  top:max(8px,env(safe-area-inset-top));
  left:8px;
  right:8px;
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.pill{
  min-width:86px;
  padding:8px 9px;
  border:2px solid #ffffff80;
  border-radius:18px;
  text-align:center;
  font-size:14px;
  font-weight:900;
  background:linear-gradient(#344b40ee,#1d3229ee);
  box-shadow:0 4px 8px #0003;
}

/* =========================================================
   YAPI ALANLARI
========================================================= */

.slot{
  position:absolute;
  z-index:15;
  width:62px;
  height:62px;
  display:grid;
  place-items:center;
  text-align:center;
  border:3px dashed #725b3c;
  border-radius:50%;
  color:#4a3a28;
  background:#f4dda66f;
  font-size:11px;
  font-weight:900;
  box-shadow:0 3px 5px #0002;
}

.slot:not(.building):after{
  content:"";
  position:absolute;
  inset:6px;
  border:1px solid #fff8;
  border-radius:50%;
}

.building{
  border:0!important;
  background:transparent!important;
  box-shadow:none!important;
  overflow:visible!important;
}

.building.selected .mini{
  transform:scale(1.1);
  filter:
    drop-shadow(0 0 5px #ffe45f)
    drop-shadow(0 0 10px #ffe45f);
}

.mini{
  position:relative;
  display:block;
  width:62px;
  height:58px;
  filter:drop-shadow(0 4px 2px #0004);
}

.mini .base{
  position:absolute;
  left:8px;
  right:8px;
  bottom:2px;
  height:34px;
  border:3px solid #5d4835;
  border-radius:5px;
  background:linear-gradient(#dfc18a,#b88d5c);
}

.mini .roof{
  position:absolute;
  left:3px;
  right:3px;
  top:1px;
  height:29px;
  border:3px solid #604333;
  clip-path:polygon(50% 0,100% 100%,0 100%);
  background:#a54c3e;
}

.mini.archer .roof{background:#397695}
.mini.mage .roof{background:#714a9b}
.mini.tower .roof{background:#506d7d}
.mini.catapult .roof{background:#80583d}

.mini .door{
  position:absolute;
  left:25px;
  bottom:4px;
  width:13px;
  height:17px;
  border:2px solid #513728;
  border-radius:7px 7px 0 0;
  background:#704c34;
}

.mini .sign{
  position:absolute;
  z-index:4;
  right:-1px;
  top:19px;
  width:25px;
  height:25px;
  display:grid;
  place-items:center;
  border:2px solid #604833;
  border-radius:50%;
  background:#fff0c9;
  font-size:14px;
}

.mini.lv3 .base{
  box-shadow:inset 0 0 0 2px #8d9090;
}

.mini.lv4 .base{
  box-shadow:inset 0 0 0 3px #68747a;
}

.mini.lv5 .base{
  box-shadow:
    inset 0 0 0 3px #cda63f,
    0 0 8px #ffd85c;
}

.lvl{
  position:absolute;
  z-index:8;
  left:0;
  bottom:0;
  padding:2px 5px;
  border-radius:7px;
  background:#58398b;
  color:#fff;
  font-size:9px;
}

.prod{
  position:absolute;
  left:7px;
  right:7px;
  bottom:-4px;
  height:6px;
  overflow:hidden;
  border:1px solid #fff;
  border-radius:6px;
  background:#27382e;
}

.prod i{
  display:block;
  width:0;
  height:100%;
  background:#f4c953;
}

/* =========================================================
   İNSAN ASKERLER
========================================================= */

.unit{
  position:absolute;
  z-index:14;
  width:34px;
  height:48px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.soldier{
  position:absolute;
  left:2px;
  top:1px;
  width:30px;
  height:44px;
  transform-origin:50% 90%;
  animation:soldierBob .34s ease-in-out infinite alternate;
  filter:drop-shadow(0 3px 2px #0005);
}

.soldier:after{
  content:"";
  position:absolute;
  z-index:-3;
  left:3px;
  bottom:-4px;
  width:24px;
  height:6px;
  border-radius:50%;
  background:#0004;
}

.head{
  position:absolute;
  z-index:6;
  left:10px;
  top:3px;
  width:11px;
  height:12px;
  border:1px solid #704b34;
  border-radius:50%;
  background:#dca574;
}

.hair{
  position:absolute;
  z-index:7;
  left:9px;
  top:2px;
  width:13px;
  height:6px;
  border-radius:8px 8px 3px 3px;
  background:#563b2b;
}

.helmet{
  position:absolute;
  z-index:8;
  left:8px;
  top:0;
  width:15px;
  height:10px;
  border:1px solid #3e474c;
  border-radius:9px 9px 3px 3px;
  background:linear-gradient(#a4adb1,#616c72);
}

.torso{
  position:absolute;
  z-index:4;
  left:7px;
  top:14px;
  width:17px;
  height:17px;
  border:1px solid #4b392c;
  border-radius:5px 5px 3px 3px;
}

.torso:after{
  content:"";
  position:absolute;
  left:-1px;
  right:-1px;
  bottom:1px;
  height:3px;
  background:#604229;
}

.arm{
  position:absolute;
  z-index:3;
  top:15px;
  width:5px;
  height:17px;
  border-radius:4px;
  transform-origin:50% 2px;
}

.armL{
  left:4px;
  animation:armLeft .34s ease-in-out infinite alternate;
}

.armR{
  right:3px;
  animation:armRight .34s ease-in-out infinite alternate;
}

.leg{
  position:absolute;
  z-index:2;
  top:29px;
  width:6px;
  height:14px;
  border-radius:3px;
  background:#4b4036;
  transform-origin:50% 1px;
}

.legL{
  left:7px;
  animation:legLeft .34s ease-in-out infinite alternate;
}

.legR{
  right:6px;
  animation:legRight .34s ease-in-out infinite alternate;
}

.leg:after{
  content:"";
  position:absolute;
  left:-1px;
  bottom:-2px;
  width:8px;
  height:4px;
  border-radius:3px;
  background:#292724;
}

.sword{
  position:absolute;
  z-index:10;
  right:-5px;
  top:8px;
  width:4px;
  height:25px;
  border:1px solid #455058;
  border-radius:3px;
  background:linear-gradient(90deg,#79858c,#f3f6f3,#78848b);
  transform:rotate(-30deg);
  transform-origin:50% 90%;
}

.sword:before{
  content:"";
  position:absolute;
  left:-4px;
  bottom:3px;
  width:11px;
  height:3px;
  border-radius:2px;
  background:#9c743d;
}

.shield{
  position:absolute;
  z-index:9;
  left:-4px;
  top:15px;
  width:15px;
  height:19px;
  border:2px solid #493626;
  border-radius:7px 7px 10px 10px;
  background:
    linear-gradient(
      90deg,
      #a83f38 0 47%,
      #d4a23e 48% 52%,
      #8c302e 53%
    );
  transform:rotate(-9deg);
}

/* Kışla seviyeleri */

.warriorHuman.lv1 .torso{
  background:#876447;
}

.warriorHuman.lv1 .arm{
  background:linear-gradient(#8b684a 0 55%,#d69e6d 56%);
}

.warriorHuman.lv2 .torso{
  background:linear-gradient(90deg,#3f5d72,#68849a,#344e60);
}

.warriorHuman.lv2 .arm{
  background:linear-gradient(#506d82 0 60%,#d69e6d 61%);
}

.warriorHuman.lv3 .torso{
  background:
    repeating-linear-gradient(
      0deg,
      #7d898e 0 3px,
      #aab3b5 3px 5px
    );
}

.warriorHuman.lv3 .arm{
  background:linear-gradient(#7c888d 0 70%,#d69e6d 71%);
}

.warriorHuman.lv4 .torso{
  border:2px solid #343e43;
  background:linear-gradient(90deg,#515e65,#9ba6aa,#46535a);
}

.warriorHuman.lv4 .shield{
  width:17px;
  height:21px;
  background:#71808a;
}

.warriorHuman.lv5 .torso{
  border:2px solid #d3aa43;
  background:linear-gradient(90deg,#49555c,#bcc5c7,#56636a);
  box-shadow:0 0 6px #ffd65c;
}

.warriorHuman.lv5 .helmet{
  border-color:#d2a43b;
}

.warriorHuman.lv5 .shield{
  width:18px;
  height:22px;
  border-color:#d1a63d;
}

/* OKÇU */

.bow{
  position:absolute;
  z-index:9;
  right:-8px;
  top:9px;
  width:17px;
  height:28px;
  border-right:3px solid #76502d;
  border-radius:0 100% 100% 0;
  transform:rotate(-8deg);
  transform-origin:50% 50%;
}

.bow:after{
  content:"";
  position:absolute;
  right:11px;
  top:1px;
  width:1px;
  height:25px;
  background:#eee8d9;
  transform:rotate(-10deg);
}

.quiver{
  position:absolute;
  z-index:1;
  left:2px;
  top:10px;
  width:7px;
  height:23px;
  border:1px solid #50351f;
  border-radius:3px 3px 6px 6px;
  background:#7b512d;
  transform:rotate(17deg);
}

.quiver:before,
.quiver:after{
  content:"";
  position:absolute;
  top:-8px;
  width:2px;
  height:12px;
  background:#ddd0a9;
}

.quiver:before{left:1px}
.quiver:after{right:1px}

.archerHuman.lv1 .torso{
  background:#59784c;
}

.archerHuman.lv1 .arm{
  background:linear-gradient(#56794a 0 55%,#d69e6d 56%);
}

.archerHuman.lv2 .torso{
  background:linear-gradient(90deg,#5c4932,#876844,#4c3c2b);
}

.archerHuman.lv2 .arm{
  background:linear-gradient(#66523a 0 60%,#d69e6d 61%);
}

.archerHuman.lv3 .torso{
  background:linear-gradient(90deg,#536653,#859381,#465847);
}

.archerHuman.lv3 .arm{
  background:linear-gradient(#637463 0 72%,#d69e6d 73%);
}

.archerHuman.lv4 .torso{
  border:2px solid #283a2d;
  background:linear-gradient(90deg,#334e3a,#71866a,#2c4534);
}

.archerHuman.lv4 .bow{
  height:31px;
  border-right-width:4px;
}

.archerHuman.lv5 .torso{
  border:2px solid #c6a03d;
  background:linear-gradient(90deg,#304c38,#83977d,#294331);
  box-shadow:0 0 5px #d9bd62;
}

.archerHuman.lv5 .bow{
  height:33px;
  border-right:4px solid #c59a42;
}

@keyframes soldierBob{
  from{transform:translateY(0)}
  to{transform:translateY(-2px)}
}

@keyframes legLeft{
  from{transform:rotate(25deg)}
  to{transform:rotate(-25deg)}
}

@keyframes legRight{
  from{transform:rotate(-25deg)}
  to{transform:rotate(25deg)}
}

@keyframes armLeft{
  from{transform:rotate(-20deg)}
  to{transform:rotate(20deg)}
}

@keyframes armRight{
  from{transform:rotate(20deg)}
  to{transform:rotate(-20deg)}
}

.unit.meleeAttack .sword{
  animation:swordAttack .18s ease-out 2 alternate;
}

@keyframes swordAttack{
  from{transform:rotate(-35deg)}
  to{transform:rotate(60deg)}
}

.unit.bowAttack .bow{
  animation:bowAttack .2s ease-out 2 alternate;
}

@keyframes bowAttack{
  from{transform:rotate(-8deg) scaleX(1)}
  to{transform:rotate(-3deg) scaleX(.7)}
}

/* =========================================================
   CANAVARLAR
========================================================= */

.enemy{
  position:absolute;
  z-index:12;
  width:48px;
  height:55px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.monster{
  position:absolute;
  left:50%;
  bottom:2px;
  width:38px;
  height:47px;
  transform:translateX(-50%);
  filter:drop-shadow(0 4px 2px #0005);
  animation:monsterBob .34s ease-in-out infinite alternate;
}

.monsterShadow{
  position:absolute;
  z-index:-5;
  left:5px;
  bottom:-2px;
  width:29px;
  height:7px;
  border-radius:50%;
  background:#0005;
}

.mBody{
  position:absolute;
  z-index:4;
  left:8px;
  top:18px;
  width:22px;
  height:21px;
  border:2px solid #263426;
  border-radius:8px;
  background:#5c814b;
}

.mHead{
  position:absolute;
  z-index:7;
  left:9px;
  top:4px;
  width:20px;
  height:19px;
  border:2px solid #263426;
  border-radius:48% 48% 42% 42%;
  background:#72a05b;
}

.mEye{
  position:absolute;
  z-index:10;
  top:10px;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#ffe54e;
  box-shadow:0 0 3px #fff16d;
}

.mEye.e1{left:13px}
.mEye.e2{right:10px}

.mMouth{
  position:absolute;
  z-index:10;
  left:14px;
  top:17px;
  width:11px;
  height:5px;
  border-radius:2px 2px 6px 6px;
  background:#2a1616;
}

.mMouth:before,
.mMouth:after{
  content:"";
  position:absolute;
  top:0;
  width:3px;
  height:5px;
  background:#eee6cf;
  clip-path:polygon(0 0,100% 0,50% 100%);
}

.mMouth:before{left:1px}
.mMouth:after{right:1px}

.mArm{
  position:absolute;
  z-index:3;

<body>

  </div>

      <div class="keepDoor"></div>
    </div>

    <div class="castleTower right"></div>

  <div class="hud">
    <span class="pill">🪙 <b id="money">300</b></span>
    <span class="pill">❤️ <b id="wallhp">1000</b></span>

  </div>

    <button id="waveBtn">⚔️ Dalga Başlat</button>

    <button id="slotBtn">
      ➕ Alan —
      <span id="slotPrice">100</span>🪙
    </button>

    <button id="speedBtn">⏩ x1</button>
  </div>

  <div id="panel" class="panel">
    <h3>🏗️ Yapı seç</h3>

    <div id="choices" class="choices"></div>

    <div class="note">
      Aynı tür ve seviyedeki iki yapıya sırayla dokun.
      Yapılar Lv.5'e kadar birleşebilir.
    </div>

    <button onclick="closePanel()">Kapat</button>
  </div>

  <div id="upgrade" class="panel">
    <h3>🏆 Dalga Tamamlandı</h3>

    <div class="choices">
      <button onclick="upgrade('dmg')">⚔️ Hasar +20%</button>
      <button onclick="upgrade('rate')">⏱️ Hız +15%</button>
      <button onclick="upgrade('wall')">❤️ Sur +100</button>
      <button onclick="upgrade('coin')">🪙 +100</button>
    </div>
  </div>

<script>

/* =========================================================
   TEMEL DEĞİŞKENLER
========================================================= */

const G=document.getElementById('g');
const $=id=>document.getElementById(id);

let money=300;
let wall=1000;
let wave=0;

let active=false;
let speed=1;
let slotPrice=100;

let sel=null;
let buildSlot=null;

let dmgMul=1;
let rateMul=1;

let enemies=[];
let units=[];
let projectiles=[];
let buildings=[];

let spawnLeft=0;
let lastSpawn=0;
let lastT=performance.now();

/* =========================================================
   YAPI ALANLARI

   BAŞLANGIÇTA 4 ADET AÇIK.
   GERÇEKTEN SİMETRİK:
   
        1        4
          2    3

           KALE

   5 ve 6 sonradan açılır.
========================================================= */

const slots=[
  {x:17,y:68,o:1},
  {x:34,y:77,o:1},
  {x:66,y:77,o:1},
  {x:83,y:68,o:1},

  {x:20,y:86,o:0},
  {x:80,y:86,o:0}
];

/* =========================================================
   YAPILAR
========================================================= */

const D={

  barracks:{
    n:'Kışla',
    i:'🛡️',
    c:75,
    r:2200,
    d:9
  },

  archer:{
    n:'Okçu Ocağı',
    i:'🏹',
    c:90,
    r:3300,
    d:12
  },

  mage:{
    n:'Büyücü Kulesi',
    i:'🔮',
    c:135,
    r:1700,
    d:20,
    def:1
  },

  tower:{
    n:'Okçu Kulesi',
    i:'🗼',
    c:125,
    r:1200,
    d:8,
    def:1
  },

  catapult:{
    n:'Mancınık',
    i:'☄️',
    c:150,
    r:2400,
    d:25,
    def:1
  }

};

/* =========================================================
   DÜŞMAN TÜRLERİ
========================================================= */

const MONSTERS={

  goblin:{
    name:'Goblin',
    unlock:1,
    hp:.72,
    speed:1.20,
    wall:20,
    reward:4,
    attack:3
  },

  orc:{
    name:'Ork',
    unlock:2,
    hp:1.10,
    speed:1,
    wall:32,
    reward:7,
    attack:5
  },

  wolf:{
    name:'Kurt Yaratık',
    unlock:3,
    hp:.78,
    speed:1.55,
    wall:26,
    reward:8,
    attack:4
  },

  armored:{
    name:'Zırhlı Ork',
    unlock:5,
    hp:1.85,
    speed:.78,
    wall:45,
    reward:13,
    attack:7
  },

  ogre:{
    name:'Ogre',
    unlock:7,
    hp:2.8,
    speed:.60,
    wall:65,
    reward:22,
    attack:10
  },

  demon:{
    name:'Şeytanî Muhafız',
    unlock:10,
    hp:4.2,
    speed:.68,
    wall:90,
    reward:35,
    attack:14
  }

};

/* =========================================================
   HUD
========================================================= */

function sync(){

  $('money').textContent=
    Math.floor(money);

  $('wallhp').textContent=
    Math.max(0,Math.floor(wall));

  $('wave').textContent=
    wave;

  $('slotPrice').textContent=
    slotPrice;

  $('slotBtn').disabled=
    money<slotPrice ||
    slots.every(s=>s.o);

  choices();
}

/* =========================================================
   YAPI MENÜSÜ
========================================================= */

function choices(){

  const c=$('choices');

  c.innerHTML='';

  for(const [k,d] of Object.entries(D)){

    const b=
      document.createElement('button');

    b.innerHTML=
      `${d.i} ${d.n}<br>${d.c}🪙`;

    b.disabled=
      money<d.c;

    b.onclick=
      ()=>build(k);

    c.appendChild(b);
  }
}

function buildingHTML(b){

  const mark=
    b.t==='barracks' ? '⚔️' :
    b.t==='archer'   ? '🏹' :
    b.t==='mage'     ? '🔮' :
    b.t==='tower'    ? '🏹' :
                       '☄️';

  return `
    <span class="mini ${b.t} lv${b.l}">
      <i class="base"></i>
      <i class="roof"></i>
      <i class="door"></i>
      <i class="sign">${mark}</i>
    </span>

    <span class="lvl">
      Lv.${b.l}
    </span>

    ${
      D[b.t].def
      ? ''
      : '<span class="prod"><i></i></span>'
    }
  `;
}

/* =========================================================
   SLOT RENDER
========================================================= */

function render(){

  document
    .querySelectorAll('.slot')
    .forEach(x=>x.remove());

  slots.forEach((sl,i)=>{

    if(!sl.o)return;

    const e=
      document.createElement('div');

    e.className='slot';

    e.dataset.slot=i;

    /*
      Burada merkez koordinatı kullanıyoruz.
      translate ile yerleştiriyoruz.
      Böylece mobil ekran boyutundan bağımsız olarak
      dört alan gerçekten simetrik kalıyor.
    */

    e.style.left=sl.x+'%';
    e.style.top=sl.y+'%';
    e.style.transform='translate(-50%,-50%)';

    const b=
      buildings.find(q=>q.s===i);

    if(b){

      e.classList.add('building');

      if(sel===b){
        e.classList.add('selected');
      }

      e.innerHTML=
        buildingHTML(b);

      e.onclick=
        ()=>tap(b);

    }else{

      e.innerHTML=
        '＋<br>Yapı';

      e.onclick=
        ()=>openPanel(i);
    }

    G.appendChild(e);
  });
}

/* =========================================================
   YAPI KUR
========================================================= */

function openPanel(i){

  buildSlot=i;

  $('panel').style.display=
    'block';

  choices();
}

function closePanel(){

  $('panel').style.display=
    'none';

  buildSlot=null;
}

function build(t){

  const d=D[t];

  if(
    buildSlot==null ||
    money<d.c
  )return;

  money-=d.c;

  buildings.push({

    s:buildSlot,

    t:t,

    l:1,

    last:performance.now()

  });

  closePanel();

  render();

  sync();
}

/* =========================================================
   BİRLEŞTİRME
========================================================= */

function tap(b){

  if(!sel){

    sel=b;

    render();

    return;
  }

  if(sel===b){

    sel=null;

    render();

    return;
  }

  if(
    sel.t===b.t &&
    sel.l===b.l &&
    b.l<5
  ){

    b.l++;

    buildings=
      buildings.filter(
        x=>x!==sel
      );

    sel=null;

    render();

    sync();

  }else{

    sel=b;

    render();
  }
}

/* =========================================================
   EK ALAN SATIN AL
========================================================= */

$('slotBtn').onclick=()=>{

  const s=
    slots.find(x=>!x.o);

  if(
    !s ||
    money<slotPrice
  )return;

  money-=slotPrice;

  s.o=1;

  slotPrice+=50;

  render();

  sync();
};

/* =========================================================
   HIZ
========================================================= */

$('speedBtn').onclick=()=>{

  speed=
    speed===1
    ? 2
    : speed===2
    ? 3
    : 1;

  $('speedBtn').textContent=
    '⏩ x'+speed;
};

/* =========================================================
   DALGA
========================================================= */

$('waveBtn').onclick=()=>{

  if(active)return;

  wave++;

  active=true;

  spawnLeft=
    5+wave*2;

  const now=
    performance.now();

  buildings.forEach(
    b=>b.last=now
  );

  $('waveBtn').disabled=
    true;

  announceNewMonster();

  sync();
};

/* =========================================================
   YENİ DÜŞMAN BİLDİRİMİ
========================================================= */

function announceNewMonster(){

  const entry=
    Object.values(MONSTERS)
      .find(m=>m.unlock===wave);

  if(!entry)return;

  const n=
    $('enemyNotice');

  n.textContent=
    '⚠️ Yeni düşman: '+entry.name;

  n.classList.add('show');

  setTimeout(
    ()=>n.classList.remove('show'),
    1800
  );
}

/* =========================================================
   CANAVAR SEÇ
========================================================= */

function chooseMonster(){

  /*
    Boss her 10. dalgada garantili.
  */

  if(
    wave>=10 &&
    wave%10===0 &&
    Math.random()<.35
  ){
    return 'demon';
  }

  const available=
    Object.entries(MONSTERS)
      .filter(
        ([key,m])=>
          wave>=m.unlock &&
          key!=='demon'
      );

  const bag=[];

  available.forEach(
    ([key,m],index)=>{

      /*
        Yeni açılan düşman biraz daha sık.
      */

      const weight=
        index+2;

      for(
        let i=0;
        i<weight;
        i++
      ){
        bag.push(key);
      }
    }
  );

  if(
    wave>=10 &&
    Math.random()<.10
  ){
    bag.push('demon');
  }

  return bag[
    Math.floor(
      Math.random()*bag.length
    )
  ] || 'goblin';
}

/* =========================================================
   CANAVAR HTML
========================================================= */

function monsterHTML(type){

  const club=
    type==='ogre'
    ? '<i class="club"></i>'
    : '';

  return `
    <div class="monster ${type}">

      <i class="monsterShadow"></i>

      <i class="mLeg l1"></i>
      <i class="mLeg l2"></i>

      <i class="mArm a1"></i>
      <i class="mArm a2"></i>

      <i class="mBody"></i>
      <i class="mHead"></i>

      <i class="mEye e1"></i>
      <i class="mEye e2"></i>

      <i class="mMouth"></i>

      ${club}

    </div>

    <div class="hp">
      <i></i>
    </div>
  `;
}

/* =========================================================
   DÜŞMAN ÜRET
========================================================= */

function spawnEnemy(){

  const type=
    chooseMonster();

  const m=
    MONSTERS[type];

  const baseHP=
    28+
    wave*10;

  const e={

    type:type,

    x:
      35+
      Math.random()*30,

    y:8,

    hp:
      baseHP*m.hp,

    max:
      baseHP*m.hp,

    v:
      (.006+
      wave*.00020) *
      m.speed,

    wallDamage:
      m.wall,

    attack:
      m.attack+
      wave*.25,

    reward:
      m.reward,

    last:0,

    engageX:
      44+
      Math.random()*12,

    el:
      document.createElement(
        'div'
      )
  };

  e.el.className=
    'enemy';

  e.el.innerHTML=
    monsterHTML(type);

  G.appendChild(
    e.el
  );

  enemies.push(e);
}

/* =========================================================
   KILIÇLI ASKER HTML
========================================================= */

function warriorHTML(level){

  const shield=
    level>=2
    ? '<i class="shield"></i>'
    : '';

  const helmet=
    level>=3
    ? '<i class="helmet"></i>'
    : '<i class="hair"></i>';

  return `
    <span class="soldier warriorHuman lv${level}">

      ${helmet}

      <i class="head"></i>

      <i class="torso"></i>

      <i class="arm armL"></i>
      <i class="arm armR"></i>

      <i class="leg legL"></i>
      <i class="leg legR"></i>

      ${shield}

      <i class="sword"></i>

    </span>
  `;
}

/* =========================================================
   OKÇU HTML
========================================================= */

function archerHTML(level){

  const helmet=
    level>=3
    ? '<i class="helmet"></i>'
    : '<i class="hair"></i>';

  return `
    <span class="soldier archerHuman lv${level}">

      ${helmet}

      <i class="head"></i>

      <i class="torso"></i>

      <i class="arm armL"></i>
      <i class="arm armR"></i>

      <i class="leg legL"></i>
      <i class="leg legR"></i>

      <i class="quiver"></i>
      <i class="bow"></i>

    </span>
  `;
}

/* =========================================================
   ASKER ÜRET
========================================================= */

function spawnUnit(b){

  const s=
    slots[b.s];

  const u={

    x:
      s.x+
      (Math.random()-.5)*3,

    /*
      Yapılar avluda.
      Askerler kapıya doğru çıkar.
    */

    y:
      Math.min(
        s.y-4,
        79
      ),

    d:
      D[b.t].d *
      b.l *
      dmgMul,

    t:
      b.t,

    level:
      b.l,

    last:0,

    hp:
      24+
      10*b.l,

    wander:
      (Math.random()-.5)*.002,

    el:
      document.createElement(
        'div'
      )
  };

  u.el.className=
    'unit';

  if(
    b.t==='barracks'
  ){

    u.el.innerHTML=
      warriorHTML(b.l);

  }else{

    u.el.innerHTML=
      archerHTML(b.l);
  }

  G.appendChild(
    u.el
  );

  units.push(u);
}

/* =========================================================
   ATIŞ
========================================================= */

function shoot(
  x,
  y,
  enemy,
  damage,
  kind,
  level=1
){

  if(!enemy)return;

  const p={

    x:x,

    y:y,

    e:enemy,

    d:damage,

    kind:kind,

    level:level,

    el:
      document.createElement(
        'div'
      )
  };

  p.el.className=
    'proj';

  if(
    kind==='arrow'
  ){

    p.el.textContent=
      level>=4
      ? '➽'
      : '➶';

  }else if(
    kind==='magic'
  ){

    p.el.textContent=
      level>=5
      ? '✹'
      : level>=3
      ? '✦'
      : '✧';

    if(
      level>=3
    ){
      p.el.classList.add(
        'magic'+
        Math.min(level,5)
      );
    }

  }else{

    p.el.textContent=
      level>=4
      ? '●'
      : '•';
  }

  G.appendChild(
    p.el
  );

  projectiles.push(p);
}

/* =========================================================
   YARDIMCILAR
========================================================= */

function dist(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function nearestEnemy(x,y){

  let target=null;

  let best=Infinity;

  for(
    const e of enemies
  ){

    const d=
      Math.hypot(
        e.x-x,
        e.y-y
      );

    if(
      d<best
    ){

      best=d;

      target=e;
    }
  }

  return target;
}

function hit(e,d){

  if(
    !e ||
    !enemies.includes(e)
  )return;

  e.hp-=d;

  if(
    e.hp<=0
  ){

    money+=
      5+
      wave+
      e.reward;

    e.el.remove();

    enemies=
      enemies.filter(
        x=>x!==e
      );

    sync();
  }
}

/* =========================================================
   OYUN DÖNGÜSÜ
========================================================= */

function loop(t){

  const dt=
    Math.min(
      40,
      t-lastT
    ) * speed;

  lastT=t;

  /* =====================================================
     DÜŞMAN ÜRETİMİ
  ===================================================== */

  if(
    active &&
    spawnLeft>0 &&
    t-lastSpawn>
    700/speed
  ){

    spawnEnemy();

    spawnLeft--;

    lastSpawn=t;
  }

  /* =====================================================
     DÜŞMAN AI
  ===================================================== */

  for(
    const e of [...enemies]
  ){

    /*
      Önünde yakın bir asker varsa savaşır.
      Uzak askerler düşmanın kapıya gitmesini engellemez.
    */

    let defender=null;
    let defenderDistance=Infinity;

    for(
      const u of units
    ){

      const d=
        dist(e,u);

      if(
        d<defenderDistance
      ){

        defenderDistance=d;

        defender=u;
      }
    }

    /*
      Yakındaki askerle savaş.
    */

    if(
      defender &&
      defenderDistance<=4
    ){

      if(
        t-e.last >
        850/speed
      ){

        e.last=t;

        defender.hp-=
          e.attack;

        if(
          defender.hp<=0
        ){

          defender.el.remove();

          units=
            units.filter(
              x=>x!==defender
            );
        }
      }

    }else{

      /*
        Kapıya doğru ilerle.
      */

      const dx=
        e.engageX-e.x;

      const dy=
        54-e.y;

      const di=
        Math.hypot(
          dx,
          dy
        ) || 1;

      e.x+=
        dx/di *
        e.v *
        dt;

      e.y+=
        dy/di *
        e.v *
        dt;
    }

    e.x=
      Math.max(
        20,
        Math.min(
          80,
          e.x
        )
      );

    /*
      KRİTİK DÜZELTME:
      Başka asker olup olmadığına bakmıyoruz.
      Düşman kapıya ulaştıysa sura vurur.
    */

    if(
      e.y>=53.6
    ){

      wall-=
        e.wallDamage;

      e.el.remove();

      enemies=
        enemies.filter(
          x=>x!==e
        );

      sync();

      if(
        wall<=0
      ){

        wall=0;

        active=false;

        $('waveBtn').disabled=
          true;

        sync();

        setTimeout(
          ()=>{
            alert(
              'Sur yıkıldı! Sayfayı yenileyerek tekrar başlayabilirsin.'
            );
          },
          100
        );
      }

      continue;
    }

    e.el.style.left=
      e.x+'%';

    e.el.style.top=
      e.y+'%';

    const hp=
      e.el.querySelector(
        '.hp i'
      );

    if(hp){

      hp.style.width=
        Math.max(
          0,
          100*
          e.hp/
          e.max
        )+'%';
    }
  }

  /* =====================================================
     BİNALAR
  ===================================================== */

  if(active){

    for(
      const b of buildings
    ){

      const d=
        D[b.t];

      const rate=
        d.r /
        (
          1+
          (b.l-1)*.22
        ) /
        rateMul;

      const se=
        document.querySelector(
          `.slot[data-slot="${b.s}"]`
        );

      /*
        Kışla / okçu üretim barı
      */

      if(
        se &&
        !d.def
      ){

        const bar=
          se.querySelector(
            '.prod i'
          );

        if(bar){

          bar.style.width=
            Math.min(
              100,
              Math.max(
                0,
                (t-b.last)/
                (rate/speed)*
                100
              )
            )+'%';
        }
      }

      if(
        t-b.last >
        rate/speed
      ){

        b.last=t;

        /*
          SAVUNMA BİNALARI
        */

        if(d.def){

          const s=
            slots[b.s];

          const enemy=
            nearestEnemy(
              s.x,
              s.y
            );

          if(enemy){

            const distance=
              Math.hypot(
                enemy.x-s.x,
                enemy.y-s.y
              );

            if(
              distance<48
            ){

              shoot(
                s.x,
                s.y,
                enemy,
                d.d*
                b.l*
                dmgMul,

                b.t==='tower'
                ? 'arrow'
                : b.t==='mage'
                ? 'magic'
                : 'stone',

                b.l
              );
            }
          }

        }else{

          /*
            KIŞLA / OKÇU OCAĞI
          */

          spawnUnit(b);
        }
      }
    }
  }

  /* =====================================================
     ASKER AI
  ===================================================== */

  for(
    const u of [...units]
  ){

    const e=
      nearestEnemy(
        u.x,
        u.y
      );

    if(!e){

      u.el.style.left=
        u.x+'%';

      u.el.style.top=
        u.y+'%';

      continue;
    }

    const dx=
      e.x-u.x;

    const dy=
      e.y-u.y;

    const di=
      Math.hypot(
        dx,
        dy
      ) || 1;

    /* ===================================================
       KILIÇLI
    =================================================== */

    if(
      u.t==='barracks'
    ){

      if(
        di<3.4
      ){

        if(
          t-u.last >
          650/rateMul
        ){

          u.last=t;

          u.el.classList.remove(
            'meleeAttack'
          );

          void u.el.offsetWidth;

          u.el.classList.add(
            'meleeAttack'
          );

          hit(
            e,
            u.d
          );
        }

      }else{

        u.x+=
          dx/di*
          .0105*
          dt+
          u.wander*dt;

        u.y+=
          dy/di*
          .0105*
          dt;
      }

    }

    /* ===================================================
       OKÇU
    =================================================== */

    else{

      const range=
        u.level>=5
        ? 30
        : u.level>=3
        ? 27
        : 24;

      if(
        di>range
      ){

        u.x+=
          dx/di*
          .0075*
          dt+
          u.wander*dt;

        u.y+=
          dy/di*
          .0075*
          dt;

      }else if(
        di<range-7
      ){

        u.x-=
          dx/di*
          .004*
          dt;

        u.y-=
          dy/di*
          .004*
          dt;

      }else if(
        t-u.last >
        900/rateMul
      ){

        u.last=t;

        u.el.classList.remove(
          'bowAttack'
        );

        void u.el.offsetWidth;

        u.el.classList.add(
          'bowAttack'
        );

        shoot(
          u.x,
          u.y,
          e,
          u.d,
          'arrow',
          u.level
        );
      }
    }

    /*
      Askerler surun çok yukarısına çıkmasın.
    */

    u.x=
      Math.max(
        16,
        Math.min(
          84,
          u.x
        )
      );

    u.y=
      Math.max(
        45,
        Math.min(
          84,
          u.y
        )
      );

    u.el.style.left=
      u.x+'%';

    u.el.style.top=
      u.y+'%';
  }

  /* =====================================================
     MERMİLER
  ===================================================== */

  for(
    const p of [...projectiles]
  ){

    if(
      !p.e ||
      !enemies.includes(p.e)
    ){

      p.el.remove();

      projectiles=
        projectiles.filter(
          x=>x!==p
        );

      continue;
    }

    const dx=
      p.e.x-p.x;

    const dy=
      p.e.y-p.y;

    const di=
      Math.hypot(
        dx,
        dy
      ) || 1;

    if(
      di<2
    ){

      hit(
        p.e,
        p.d
      );

      p.el.remove();

      projectiles=
        projectiles.filter(
          x=>x!==p
        );

    }else{

      let velocity=
        p.kind==='stone'
        ? .020
        : .032;

      if(
        p.kind==='magic' &&
        p.level>=4
      ){
        velocity=.038;
      }

      p.x+=
        dx/di*
        velocity*
        dt;

      p.y+=
        dy/di*
        velocity*
        dt;

      p.el.style.left=
        p.x+'%';

      p.el.style.top=
        p.y+'%';
    }
  }

  /* =====================================================
     DALGA TAMAMLANDI
  ===================================================== */

  if(
    active &&
    spawnLeft===0 &&
    enemies.length===0
  ){

    active=false;

    document
      .querySelectorAll(
        '.prod i'
      )
      .forEach(
        x=>x.style.width='0%'
      );

    /*
      Dalga sonunda askerleri temizliyoruz.
    */

    for(
      const u of units
    ){
      u.el.remove();
    }

    units=[];

    for(
      const p of projectiles
    ){
      p.el.remove();
    }

    projectiles=[];

    $('waveBtn').disabled=
      false;

    $('upgrade').style.display=
      'block';
  }

  requestAnimationFrame(loop);
}

/* =========================================================
   DALGA ÖDÜLLERİ
========================================================= */

function upgrade(k){

  if(
    k==='dmg'
  ){
    dmgMul*=1.2;
  }

  if(
    k==='rate'
  ){
    rateMul*=1.15;
  }

  if(
    k==='wall'
  ){

    wall=
      Math.min(
        1500,
        wall+100
      );
  }

  if(
    k==='coin'
  ){
    money+=100;
  }

  $('upgrade').style.display=
    'none';

  sync();
}

/* =========================================================
   BAŞLAT
========================================================= */

render();
sync();

requestAnimationFrame(loop);

</script>

</div>

</html>
