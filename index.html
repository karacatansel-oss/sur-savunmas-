<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sur Savunması V6</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#17251d;font-family:system-ui,-apple-system,sans-serif;color:#fff}#g{position:relative;width:min(100vw,520px);height:100dvh;margin:auto;overflow:hidden;background:linear-gradient(#bddc8d 0 56%,#d7bb89 56%);touch-action:manipulation}.tree{position:absolute;font-size:40px}.wall{position:absolute;top:54%;left:0;right:0;height:58px;background:#9d6744;border-block:5px solid #68442f;z-index:4}.gate{width:18%;height:100%;margin:auto;background:#bd7d50;border:4px solid #704831;border-radius:18px 18px 0 0}.hud{position:absolute;z-index:20;top:8px;left:7px;right:7px;display:flex;justify-content:space-between;gap:5px}.pill{background:#20362ee8;border:2px solid #ffffff66;border-radius:18px;padding:7px 10px;font-weight:800;font-size:14px}.castle{position:absolute;bottom:11%;left:50%;transform:translateX(-50%);font-size:66px}.slot{position:absolute;width:62px;height:62px;border:3px dashed #755e43;border-radius:14px;background:#fff3;display:grid;place-items:center;text-align:center;color:#55432f;font-weight:800;z-index:8}.building{font-size:34px;border-style:solid;background:#f7e7b5}.lvl{position:absolute;right:-5px;top:-7px;background:#58358f;color:#fff;border-radius:9px;padding:2px 5px;font-size:10px}.enemy,.unit,.proj{position:absolute;z-index:7;transform:translate(-50%,-50%);font-size:23px}.proj{font-size:17px;z-index:10;pointer-events:none}.slash{animation:slash .18s alternate 2}@keyframes slash{to{transform:translate(-50%,-50%) rotate(25deg) scale(1.25)}}.hp{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:28px;height:4px;background:#642}.hp i{display:block;height:100%;background:#4d5}.controls{position:absolute;z-index:20;bottom:7px;left:5px;right:5px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}button{border:0;border-radius:12px;padding:10px;font-weight:800;background:#fff;color:#24352c;box-shadow:0 3px 0 #0004}button:disabled{opacity:.35}.panel{display:none;position:absolute;z-index:30;left:7%;right:7%;top:19%;padding:14px;background:#20372ef5;border:2px solid #ffffff77;border-radius:20px;text-align:center}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button{min-height:55px}.note{font-size:12px;opacity:.8;margin:8px 0}
</style></head><body><div id="g">
<div class="tree" style="left:-8px;top:9%">🌳</div><div class="tree" style="right:-7px;top:14%">🌳</div><div class="tree" style="left:2px;top:38%">🌲</div><div class="tree" style="right:2px;top:40%">🌲</div>
<div class="wall"><div class="gate"></div></div><div class="castle">🏰</div>
<div class="hud"><span class="pill">🪙 <b id="money">300</b></span><span class="pill">❤️ <b id="wallhp">100</b></span><span class="pill">🌊 <b id="wave">0</b></span></div>
<div class="controls"><button id="waveBtn">⚔️ Dalga Başlat</button><button id="slotBtn">➕ Slot — <span id="slotPrice">100</span>🪙</button><button id="speedBtn">⏩ x1</button></div>
<div id="panel" class="panel"><h3>Yapı seç</h3><div id="choices" class="choices"></div><div class="note">Aynı tür ve seviyedeki iki yapıya sırayla dokun: Lv.5'e kadar birleşir.</div><button onclick="closePanel()">Kapat</button></div>
<div id="upgrade" class="panel"><h3>Dalga ödülü</h3><div class="choices"><button onclick="upgrade('dmg')">⚔️ Hasar +20%</button><button onclick="upgrade('rate')">⏱️ Hız +15%</button><button onclick="upgrade('wall')">❤️ Sur +25</button><button onclick="upgrade('coin')">🪙 +100</button></div></div>
<script>
const G=document.getElementById('g'),$=id=>document.getElementById(id);
let money=300,wall=100,wave=0,active=false,speed=1,slotPrice=100,sel=null,buildSlot=null,dmgMul=1,rateMul=1,enemies=[],units=[],projectiles=[],buildings=[],spawnLeft=0,lastSpawn=0,lastT=performance.now();
const slots=[{x:18,y:70,o:1},{x:38,y:75,o:1},{x:62,y:75,o:1},{x:82,y:70,o:0},{x:29,y:86,o:0},{x:71,y:86,o:0}];
const D={barracks:{n:'Kışla',i:'🛡️',c:75,u:'🧑‍🚀',r:2500,d:9},archer:{n:'Okçu Ocağı',i:'🏹',c:90,u:'🧝',r:2900,d:12},mage:{n:'Büyücü Kulesi',i:'🔮',c:110,u:'🧙',r:3400,d:18},tower:{n:'Okçu Kulesi',i:'🗼',c:125,r:1200,d:8,def:1},catapult:{n:'Mancınık',i:'☄️',c:150,r:2400,d:25,def:1}};
function sync(){$('money').textContent=Math.floor(money);$('wallhp').textContent=Math.max(0,Math.floor(wall));$('wave').textContent=wave;$('slotPrice').textContent=slotPrice;$('slotBtn').disabled=money<slotPrice||slots.every(s=>s.o);choices()}
function choices(){let c=$('choices');c.innerHTML='';for(const[k,d]of Object.entries(D)){let b=document.createElement('button');b.innerHTML=`${d.i} ${d.n}<br>${d.c}🪙`;b.disabled=money<d.c;b.onclick=()=>build(k);c.appendChild(b)}}
function render(){document.querySelectorAll('.slot').forEach(x=>x.remove());slots.forEach((s,i)=>{if(!s.o)return;let e=document.createElement('div');e.className='slot';e.style.left=`calc(${s.x}% - 31px)`;e.style.top=`calc(${s.y}% - 31px)`;let b=buildings.find(q=>q.s===i);if(b){e.classList.add('building');e.innerHTML=`${D[b.t].i}<span class="lvl">Lv.${b.l}</span>`;e.onclick=()=>tap(b)}else{e.textContent='+ Yapı';e.onclick=()=>openPanel(i)}G.appendChild(e)})}
function openPanel(i){buildSlot=i;$('panel').style.display='block';choices()}function closePanel(){$('panel').style.display='none';buildSlot=null}
function build(t){let d=D[t];if(buildSlot==null||money<d.c)return;money-=d.c;buildings.push({s:buildSlot,t,l:1,last:0});closePanel();render();sync()}
function tap(b){if(!sel){sel=b;return}if(sel===b){sel=null;return}if(sel.t===b.t&&sel.l===b.l&&b.l<5){b.l++;buildings=buildings.filter(x=>x!==sel);sel=null;render()}else sel=b}
$('slotBtn').onclick=()=>{let s=slots.find(x=>!x.o);if(!s||money<slotPrice)return;money-=slotPrice;s.o=1;slotPrice+=50;render();sync()}
$('speedBtn').onclick=()=>{speed=speed===1?2:speed===2?3:1;$('speedBtn').textContent='⏩ x'+speed}
$('waveBtn').onclick=()=>{if(active)return;wave++;active=true;spawnLeft=5+wave*2;$('waveBtn').disabled=true;sync()}
function spawnEnemy(){let e={x:12+Math.random()*76,y:7,hp:30+wave*10,max:30+wave*10,v:.010+wave*.0005,el:document.createElement('div')};e.el.className='enemy';e.el.innerHTML='👹<div class="hp"><i></i></div>';G.appendChild(e.el);enemies.push(e)}
function spawnUnit(b){let s=slots[b.s],u={x:s.x,y:s.y-3,d:D[b.t].d*b.l*dmgMul,t:b.t,last:0,el:document.createElement('div')};u.el.className='unit';u.el.textContent=b.t==='barracks'?'🧑‍🚀⚔️':b.t==='archer'?'🧝🏹':'🧙';G.appendChild(u.el);units.push(u)}
function shoot(x,y,e,d,kind){if(!e)return;let p={x,y,e,d,kind,el:document.createElement('div')};p.el.className='proj';p.el.textContent=kind==='arrow'?'➶':kind==='magic'?'✨':'●';G.appendChild(p.el);projectiles.push(p)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function near(x,y){let z=null,bd=1e9;for(let e of enemies){let d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;z=e}}return z}
function hit(e,d){e.hp-=d;if(e.hp<=0){money+=8+wave*2;e.el.remove();enemies=enemies.filter(x=>x!==e);sync()}}
function loop(t){let dt=Math.min(40,t-lastT)*speed;lastT=t;if(active&&spawnLeft>0&&t-lastSpawn>650/speed){spawnEnemy();spawnLeft--;lastSpawn=t}
for(let e of [...enemies]){e.y+=e.v*dt;if(e.y>=54){wall-=7;e.el.remove();enemies=enemies.filter(x=>x!==e);sync();if(wall<=0){active=false;alert('Sur yıkıldı! Yenileyip tekrar başlayabilirsin.')}}else{e.el.style.left=e.x+'%';e.el.style.top=e.y+'%';e.el.querySelector('i').style.width=100*e.hp/e.max+'%'}}
if(active){for(let b of buildings){let d=D[b.t],rate=d.r/(1+(b.l-1)*.22)/rateMul;if(t-b.last>rate/speed){b.last=t;if(d.def){let s=slots[b.s],e=near(s.x,s.y);if(e&&Math.hypot(e.x-s.x,e.y-s.y)<45)shoot(s.x,s.y,e,d.d*b.l*dmgMul,b.t==='tower'?'arrow':'stone')}else spawnUnit(b)}}}
for(let u of [...units]){let e=near(u.x,u.y);if(!e){u.el.style.left=u.x+'%';u.el.style.top=u.y+'%';continue}let dx=e.x-u.x,dy=e.y-u.y,di=Math.hypot(dx,dy);
if(u.t==='barracks'){if(di<3.2){if(t-u.last>650/rateMul){u.last=t;u.el.classList.remove('slash');void u.el.offsetWidth;u.el.classList.add('slash');hit(e,u.d)}}else{u.x+=dx/di*.012*dt;u.y+=dy/di*.012*dt}}
else{let range=u.t==='archer'?25:30;if(di>range){u.x+=dx/di*.008*dt;u.y+=dy/di*.008*dt}else if(di<range-7){u.x-=dx/di*.005*dt;u.y-=dy/di*.005*dt}else if(t-u.last>(u.t==='archer'?900:1250)/rateMul){u.last=t;shoot(u.x,u.y,e,u.d,u.t==='archer'?'arrow':'magic')}}
u.el.style.left=u.x+'%';u.el.style.top=u.y+'%'}
for(let p of [...projectiles]){if(!p.e||!enemies.includes(p.e)){p.el.remove();projectiles=projectiles.filter(x=>x!==p);continue}let dx=p.e.x-p.x,dy=p.e.y-p.y,di=Math.hypot(dx,dy);if(di<2){hit(p.e,p.d);p.el.remove();projectiles=projectiles.filter(x=>x!==p)}else{let v=p.kind==='stone'?.020:.032;p.x+=dx/di*v*dt;p.y+=dy/di*v*dt;p.el.style.left=p.x+'%';p.el.style.top=p.y+'%'}}
if(active&&spawnLeft===0&&enemies.length===0){active=false;for(let u of units){u.el.remove()}units=[];for(let p of projectiles){p.el.remove()}projectiles=[];$('waveBtn').disabled=false;$('upgrade').style.display='block'}requestAnimationFrame(loop)}
function upgrade(k){if(k==='dmg')dmgMul*=1.2;if(k==='rate')rateMul*=1.15;if(k==='wall')wall=Math.min(150,wall+25);if(k==='coin')money+=100;$('upgrade').style.display='none';sync()}
render();sync();requestAnimationFrame(loop);
</script></div></body></html>
