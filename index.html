<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sur Savunması V11</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#17241d;
 font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
 color:white
}
#game{
 position:relative;
 width:min(100vw,520px);
 height:100dvh;
 margin:auto;
 overflow:hidden;
 touch-action:none;
 background:linear-gradient(#75b5dc 0 22%,#82ad63 22% 55%,#b89661 55%)
}

/* ===== GÖKYÜZÜ ===== */
.sun{
 position:absolute;right:9%;top:8%;
 width:48px;height:48px;border-radius:50%;
 background:#ffe09a;
 box-shadow:0 0 35px #ffe7a8
}
.cloud{
 position:absolute;width:70px;height:18px;border-radius:20px;
 background:#fff9;z-index:1
}
.cloud:before,.cloud:after{
 content:"";position:absolute;border-radius:50%;background:#fff9
}
.cloud:before{width:30px;height:30px;left:12px;top:-13px}
.cloud:after{width:37px;height:37px;right:8px;top:-19px}
.c1{left:7%;top:10%;transform:scale(.7)}
.c2{right:23%;top:16%;transform:scale(.5)}

/* ===== DAĞLAR ===== */
.mountains{
 position:absolute;top:12%;left:0;right:0;height:22%;overflow:hidden
}
.mountain{
 position:absolute;bottom:-80px;
 width:230px;height:210px;
 transform:rotate(45deg);
 border-radius:25px;
 background:linear-gradient(135deg,#78906e,#4f6755)
}
.mountain:after{
 content:"";position:absolute;left:0;top:0;
 width:65px;height:65px;background:#e7eadc;
 clip-path:polygon(0 0,100% 0,0 100%)
}
.m1{left:-100px}
.m2{left:110px;background:linear-gradient(135deg,#8da375,#5d765e)}
.m3{right:-100px}

/* ===== SAVAŞ ALANI ===== */
.field{
 position:absolute;top:22%;left:0;right:0;height:33%;
 background:
 radial-gradient(circle at 10% 20%,#567d45 0 2px,transparent 3px),
 radial-gradient(circle at 25% 65%,#507541 0 2px,transparent 3px),
 radial-gradient(circle at 75% 35%,#547b43 0 2px,transparent 3px),
 radial-gradient(circle at 90% 70%,#4b703e 0 2px,transparent 3px)
}
.road{
 position:absolute;top:22%;left:34%;width:32%;height:34%;
 background:linear-gradient(90deg,#9c8059,#d3b981,#9c8059);
 clip-path:polygon(43% 0,57% 0,100% 100%,0 100%)
}

.tree{position:absolute;width:35px;height:54px;z-index:2}
.tree:before{
 content:"";position:absolute;left:14px;bottom:0;
 width:7px;height:21px;background:#62442c
}
.tree:after{
 content:"";position:absolute;left:0;top:0;width:35px;height:39px;
 border-radius:50%;
 background:
 radial-gradient(circle at 35% 28%,#72a35a 0 25%,transparent 26%),
 radial-gradient(circle at 68% 30%,#4f8a44 0 29%,transparent 30%),
 radial-gradient(circle at 50% 65%,#3b7037 0 45%,transparent 46%);
 filter:drop-shadow(0 4px 2px #0004)
}
.t1{left:3%;top:30%}.t2{left:12%;top:43%;transform:scale(.8)}
.t3{right:3%;top:30%}.t4{right:12%;top:43%;transform:scale(.8)}

/* ===== SUR ===== */
.wall{
 position:absolute;z-index:10;
 top:53%;left:-2%;width:104%;height:80px;
 border-top:5px solid #565955;
 border-bottom:7px solid #52534f;
 background:
 repeating-linear-gradient(
  0deg,
  transparent 0 24px,
  #777871 24px 27px
 ),
 repeating-linear-gradient(
  90deg,
  #b7b5aa 0 38px,
  #898a83 38px 42px,
  #a5a49a 42px 78px
 );
 box-shadow:0 9px 10px #0004,inset 0 7px #d0cec2
}
.wall:before{
 content:"";position:absolute;left:0;right:0;top:-18px;height:20px;
 background:repeating-linear-gradient(
  90deg,
  #a7a69c 0 27px,
  transparent 27px 39px
 )
}
.gate{
 position:absolute;left:50%;bottom:-1px;
 transform:translateX(-50%);
 width:27%;height:75px;
 border:6px solid #4f4a43;border-bottom:0;
 border-radius:50px 50px 0 0;
 background:
 repeating-linear-gradient(
  90deg,
  #875d3e 0 11px,
  #583a29 11px 14px
 )
}
.gate:before{
 content:"";position:absolute;left:0;right:0;top:26px;height:5px;background:#444
}
.gate:after{
 content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:#493126
}
.wallTower{
 position:absolute;bottom:-6px;width:55px;height:98px;
 border:5px solid #585a56;background:#aaa99f
}
.wallTower.left{left:3%}.wallTower.right{right:3%}

/* ===== AVLU ===== */
.courtyard{
 position:absolute;top:62%;left:0;right:0;bottom:0;
 background:
 radial-gradient(circle at 12% 20%,#d0b681 0 3px,transparent 4px),
 radial-gradient(circle at 82% 35%,#d0b681 0 3px,transparent 4px),
 radial-gradient(circle at 32% 72%,#8c704b 0 2px,transparent 3px),
 linear-gradient(#c3a66e,#9c7a4d)
}

/* ===== KALE ===== */
.castle{
 position:absolute;z-index:3;
 left:50%;bottom:8%;
 width:106px;height:78px;
 transform:translateX(-50%);
 filter:drop-shadow(0 7px 4px #0005)
}
.keep{
 position:absolute;left:22px;bottom:0;width:62px;height:60px;
 border:4px solid #555955;background:#a6a69e
}
.keep:before{
 content:"";position:absolute;left:-4px;top:-14px;width:62px;height:18px;
 background:repeating-linear-gradient(90deg,#a6a69e 0 13px,transparent 13px 21px)
}
.keepDoor{
 position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);
 width:21px;height:29px;border:3px solid #4b3629;
 border-radius:12px 12px 0 0;background:#65462f
}
.castleTower{
 position:absolute;bottom:0;width:29px;height:70px;
 border:4px solid #555955;background:#92938c
}
.castleTower.left{left:0}.castleTower.right{right:0}

/* ===== HUD ===== */
.hud{
 position:absolute;z-index:100;
 top:max(8px,env(safe-area-inset-top));
 left:8px;right:8px;
 display:flex;justify-content:space-between;gap:5px
}
.pill{
 min-width:85px;padding:8px;
 text-align:center;font-weight:900;font-size:14px;
 border:2px solid #ffffff70;border-radius:18px;
 background:linear-gradient(#354e42ee,#1c3128ee);
 box-shadow:0 4px 9px #0004
}

/* ===== YAPI ALANLARI ===== */
.slot{
 position:absolute;z-index:20;
 width:62px;height:62px;
 transform:translate(-50%,-50%);
 display:grid;place-items:center;
 text-align:center;
 border:3px dashed #665139;
 border-radius:50%;
 background:#f1d59c77;
 color:#453725;
 font-size:10px;font-weight:900;
 user-select:none
}
.slot.building{border:0;background:transparent}
.slot.dragging{opacity:.25}
.slot.mergeTarget .buildingVisual{
 transform:scale(1.15);
 filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 12px #ffd644)
}

/* ===== BİNA GRAFİĞİ ===== */
.buildingVisual{
 position:relative;width:64px;height:62px;
 filter:drop-shadow(0 5px 3px #0005);
 transition:.15s
}
.buildingVisual .house{
 position:absolute;left:8px;right:8px;bottom:2px;height:37px;
 border:3px solid #554332;border-radius:5px;
 background:linear-gradient(#d8bb84,#aa8052)
}
.buildingVisual .roof{
 position:absolute;left:3px;right:3px;top:0;height:29px;
 border:3px solid #513b30;
 clip-path:polygon(50% 0,100% 100%,0 100%);
 background:#97453a
}
.buildingVisual.archer .roof{background:#426d48}
.buildingVisual.cavalry .roof{background:#395e7d}
.buildingVisual.artillery .roof{background:#5c5147}
.buildingVisual .door{
 position:absolute;left:26px;bottom:4px;width:13px;height:18px;
 border:2px solid #493328;border-radius:7px 7px 0 0;background:#65442e
}
.buildingVisual .sign{
 position:absolute;right:-2px;top:19px;
 width:26px;height:26px;
 border:2px solid #4e4033;border-radius:50%;
 display:grid;place-items:center;
 background:#f0ddb3;color:#332b23;
 font-weight:900
}
.buildingVisual.lv2 .house{height:40px}
.buildingVisual.lv3 .house{
 border-color:#656b6c;
 box-shadow:inset 0 0 0 2px #8b9292
}
.buildingVisual.lv4{transform:scale(1.06)}
.buildingVisual.lv4 .house{
 background:linear-gradient(#c0aa7c,#887056);
 border-color:#4c5559
}
.buildingVisual.lv5{transform:scale(1.10)}
.buildingVisual.lv5 .house{
 border-color:#c9a441;
 box-shadow:inset 0 0 0 2px #6d7678,0 0 8px #f1c750
}
.level{
 position:absolute;z-index:5;left:-2px;bottom:-2px;
 padding:2px 5px;border-radius:7px;
 background:#51357f;color:white;font-size:9px
}
.production{
 position:absolute;left:7px;right:7px;bottom:-6px;height:6px;
 border:1px solid white;border-radius:6px;
 overflow:hidden;background:#26382e
}
.production i{
 display:block;height:100%;width:0;background:#e9bf45
}
.dragGhost{
 position:absolute;z-index:300;
 width:70px;height:70px;
 pointer-events:none;
 transform:translate(-50%,-50%) scale(1.12)
}

/* ===== İNSAN ===== */
.unit{
 position:absolute;z-index:16;
 width:38px;height:50px;
 transform:translate(-50%,-50%);
 pointer-events:none;
 filter:drop-shadow(0 3px 2px #0005)
}
.body{
 position:absolute;left:5px;top:2px;width:28px;height:45px
}
.head{
 position:absolute;z-index:6;left:9px;top:3px;
 width:11px;height:12px;border-radius:50%;
 border:1px solid #704b34;background:#d8a170
}
.hair{
 position:absolute;z-index:7;left:8px;top:1px;
 width:13px;height:7px;border-radius:8px 8px 2px 2px;background:#493326
}
.helmet{
 position:absolute;z-index:8;left:7px;top:0;
 width:15px;height:10px;border:1px solid #414b50;
 border-radius:9px 9px 3px 3px;
 background:linear-gradient(#adb7ba,#606b70)
}
.torso{
 position:absolute;z-index:5;left:6px;top:14px;
 width:17px;height:18px;border:1px solid #43362d;border-radius:4px
}
.arm{
 position:absolute;z-index:4;top:16px;width:5px;height:17px;
 border-radius:4px;transform-origin:50% 2px
}
.armL{left:3px}.armR{right:2px}
.leg{
 position:absolute;top:30px;width:6px;height:14px;
 border-radius:3px;background:#423b35;transform-origin:50% 1px
}
.legL{left:6px}.legR{right:5px}

.unit.walking .body{animation:bob .28s infinite alternate}
.unit.walking .legL{animation:legA .28s infinite alternate}
.unit.walking .legR{animation:legB .28s infinite alternate}
@keyframes bob{to{transform:translateY(-2px)}}
@keyframes legA{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
@keyframes legB{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}

/* ===== PİYADE ===== */
.sword{
 position:absolute;z-index:12;right:-5px;top:8px;
 width:4px;height:27px;border:1px solid #485258;
 background:linear-gradient(90deg,#777,#eee,#777);
 transform:rotate(-30deg);transform-origin:50% 90%
}
.sword:before{
 content:"";position:absolute;left:-4px;bottom:3px;width:11px;height:3px;background:#98703c
}
.shield{
 position:absolute;z-index:11;left:-6px;top:15px;
 width:15px;height:20px;border:2px solid #493526;
 border-radius:7px 7px 10px 10px;
 background:linear-gradient(90deg,#963b34 0 47%,#c99c3d 48% 53%,#85302c 54%)
}
.warrior.lv1 .torso,.warrior.lv1 .arm{background:#876649}
.warrior.lv2 .torso,.warrior.lv2 .arm{background:#4e6b7c}
.warrior.lv3 .torso,.warrior.lv3 .arm{background:#818d91}
.warrior.lv4 .torso{background:linear-gradient(90deg,#485258,#a3abad,#465157);border:2px solid #333}
.warrior.lv5 .torso{
 background:linear-gradient(90deg,#4c575d,#c2c9ca,#4d595f);
 border:2px solid #caa13d;box-shadow:0 0 6px #ffd35a
}
.unit.attack .sword{animation:sword .18s 2 alternate}
@keyframes sword{from{transform:rotate(-30deg)}to{transform:rotate(65deg)}}

/* ===== OKÇU ===== */
.bow{
 position:absolute;z-index:10;right:-8px;top:8px;
 width:17px;height:29px;border-right:3px solid #75502e;
 border-radius:0 100% 100% 0
}
.bow:after{
 content:"";position:absolute;right:11px;top:1px;width:1px;height:26px;background:#eee
}
.quiver{
 position:absolute;left:1px;top:10px;width:7px;height:23px;
 border:1px solid #4c3423;border-radius:3px;background:#79502e;
 transform:rotate(17deg)
}
.archer.lv1 .torso,.archer.lv1 .arm{background:#5c7b4f}
.archer.lv2 .torso,.archer.lv2 .arm{background:#725c43}
.archer.lv3 .torso,.archer.lv3 .arm{background:#5c6c5d}
.archer.lv4 .torso{background:#304d39;border:2px solid #293b2e}
.archer.lv5 .torso{background:#375440;border:2px solid #c7a13d;box-shadow:0 0 6px #ffd45b}

/* ===== SÜVARİ ===== */
.cavalryUnit{width:64px;height:55px}
.horse{
 position:absolute;left:2px;top:18px;width:54px;height:30px
}
.horseBody{
 position:absolute;left:7px;top:6px;width:36px;height:18px;
 border:2px solid #493526;border-radius:15px;background:#875e3e
}
.horseNeck{
 position:absolute;right:5px;top:0;width:12px;height:22px;
 border:2px solid #493526;border-radius:8px;background:#875e3e;
 transform:rotate(-22deg)
}
.horseHead{
 position:absolute;right:-2px;top:-4px;width:16px;height:12px;
 border:2px solid #493526;border-radius:8px;background:#875e3e
}
.horseLeg{
 position:absolute;top:21px;width:5px;height:16px;background:#65442e;
 border-radius:3px;transform-origin:50% 1px
}
.hl1{left:11px}.hl2{left:20px}.hl3{right:14px}.hl4{right:6px}
.cavalryUnit.walking .hl1,.cavalryUnit.walking .hl3{animation:horseA .2s infinite alternate}
.cavalryUnit.walking .hl2,.cavalryUnit.walking .hl4{animation:horseB .2s infinite alternate}
@keyframes horseA{from{transform:rotate(26deg)}to{transform:rotate(-26deg)}}
@keyframes horseB{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
.rider{
 position:absolute;z-index:8;left:19px;top:-5px;width:28px;height:31px
}
.rider .head{left:8px}.rider .torso{left:5px;top:14px;height:15px}
.lance{
 position:absolute;z-index:12;left:28px;top:3px;
 width:4px;height:46px;background:#805832;
 transform:rotate(67deg);transform-origin:50% 80%
}
.lance:before{
 content:"";position:absolute;left:-2px;top:-8px;width:8px;height:11px;
 background:#c2cacc;clip-path:polygon(50% 0,100% 100%,0 100%)
}
.cavalry.lv1 .rider .torso{background:#785940}
.cavalry.lv2 .rider .torso{background:#466681}
.cavalry.lv3 .rider .torso{background:#828d90;border:2px solid #4c565b}
.cavalry.lv3 .horseBody{box-shadow:inset 0 0 0 3px #727b7e}
.cavalry.lv4 .horseBody{background:#555c5f;box-shadow:inset 0 0 0 3px #9aa2a4}
.cavalry.lv5 .horseBody{
 background:#555c5f;
 box-shadow:inset 0 0 0 3px #caa13d,0 0 8px #ffd45b
}

/* ===== TOPÇU ===== */
.artilleryUnit{width:72px;height:52px}
.cannon{
 position:absolute;left:2px;top:8px;width:65px;height:40px
}
.wheel{
 position:absolute;z-index:3;bottom:0;width:21px;height:21px;
 border:4px solid #513825;border-radius:50%;background:#8b633d
}
.wheel:before,.wheel:after{
 content:"";position:absolute;left:7px;top:0;width:2px;height:13px;background:#513825
}
.wheel:after{transform:rotate(90deg)}
.w1{left:8px}.w2{right:7px}
.barrel{
 position:absolute;z-index:6;left:21px;top:3px;
 width:43px;height:12px;border:2px solid #333b3e;border-radius:6px;
 background:linear-gradient(#899397,#4b565b);transform:rotate(-8deg)
}
.carriage{
 position:absolute;left:14px;top:14px;width:34px;height:14px;
 border:2px solid #503923;background:#805b39
}
.gunner{
 position:absolute;z-index:8;left:3px;top:-4px;width:28px;height:34px
}
.gunner .head{left:8px}.gunner .torso{left:5px;top:14px;height:15px;background:#665b4c}
.artillery.lv2 .barrel{width:46px}
.artillery.lv3 .barrel{height:14px;background:linear-gradient(#a0aaad,#4e595e)}
.artillery.lv4 .barrel{width:50px;height:15px;border-width:3px}
.artillery.lv5 .barrel{
 width:53px;height:16px;border-color:#c69e3e;
 box-shadow:0 0 7px #ffd35b
}

/* ===== DÜŞMAN ===== */
.enemy{
 position:absolute;z-index:15;
 width:52px;height:58px;
 transform:translate(-50%,-50%);
 pointer-events:none;
 filter:drop-shadow(0 4px 2px #0005)
}
.monster{
 position:absolute;left:50%;bottom:2px;
 width:40px;height:48px;transform:translateX(-50%)
}
.mHead{
 position:absolute;z-index:7;left:9px;top:4px;width:22px;height:19px;
 border:2px solid #263326;border-radius:48%;background:#6f9e58
}
.mBody{
 position:absolute;z-index:4;left:8px;top:18px;width:24px;height:22px;
 border:2px solid #263326;border-radius:9px;background:#5c814a
}
.mArm{
 position:absolute;z-index:3;top:20px;width:8px;height:20px;
 border:1px solid #263326;border-radius:5px;background:#5c814a;
 transform-origin:50% 2px
}
.ma1{left:2px}.ma2{right:1px}
.mLeg{
 position:absolute;z-index:2;top:37px;width:7px;height:13px;
 border-radius:4px;background:#40563c;transform-origin:50% 1px
}
.ml1{left:9px}.ml2{right:8px}
.eye{
 position:absolute;z-index:10;top:10px;width:4px;height:4px;
 border-radius:50%;background:#ffe44e
}
.e1{left:13px}.e2{right:10px}

.enemy.walking .ma1{animation:ea .27s infinite alternate}
.enemy.walking .ma2{animation:eb .27s infinite alternate}
.enemy.walking .ml1{animation:eb .27s infinite alternate}
.enemy.walking .ml2{animation:ea .27s infinite alternate}
@keyframes ea{from{transform:rotate(20deg)}to{transform:rotate(-20deg)}}
@keyframes eb{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}

.goblin{transform:translateX(-50%) scale(.78)}
.goblin .mHead{background:#7aa75b}.goblin .mBody,.goblin .mArm{background:#628b4d}

.orc .mHead{left:6px;width:28px;background:#537743}
.orc .mBody{left:4px;width:32px;background:#46683c}

.wolf{transform:translateX(-50%) scale(.88)}
.wolf .mHead,.wolf .mBody,.wolf .mArm{background:#67645f}

.raider{transform:translateX(-50%) scale(.95)}
.raider .mHead{background:#755849}.raider .mBody,.raider .mArm{background:#674b3f}

.armored{transform:translateX(-50%) scale(1.08)}
.armored .mBody{
 left:4px;width:32px;
 background:linear-gradient(90deg,#59636a,#979fa2,#515a60)
}
.armored .mHead:after{
 content:"";position:absolute;left:-3px;right:-3px;top:-6px;height:10px;
 border:2px solid #353d41;border-radius:10px 10px 2px 2px;background:#626c72
}

.brute{transform:translateX(-50%) scale(1.16)}
.brute .mHead{background:#6e7143}.brute .mBody,.brute .mArm{background:#60673e}

.ogre{transform:translateX(-50%) scale(1.28)}
.ogre .mHead{background:#777f45}.ogre .mBody,.ogre .mArm{background:#697340}
.ogre .mBody{left:2px;width:36px}

.warlord{transform:translateX(-50%) scale(1.32)}
.warlord .mHead{background:#56623b}.warlord .mBody{
 left:2px;width:36px;background:linear-gradient(90deg,#3d4447,#899296,#3c4448)
}

.demon{transform:translateX(-50%) scale(1.4)}
.demon .mHead{background:#783838;border-color:#351d1d}
.demon .mBody,.demon .mArm{background:#653030;border-color:#351d1d}
.demon .eye{background:#ff3b25;box-shadow:0 0 7px #ff3b25}

.boss{transform:translateX(-50%) scale(1.55)}
.boss .mHead{background:#3e303d;border-color:#21151f}
.boss .mBody,.boss .mArm{
 background:linear-gradient(#55324e,#342938);border-color:#21151f
}
.boss .eye{background:#ffb329;box-shadow:0 0 8px #ff5629}

.hp{
 position:absolute;left:50%;top:-7px;transform:translateX(-50%);
 width:38px;height:6px;border:1px solid #fff8;border-radius:5px;
 overflow:hidden;background:#5b211e
}
.hp i{display:block;height:100%;width:100%;background:#55d15e}

/* ===== ATIŞ ===== */
.projectile{
 position:absolute;z-index:40;pointer-events:none;transform:translate(-50%,-50%)
}
.arrowProjectile{
 width:17px;height:2px;background:#68472d
}
.cannonball{
 width:11px;height:11px;border-radius:50%;
 background:#282d30;box-shadow:0 0 4px #fff7
}
.explosion{
 position:absolute;z-index:45;width:12px;height:12px;
 transform:translate(-50%,-50%);border-radius:50%;
 background:#ffbd4e;box-shadow:0 0 18px #ff6f24;
 pointer-events:none;animation:boom .32s forwards
}
@keyframes boom{
 50%{width:45px;height:45px}
 100%{width:58px;height:58px;opacity:0}
}

/* ===== UI ===== */
.controls{
 position:absolute;z-index:120;
 left:6px;right:6px;
 bottom:max(7px,env(safe-area-inset-bottom));
 display:flex;gap:5px
}
button{

<script>
const game=document.getElementById("game");

/* =====================================================

const slots=[

/* =====================================================

function notice(text){

 clearTimeout(notice.timer);

  el.classList.remove("show");

}

function sync(){

 $("wave").textContent=wave;
 $("slotPrice").textContent=slotPrice;

 renderChoices();
}

function renderChoices(){

 Object.entries(BUILDINGS).forEach(([type,b])=>{

  button.innerHTML=

/* =====================================================

function buildingHTML(b){

}

/* =====================================================
   SLOT RENDER
===================================================== */

function renderSlots(){

 document.querySelectorAll(".slot").forEach(el=>el.remove());

 slots.forEach((slot,index)=>{

  if(!slot.open)return;

  const el=document.createElement("div");

  el.className="slot";
  el.dataset.slot=index;

  el.style.left=slot.x+"%";
  el.style.top=slot.y+"%";

  const building=
   buildings.find(b=>b.slot===index);

  if(building){

   el.classList.add("building");

   el.innerHTML=
    buildingHTML(building);

   el.addEventListener(
    "pointerdown",
    event=>startBuildingDrag(event,building,el)
   );

  }else{

   el.innerHTML="＋<br>Yapı";

   el.addEventListener("pointerup",()=>{
    if(!drag)openBuild(index);
   });
  }

  game.appendChild(el);
 });
}

function openBuild(slot){
 buildSlot=slot;
 $("buildPanel").style.display="block";
 renderChoices();
}

function closeBuild(){
 buildSlot=null;
 $("buildPanel").style.display="none";
}

function build(type){

 const data=BUILDINGS[type];

 if(
  buildSlot===null ||
  money<data.cost
 )return;

 money-=data.cost;

 buildings.push({
  slot:buildSlot,
  type,
  level:1,
  lastProduction:performance.now()
 });

 closeBuild();
 renderSlots();
 sync();
}

/* =====================================================
   BİNA SÜRÜKLE / BİRLEŞTİR
===================================================== */

function startBuildingDrag(event,building,source){

 event.preventDefault();

 drag={
  building,
  source,
  startX:event.clientX,
  startY:event.clientY,
  moved:false,
  ghost:null
 };

 source.setPointerCapture?.(event.pointerId);

 source.addEventListener("pointermove",moveBuilding);
 source.addEventListener("pointerup",dropBuilding);
 source.addEventListener("pointercancel",dropBuilding);
}

function moveBuilding(event){

 if(!drag)return;

 const moved=
  Math.hypot(
   event.clientX-drag.startX,
   event.clientY-drag.startY
  );

 if(!drag.moved && moved<7)return;

 if(!drag.moved){

  drag.moved=true;

  drag.source.classList.add("dragging");

  const ghost=document.createElement("div");

  ghost.className="dragGhost";
  ghost.innerHTML=buildingHTML(drag.building);

  game.appendChild(ghost);

  drag.ghost=ghost;
 }

 const gameRect=game.getBoundingClientRect();

 drag.ghost.style.left=
  event.clientX-gameRect.left+"px";

 drag.ghost.style.top=
  event.clientY-gameRect.top+"px";

 document.querySelectorAll(".slot").forEach(el=>{
  el.classList.remove("mergeTarget");
 });

 const target=findMergeTarget(
  event.clientX,
  event.clientY,
  drag.building
 );

 if(target!==null){

  document.querySelector(
   `.slot[data-slot="${target}"]`
  )?.classList.add("mergeTarget");
 }
}

function findMergeTarget(x,y,source){

 let result=null;
 let closest=52;

 document.querySelectorAll(".slot.building").forEach(el=>{

  const slotIndex=Number(el.dataset.slot);

  if(slotIndex===source.slot)return;

  const target=
   buildings.find(b=>b.slot===slotIndex);

  if(!target)return;

  if(
   target.type!==source.type ||
   target.level!==source.level ||
   target.level>=5
  )return;

  const rect=el.getBoundingClientRect();

  const distance=
   Math.hypot(
    x-(rect.left+rect.width/2),
    y-(rect.top+rect.height/2)
   );

  if(distance<closest){
   closest=distance;
   result=slotIndex;
  }
 });

 return result;
}

function dropBuilding(event){

 if(!drag)return;

 const current=drag;

 current.source.removeEventListener("pointermove",moveBuilding);
 current.source.removeEventListener("pointerup",dropBuilding);
 current.source.removeEventListener("pointercancel",dropBuilding);

 if(current.moved){

  const targetSlot=
   findMergeTarget(
    event.clientX,
    event.clientY,
    current.building
   );

  if(targetSlot!==null){

   const target=
    buildings.find(b=>b.slot===targetSlot);

   if(
    target &&
    target.type===current.building.type &&
    target.level===current.building.level &&
    target.level<5
   ){

    target.level++;
    target.lastProduction=performance.now();

    buildings=
     buildings.filter(b=>b!==current.building);

    notice(
     BUILDINGS[target.type].name+
     " → Lv."+target.level
    );
   }

  }else{

   notice("Aynı tür ve seviyedeki binanın üzerine bırak.");
  }
 }

 current.ghost?.remove();

 document.querySelectorAll(".slot").forEach(el=>{
  el.classList.remove("mergeTarget","dragging");
 });

 drag=null;

 renderSlots();
 sync();
}

/* =====================================================
   YENİ SLOT
===================================================== */

$("slotBtn").onclick=()=>{

 const slot=slots.find(s=>!s.open);

===================================================== */

function chooseMonster(){

 const available=
  MONSTERS.filter(m=>m.unlock<=wave);

 /*
   Yeni açılan canavarın görünme şansını
   daha yüksek tutuyoruz.
 */

 const newest=
  available[available.length-1];

 if(Math.random()<.32){
  return newest;
 }

 return available[
  Math.floor(Math.random()*available.length)
 ];
}

  lastAttack:0,

 };

 unit.element.className=
  "unit walking";

 if(unit.type==="barracks"){
  unit.element.innerHTML=
   warriorHTML(level);
 }

 if(unit.type==="archer"){

 }

 if(unit.type==="cavalry"){

  unit.element.innerHTML=
   cavalryHTML(level);
 }

 if(unit.type==="artillery"){
  unit.element.classList.add("artilleryUnit");
  unit.element.innerHTML=
   artilleryHTML(level);
 }

 game.appendChild(unit.element);

}

/* =====================================================
   YARDIMCI FONKSİYONLAR
===================================================== */

function distance(a,b){
 return Math.hypot(
  a.x-b.x,
  a.y-b.y
 );
}

function nearestEnemy(unit){

 let target=null;
 let closest=Infinity;

 enemies.forEach(enemy=>{

  const d=
   distance(unit,enemy);

  if(d<closest){
   closest=d;
   target=enemy;
  }
 });

 return target;
}

/*
 Düşman kendisine en yakın savunmacıyı seçer.
 Sura giden yol ancak units.length === 0
 olduğunda açılır.
*/

function nearestDefender(enemy){

 let target=null;
 let closest=Infinity;

 units.forEach(unit=>{

  const d=
   distance(enemy,unit);

  if(d<closest){
   closest=d;
   target=unit;
  }
 });

 return target;
}

/* =====================================================
   HASAR
===================================================== */

function damageEnemy(enemy,amount){

 if(
  !enemy ||
  !enemies.includes(enemy)
 )return;

 enemy.hp-=amount;

 if(enemy.hp<=0){

  money+=
   5+
   wave+
   enemy.reward;

  enemy.element.remove();

  enemies=
   enemies.filter(e=>e!==enemy);

  sync();
 }
}

function damageUnit(unit,amount){

 if(
  !unit ||
  !units.includes(unit)
 )return;

 unit.hp-=amount;

 if(unit.hp<=0){

  unit.element.remove();

  units=
   units.filter(u=>u!==unit);
 }
}

/* =====================================================
   ATIŞ
===================================================== */

function fireProjectile(unit,target,type){

 if(!target)return;

 const projectile={

  x:unit.x,
  y:unit.y,

  target,

  type,

  damage:
   unit.damage,

  level:
   unit.level,

  element:
   document.createElement("div")
 };

 projectile.element.className=
  "projectile "+
  (
   type==="cannon"
    ?"cannonball"
    :"arrowProjectile"
  );

 game.appendChild(
  projectile.element
 );

 projectiles.push(
  projectile
 );
}

/* =====================================================
   TOP PATLAMASI
===================================================== */

function explosion(x,y,damage,level){

 const effect=
  document.createElement("div");

 effect.className="explosion";

 effect.style.left=x+"%";
 effect.style.top=y+"%";

 game.appendChild(effect);

 setTimeout(
  ()=>effect.remove(),
  350
 );

 const radius=
  5+
  level*.9;

 [...enemies].forEach(enemy=>{

  const d=
   Math.hypot(
    enemy.x-x,
    enemy.y-y
   );

  if(d<=radius){

   damageEnemy(
    enemy,
    damage*
    (
     d<2
      ?1
      :.55
    )
   );
  }
 });
}

/* =====================================================
   BİNA ÜRETİMİ
===================================================== */

function updateBuildings(time){

 if(!waveActive)return;

 buildings.forEach(building=>{

  const data=
   BUILDINGS[building.type];

  const productionTime=
   data.rate/
   (
    1+
    (building.level-1)*.20
   )/
   productionBonus;

  const slotElement=
   document.querySelector(
    `.slot[data-slot="${building.slot}"]`
   );

  const progress=
   slotElement?.querySelector(
    ".production i"
   );

  if(progress){

   progress.style.width=
    Math.min(
     100,
     (
      (time-building.lastProduction)/
      (productionTime/gameSpeed)
     )*100
    )+"%";
  }

  if(
   time-building.lastProduction>
   productionTime/gameSpeed
  ){

   building.lastProduction=time;

   spawnUnit(building);
  }
 });
}

/* =====================================================
   BİRLİK AI
===================================================== */

function updateUnits(time,dt){

 for(const unit of [...units]){

  const enemy=
   nearestEnemy(unit);

  if(!enemy){

   /*
     Düşman henüz yoksa birlikler
     kendi savaş hattına ilerler.
   */

   const dx=
    50-unit.x;

   const dy=
    unit.preferredY-unit.y;

   const d=
    Math.hypot(dx,dy);

   if(d>2){

    unit.element.classList.add("walking");

    unit.x+=
     dx/d*
     unit.speed*
     .5*
     dt;

    unit.y+=
     dy/d*
     unit.speed*
     .5*
     dt;

   }else{

    unit.element.classList.remove("walking");
   }

   drawUnit(unit);

   continue;
  }

  const dx=
   enemy.x-unit.x;

  const dy=
   enemy.y-unit.y;

  const dist=
   Math.hypot(dx,dy)||1;

  /* ===== PİYADE ===== */

  if(unit.type==="barracks"){

   if(dist>unit.range){

    unit.element.classList.add("walking");

    unit.x+=
     dx/dist*
     unit.speed*
     dt;

    unit.y+=
     dy/dist*
     unit.speed*
     dt;

   }else{

    unit.element.classList.remove("walking");

    if(
     time-unit.lastAttack>
     unit.attackRate/productionBonus
    ){

     unit.lastAttack=time;

     unit.element.classList.remove("attack");
     void unit.element.offsetWidth;
     unit.element.classList.add("attack");

     damageEnemy(
      enemy,
      unit.damage
     );
    }
   }
  }

  /* ===== OKÇU ===== */

  else if(unit.type==="archer"){

   if(dist>unit.range){

    unit.element.classList.add("walking");

    unit.x+=
     dx/dist*
     unit.speed*
     dt;

    unit.y+=
     dy/dist*
     unit.speed*
     dt;

   }else if(dist<11){

    unit.element.classList.add("walking");

    unit.x-=
     dx/dist*
     unit.speed*
     .55*
     dt;

    unit.y-=
     dy/dist*
     unit.speed*
     .55*
     dt;

   }else{

    unit.element.classList.remove("walking");

    if(
     time-unit.lastAttack>
     unit.attackRate/productionBonus
    ){

     unit.lastAttack=time;

     fireProjectile(
      unit,
      enemy,
      "arrow"
     );
    }
   }
  }

  /* ===== SÜVARİ ===== */

  else if(unit.type==="cavalry"){

   if(dist>unit.range){

    unit.element.classList.add("walking");

    unit.x+=
     dx/dist*
     unit.speed*
     dt;

    unit.y+=
     dy/dist*
     unit.speed*
     dt;

   }else{

    unit.element.classList.remove("walking");

    if(
     time-unit.lastAttack>
     unit.attackRate/productionBonus
    ){

     unit.lastAttack=time;

     let damage=
      unit.damage;

     /*
       İlk hücum darbesi.
     */

     if(unit.charged){

      damage*=1.8;

      unit.charged=false;
     }

     damageEnemy(
      enemy,
      damage
     );
    }
   }
  }

  /* ===== TOPÇU ===== */

  else if(unit.type==="artillery"){

   if(dist>unit.range){

    unit.element.classList.add("walking");

    unit.x+=
     dx/dist*
     unit.speed*
     dt;

    unit.y+=
     dy/dist*
     unit.speed*
     dt;

   }else if(dist<14){

    unit.element.classList.add("walking");

    unit.x-=
     dx/dist*
     unit.speed*
     .7*
     dt;

    unit.y-=
     dy/dist*
     unit.speed*
     .7*
     dt;

   }else{

    unit.element.classList.remove("walking");

    if(
     time-unit.lastAttack>
     unit.attackRate/productionBonus
    ){

     unit.lastAttack=time;

     fireProjectile(
      unit,
      enemy,
      "cannon"
     );
    }
   }
  }

  unit.x=
   Math.max(
    8,
    Math.min(92,unit.x)
   );

  /*
   Birlikler surun ÖNÜNDE savaşabilir.
   Avluya da geri çekilebilirler.
  */

  unit.y=
   Math.max(
    25,
    Math.min(82,unit.y)
   );

  drawUnit(unit);
 }
}

function drawUnit(unit){

 unit.element.style.left=
  unit.x+"%";

 unit.element.style.top=
  unit.y+"%";
}

/* =====================================================
   DÜŞMAN AI

   KRİTİK KURAL:

   SAVUNMA BİRLİĞİ VARSA:
   - kapı hedeflenmez
   - sur hasarı verilmez
   - düşman en yakın savunmacıyla savaşır

   SAVUNMA BİRLİĞİ KALMADIYSA:
   - düşman kapıya ilerler
   - sura hasar verir
===================================================== */

function updateEnemies(time,dt){

 for(const enemy of [...enemies]){

  if(units.length>0){

   const defender=
    nearestDefender(enemy);

   /*
     Defender varsa düşmanın başka hedefi yok.
   */

   if(defender){

    const dx=
     defender.x-enemy.x;

    const dy=
     defender.y-enemy.y;

    const dist=
     Math.hypot(dx,dy)||1;

    if(dist>3.5){

     enemy.element.classList.add("walking");

     enemy.x+=
      dx/dist*
      enemy.speed*
      dt;

     enemy.y+=
      dy/dist*
      enemy.speed*
      dt;

    }else{

     enemy.element.classList.remove("walking");

     if(
      time-enemy.lastAttack>
      850
     ){

      enemy.lastAttack=time;

      damageUnit(
       defender,
       enemy.damage
      );
     }
    }
   }

  }else{

   /*
     Son savunmacı öldü.
     Artık kapı açılıyor.
   */

   const gateX=50;
   const gateY=53;

   const dx=
    gateX-enemy.x;

   const dy=
    gateY-enemy.y;

   const dist=
    Math.hypot(dx,dy)||1;

   enemy.element.classList.add("walking");

   enemy.x+=
    dx/dist*
    enemy.speed*
    dt;

   enemy.y+=
    dy/dist*
    enemy.speed*
    dt;

   /*
     SADECE BU BLOKTA SUR HASARI VAR.
   */

   if(dist<1.5){

    wallHP-=
     enemy.wallDamage;

    enemy.element.remove();

    enemies=
     enemies.filter(
      e=>e!==enemy
     );

    sync();

    if(wallHP<=0){

     wallHP=0;

     waveActive=false;

     sync();

     $("waveBtn").disabled=true;

     notice("SUR YIKILDI!");

     continue;
    }
   }
  }

  enemy.element.style.left=
   enemy.x+"%";

  enemy.element.style.top=
   enemy.y+"%";

  const hp=
   enemy.element.querySelector(
    ".hp i"
   );

  if(hp){

   hp.style.width=
    Math.max(
     0,
     enemy.hp/enemy.maxHP*100
    )+"%";
  }
 }
}

/* =====================================================
   MERMİLER
===================================================== */

function updateProjectiles(dt){

 for(const projectile of [...projectiles]){

  if(
   !projectile.target ||
   !enemies.includes(projectile.target)
  ){

   projectile.element.remove();

   projectiles=
    projectiles.filter(
     p=>p!==projectile
    );

   continue;
  }

  const dx=
   projectile.target.x-
   projectile.x;

  const dy=
   projectile.target.y-
   projectile.y;

  const dist=
   Math.hypot(dx,dy)||1;

  const projectileSpeed=
   projectile.type==="cannon"
    ?.022
    :.040;

  if(dist<1.7){

   const hitX=
    projectile.target.x;

   const hitY=
    projectile.target.y;

   if(
    projectile.type==="cannon"
   ){

    explosion(
     hitX,
     hitY,
     projectile.damage,
     projectile.level
    );

   }else{

    damageEnemy(
     projectile.target,
     projectile.damage
    );
   }

   projectile.element.remove();

   projectiles=
    projectiles.filter(
     p=>p!==projectile
    );

   continue;
  }

  projectile.x+=
   dx/dist*
   projectileSpeed*
   dt;

  projectile.y+=
   dy/dist*
   projectileSpeed*
   dt;

  projectile.element.style.left=
   projectile.x+"%";

  projectile.element.style.top=
   projectile.y+"%";

  if(
   projectile.type==="arrow"
  ){

   const angle=
    Math.atan2(dy,dx)*
    180/Math.PI;

   projectile.element.style.transform=
    `translate(-50%,-50%) rotate(${angle}deg)`;
  }
 }
}

/* =====================================================
   DALGA SONU
===================================================== */

function checkWaveEnd(){

 if(
  !waveActive ||
  enemiesToSpawn>0 ||
  enemies.length>0
 )return;

 waveActive=false;

 /*
   Hayatta kalan birlikler dalga sonunda
   kaleye dönmüş kabul edilip temizleniyor.
 */

 units.forEach(
  unit=>unit.element.remove()
 );

 units=[];

 projectiles.forEach(
  projectile=>
   projectile.element.remove()
 );

 projectiles=[];

 document.querySelectorAll(".production i").forEach(el=>{
  el.style.width="0%";
 });

 $("waveBtn").disabled=false;

 $("upgradePanel").style.display="block";
}

/* =====================================================
   DALGA SONU GELİŞTİRME
===================================================== */

function upgrade(type){

 if(type==="damage"){
  damageBonus*=1.20;
 }

 if(type==="rate"){
  productionBonus*=1.15;
 }

 if(type==="wall"){
  wallHP=Math.min(
   1500,
   wallHP+100
  );
 }

 if(type==="money"){
  money+=120;
 }

 $("upgradePanel").style.display="none";

 sync();
}

/* =====================================================
   ANA DÖNGÜ
===================================================== */

function gameLoop(time){

 const realDt=
  Math.min(
   40,
   time-lastFrame
  );

 const dt=
  realDt*
  gameSpeed;

 lastFrame=time;

 /*
   Düşman üretimi.
 */

 if(
  waveActive &&
  enemiesToSpawn>0 &&
  time-lastEnemySpawn>
  700/gameSpeed
 ){

  spawnEnemy();

  enemiesToSpawn--;

  lastEnemySpawn=time;
 }

 updateBuildings(time);

 updateUnits(time,dt);

 /*
   Savunmacılar önce güncellenir.
   Ardından düşmanlar mevcut canlı
   savunmacı listesine göre karar verir.
 */

 updateEnemies(time,dt);

 updateProjectiles(dt);

 checkWaveEnd();

 requestAnimationFrame(gameLoop);
}

/* =====================================================
   BAŞLAT
===================================================== */

renderSlots();
sync();
requestAnimationFrame(gameLoop);

</script>
