const M=[['goblin','Goblin',1,.65,1.25,3,18,4],['orc','Ork',2,.95,1,4,25,6],['wolf','Kurt Yaratık',3,.72,1.55,4,22,7],['raider','Yağmacı',4,1.15,1.12,5,30,8],['armored','Zırhlı Ork',5,1.65,.82,7,40,11],['brute','Vahşi',6,2,.75,8,48,14],['ogre','Ogre',7,2.6,.62,10,60,18],['warlord','Savaş Lordu',8,3.1,.68,12,70,22],['demon','İblis',9,3.7,.72,13,80,27],['boss','Kadim Muhafız',10,5,.58,17,100,40]].map(a=>({type:a[0],name:a[1],unlock:a[2],hp:a[3],speed:a[4],damage:a[5],wall:a[6],reward:a[7]}));
const towers={left:{count:0,x:8,y:56.5,last:[0,0,0,0]},right:{count:0,x:92,y:56.5,last:[0,0,0,0]}};
$('play').onclick=()=>{$('start').classList.add('hide');setTimeout(()=>$('start').style.display='none',550)};function notice(t){$('notice').textContent=t;$('notice').classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(()=>$('notice').classList.remove('show'),1400)}function sync(){$('money').textContent=Math.floor(money);$('wallHP').textContent=Math.max(0,Math.floor(wallHP));$('wave').textContent=wave;renderChoices();towerPanel()}
function renderChoices(){let x=$('buildChoices');x.innerHTML='';Object.entries(B).forEach(([k,d])=>{let b=document.createElement('button');b.innerHTML=`${d.icon} ${d.name}<br>${d.cost} 🪙`;b.disabled=money<d.cost;b.onclick=()=>build(k);x.appendChild(b)})}function bh(b){let c=b.type==='archer'?'archerB':b.type==='cavalry'?'cavalryB':b.type==='artillery'?'artilleryB':'';return `<div class="bm ${c}"><i class="house"></i><i class="roof"></i><i class="flag">${B[b.type].icon}</i></div><span class="level">Lv.${b.level}</span><span class="prod"><i></i></span>`}
function renderSlots(){document.querySelectorAll('.slot').forEach(e=>e.remove());slots.forEach((s,i)=>{let el=document.createElement('div');el.className='slot';el.dataset.slot=i;el.style.left=s.x+'%';el.style.top=s.y+'%';let b=buildings.find(x=>x.slot===i);if(b){el.classList.add('building');el.innerHTML=bh(b);el.onpointerdown=e=>startDrag(e,b,el)}else{el.innerHTML='＋<br>YAPI';el.onpointerup=()=>{if(drag)return;buildSlot=i;$('towerPanel').style.display='none';$('buildPanel').style.display='block';renderChoices()}}game.appendChild(el)});document.querySelectorAll('.slot').forEach(e=>e.classList.remove('canMerge'));buildings.forEach(b=>{if(b.level<5&&buildings.some(o=>o!==b&&o.type===b.type&&o.level===b.level))document.querySelector(`[data-slot="${b.slot}"]`)?.classList.add('canMerge')})}
function build(t){let d=B[t];if(buildSlot==null||money<d.cost)return;money-=d.cost;buildings.push({slot:buildSlot,type:t,level:1,lastProduction:gameTime});buildSlot=null;$('buildPanel').style.display='none';renderSlots();sync()}$('closeBuild').onclick=()=>{$('buildPanel').style.display='none';buildSlot=null};function startDrag(e,b,el){e.preventDefault();drag={b,el,x:e.clientX,y:e.clientY,m:false,g:null};el.setPointerCapture?.(e.pointerId);el.onpointermove=moveDrag;el.onpointerup=dropDrag;el.onpointercancel=dropDrag}function target(x,y,b){let out=null,best=58;document.querySelectorAll('.slot.building').forEach(el=>{let s=+el.dataset.slot,o=buildings.find(q=>q.slot===s);if(!o||s===b.slot||o.type!==b.type||o.level!==b.level||o.level>=5)return;let r=el.getBoundingClientRect(),d=Math.hypot(x-r.left-r.width/2,y-r.top-r.height/2);if(d<best){best=d;out=s}});return out}function moveDrag(e){if(!drag)return;if(!drag.m&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<7)return;if(!drag.m){drag.m=true;drag.g=document.createElement('div');drag.g.className='slot building';drag.g.style.zIndex=999;drag.g.innerHTML=bh(drag.b);game.appendChild(drag.g)}let r=game.getBoundingClientRect();drag.g.style.left=e.clientX-r.left+'px';drag.g.style.top=e.clientY-r.top+'px';document.querySelectorAll('.mergeTarget').forEach(x=>x.classList.remove('mergeTarget'));let s=target(e.clientX,e.clientY,drag.b);if(s!=null)document.querySelector(`[data-slot="${s}"]`)?.classList.add('mergeTarget')}function dropDrag(e){if(!drag)return;let d=drag,s=d.m?target(e.clientX,e.clientY,d.b):null;if(s!=null){let t=buildings.find(x=>x.slot===s);t.level++;t.lastProduction=gameTime;buildings=buildings.filter(x=>x!==d.b);notice(B[t.type].name+' → Lv.'+t.level)}d.g?.remove();drag=null;renderSlots();sync()}
function towerPanel(){if(!selectedTower)return;let t=towers[selectedTower];$('towerCurrent').textContent=t.count;$('towerAdd').disabled=t.count>=4||money<60;$('towerAdd').textContent=t.count>=4?'✓ Kule Dolu — 4/4':'🏹 Okçu Yerleştir — 60 🪙'}document.querySelectorAll('.towerTap').forEach(x=>x.onpointerup=()=>{selectedTower=x.dataset.tower;$('towerTitle').textContent=selectedTower==='left'?'🏹 Sol Sur Kulesi':'🏹 Sağ Sur Kulesi';$('towerPanel').style.display='block';$('buildPanel').style.display='none';towerPanel()});$('towerAdd').onclick=()=>{let t=towers[selectedTower];if(!t||t.count>=4)return;if(money<60){notice('Yeterli altın yok.');return}money-=60;t.last[t.count]=gameTime-2000;t.count++;renderTowers();sync()};$('closeTower').onclick=()=>{$('towerPanel').style.display='none';selectedTower=null};function renderTowers(){['left','right'].forEach(s=>{let t=towers[s],b=$(s+'Archers');b.innerHTML='';for(let i=0;i<t.count;i++)b.innerHTML+='<i class="ta"></i>';$(s+'Count').textContent=t.count+'/4'})}
$('waveBtn').onclick=()=>{if(waveActive||wallHP<=0)return;wave++;waveActive=true;enemiesToSpawn=5+wave*2;lastSpawn=gameTime-1000;buildings.forEach(b=>b.lastProduction=gameTime);$('waveBtn').disabled=true;let n=M.find(m=>m.unlock===wave);if(n)notice('⚠ Yeni düşman: '+n.name);sync()};$('speedBtn').onclick=()=>{gameSpeed=gameSpeed===1?2:gameSpeed===2?3:1;$('speedBtn').textContent='⏩ x'+gameSpeed};
function spawnEnemy(){let a=M.filter(m=>m.unlock<=wave),m=Math.random()<.34?a[a.length-1]:a[Math.floor(Math.random()*a.length)],base=32+wave*11,e={type:m.type,x:35+Math.random()*30,y:24,hp:base*m.hp,maxHP:base*m.hp,speed:(.006+wave*.00016)*m.speed,damage:m.damage+wave*.22,wallDamage:m.wall,reward:m.reward,lastAttack:0,el:document.createElement('div')};e.el.className='enemy';e.el.innerHTML=`<div class="monster ${m.type}"></div><div class="hp"><i></i></div>`;game.appendChild(e.el);enemies.push(e)}function spawnUnit(b){let s=slots[b.slot],l=b.level,st={barracks:[48+l*16,10+l*6,.010,3.4,650,53],archer:[30+l*10,10+l*7,.007,24+l*2,1000,56],cavalry:[60+l*19,17+l*9,.017,4.2,850,48],artillery:[42+l*13,28+l*16,.0045,32+l*2,2100,58]}[b.type],u={type:b.type,level:l,x:s.x+(Math.random()-.5)*4,y:62,hp:st[0],damage:st[1]*damageBonus,speed:st[2],range:st[3],rate:st[4],py:st[5],last:0,charged:true,el:document.createElement('div')};u.el.className='unit '+(b.type==='archer'?'archerU':b.type==='cavalry'?'cavalryU':b.type==='artillery'?'artilleryU':'');u.el.innerHTML=b.type==='cavalry'||b.type==='artillery'?'':`<i class="head"></i><i class="body"></i><i class="weapon"></i>`;game.appendChild(u.el);units.push(u)}const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function nearEnemy(u){let t=null,z=1e9;enemies.forEach(e=>{let d=dist(u,e);if(d<z){z=d;t=e}});return t}function nearUnit(e){let t=null,z=1e9;units.forEach(u=>{let d=dist(e,u);if(d<z){z=d;t=u}});return t}function damageE(e,d){if(!enemies.includes(e))return;e.hp-=d;if(e.hp<=0){money+=5+wave+e.reward;e.el.remove();enemies=enemies.filter(x=>x!==e);sync()}}function damageU(u,d){u.hp-=d;if(u.hp<=0){u.el.remove();units=units.filter(x=>x!==u)}}function fire(u,e,type){let p={x:u.x,y:u.y,target:e,type,damage:u.damage,level:u.level,el:document.createElement('div')};p.el.className='projectile '+(type==='cannon'?'cannonball':'');game.appendChild(p.el);projectiles.push(p)}
function updateBuildings(){if(!waveActive)return;buildings.forEach(b=>{let d=B[b.type],time=d.rate/(1+(b.level-1)*.2)/productionBonus,p=gameTime-b.lastProduction,bar=document.querySelector(`[data-slot="${b.slot}"] .prod i`);if(bar)bar.style.width=Math.min(100,p/time*100)+'%';if(p>=time){b.lastProduction=gameTime;spawnUnit(b)}})}function move(u,dx,dy,d,a,dt){u.x+=dx/d*a*dt;u.y+=dy/d*a*dt}function updateUnits(dt){[...units].forEach(u=>{let e=nearEnemy(u);if(!e){let dx=50-u.x,dy=u.py-u.y,d=Math.hypot(dx,dy)||1;if(d>2)move(u,dx,dy,d,u.speed*.45,dt)}else{let dx=e.x-u.x,dy=e.y-u.y,d=Math.hypot(dx,dy)||1;if(u.type==='barracks'){if(d>u.range)move(u,dx,dy,d,u.speed,dt);else if(gameTime-u.last>=u.rate){u.last=gameTime;damageE(e,u.damage)}}else if(u.type==='archer'){if(d>u.range)move(u,dx,dy,d,u.speed,dt);else if(d<11)move(u,-dx,-dy,d,u.speed*.55,dt);else if(gameTime-u.last>=u.rate){u.last=gameTime;fire(u,e,'arrow')}}else if(u.type==='cavalry'){if(d>u.range)move(u,dx,dy,d,u.speed,dt);else if(gameTime-u.last>=u.rate){u.last=gameTime;damageE(e,u.damage*(u.charged?1.8:1));u.charged=false}}else{if(d>u.range)move(u,dx,dy,d,u.speed,dt);else if(d<14)move(u,-dx,-dy,d,u.speed*.7,dt);else if(gameTime-u.last>=u.rate){u.last=gameTime;fire(u,e,'cannon')}}}u.x=Math.max(6,Math.min(94,u.x));u.y=Math.max(25,Math.min(62,u.y));u.el.style.left=u.x+'%';u.el.style.top=u.y+'%'})}
function updateEnemies(dt){[...enemies].forEach(e=>{if(units.length){let u=nearUnit(e);if(u){let dx=u.x-e.x,dy=u.y-e.y,d=Math.hypot(dx,dy)||1;if(d>3.7){e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}else if(gameTime-e.lastAttack>=850){e.lastAttack=gameTime;damageU(u,e.damage)}}}else{let dx=50-e.x,dy=61-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;if(d<1.6){wallHP-=e.wallDamage;e.el.remove();enemies=enemies.filter(x=>x!==e);if(wallHP<=0){wallHP=0;waveActive=false;$('waveBtn').disabled=true;notice('SUR YIKILDI!')}sync();return}}e.el.style.left=e.x+'%';e.el.style.top=e.y+'%';e.el.querySelector('.hp i').style.width=Math.max(0,e.hp/e.maxHP*100)+'%'})}
function towerFire(){if(!waveActive)return;['left','right'].forEach(s=>{let t=towers[s];for(let i=0;i<t.count;i++){if(gameTime-t.last[i]<1050)continue;let target=null,best=1e9;enemies.forEach(e=>{let d=Math.hypot(e.x-t.x,e.y-t.y);if(d<=52&&d<best){best=d;target=e}});if(target){t.last[i]=gameTime;let p={x:t.x,y:t.y-2.5,target,type:'tower',damage:(12+wave*.45)*damageBonus,level:1,el:document.createElement('div')};p.el.className='projectile';game.appendChild(p.el);projectiles.push(p)}}})}function explosion(x,y,d,l){let q=document.createElement('div');q.className='boom';q.style.left=x+'%';q.style.top=y+'%';game.appendChild(q);setTimeout(()=>q.remove(),400);let r=5.5+l*.9;[...enemies].forEach(e=>{let z=Math.hypot(e.x-x,e.y-y);if(z<=r)damageE(e,d*(z<2.3?1:.55))})}function updateP(dt){[...projectiles].forEach(p=>{if(!p.target||!enemies.includes(p.target)){p.el.remove();projectiles=projectiles.filter(x=>x!==p);return}let dx=p.target.x-p.x,dy=p.target.y-p.y,d=Math.hypot(dx,dy)||1,s=p.type==='cannon'?.024:p.type==='tower'?.055:.045;if(d<1.7){let x=p.target.x,y=p.target.y;p.type==='cannon'?explosion(x,y,p.damage,p.level):damageE(p.target,p.damage);p.el.remove();projectiles=projectiles.filter(x=>x!==p);return}p.x+=dx/d*s*dt;p.y+=dy/d*s*dt;p.el.style.left=p.x+'%';p.el.style.top=p.y+'%';p.el.style.transform=`rotate(${Math.atan2(dy,dx)*180/Math.PI}deg)`})}function endWave(){if(!waveActive||enemiesToSpawn||enemies.length)return;waveActive=false;units.forEach(u=>u.el.remove());units=[];projectiles.forEach(p=>p.el.remove());projectiles=[];$('waveBtn').disabled=false;$('upgradePanel').style.display='block'}document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let t=b.dataset.up;if(t==='damage')damageBonus*=1.2;if(t==='production')productionBonus*=1.15;if(t==='wall')wallHP=Math.min(1500,wallHP+100);if(t==='money')money+=120;$('upgradePanel').style.display='none';sync()});function loop(rt){let real=Math.min(40,rt-lastReal);lastReal=rt,dt=real*gameSpeed;gameTime+=dt;if(waveActive&&enemiesToSpawn>0&&gameTime-lastSpawn>=700){spawnEnemy();enemiesToSpawn--;lastSpawn=gameTime}updateBuildings();updateUnits(dt);towerFire();updateEnemies(dt);updateP(dt);endWave();requestAnimationFrame(loop)}renderSlots();renderTowers();sync();requestAnimationFrame(loop);
</script></body></html>
