<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sur Savunması V8</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#18251f;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#fff;
}

#g{
  position:relative;
  width:min(100vw,520px);
  height:100dvh;
  margin:auto;
  overflow:hidden;
  touch-action:manipulation;
  background:
    radial-gradient(circle at 22% 18%,#f1e5a0 0 2px,transparent 3px),
    radial-gradient(circle at 74% 27%,#f1e5a0 0 2px,transparent 3px),
    linear-gradient(#86bfe0 0 19%,#b8d98d 19% 54%,#c9ad72 54% 100%);
}

/* ---------- UZAK MANZARA ---------- */

.mountains{
  position:absolute;
  z-index:0;
  top:10%;
  left:0;
  right:0;
  height:20%;
  overflow:hidden;
}

.mountain{
  position:absolute;
  bottom:-25px;
  width:190px;
  height:145px;
  transform:rotate(45deg);
  background:linear-gradient(135deg,#7e9c78,#5e7c61);
  border-radius:18px;
  opacity:.95;
}

.m1{left:-75px}
.m2{left:105px;width:220px;height:170px;background:linear-gradient(135deg,#91aa7c,#6d8869)}
.m3{right:-80px;width:210px;height:155px}

.mountain:after{
  content:"";
  position:absolute;
  width:48px;
  height:48px;
  top:4px;
  left:4px;
  background:#e7ead7;
  clip-path:polygon(0 0,100% 0,0 100%);
  border-radius:8px 0 0;
}

.farTrees{
  position:absolute;
  z-index:1;
  top:25%;
  left:0;
  right:0;
  height:29%;
  overflow:hidden;
  pointer-events:none;
}

.farTrees span{
  position:absolute;
  font-size:40px;
  filter:drop-shadow(0 4px 2px #0002);
}

.road{
  position:absolute;
  z-index:1;
  top:26%;
  left:35%;
  width:30%;
  height:31%;
  background:linear-gradient(90deg,#b69767,#d2b782 48%,#b69767);
  clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);
  opacity:.9;
}

/* ---------- ÇİM / TAŞ DETAYLARI ---------- */

.grassDetail{
  position:absolute;
  inset:20% 0 46% 0;
  z-index:1;
  pointer-events:none;
  opacity:.55;
  background:
    radial-gradient(ellipse at 10% 20%,#527c47 0 3px,transparent 4px),
    radial-gradient(ellipse at 18% 70%,#527c47 0 3px,transparent 4px),
    radial-gradient(ellipse at 88% 32%,#527c47 0 3px,transparent 4px),
    radial-gradient(ellipse at 80% 77%,#527c47 0 3px,transparent 4px),
    radial-gradient(ellipse at 64% 45%,#668c50 0 2px,transparent 3px),
    radial-gradient(ellipse at 31% 40%,#668c50 0 2px,transparent 3px);
}

/* ---------- SUR ---------- */

.wall{
  position:absolute;
  z-index:6;
  top:53%;
  left:-2%;
  width:104%;
  height:82px;
  background:
    linear-gradient(#9b9c91 0 9px,transparent 9px),
    repeating-linear-gradient(
      90deg,
      #b9b7a9 0 40px,
      #8e8c80 40px 44px,
      #aaa89c 44px 80px
    );
  border-top:5px solid #696b64;
  border-bottom:7px solid #68665e;
  box-shadow:
    0 7px 0 #0002,
    inset 0 8px 0 #d4d2c4;
}

.wall:before{
  content:"";
  position:absolute;
  top:-18px;
  left:0;
  right:0;
  height:22px;
  background:
    repeating-linear-gradient(
      90deg,
      #aaa99d 0 28px,
      transparent 28px 39px
    );
}

.gate{
  position:absolute;
  left:50%;
  bottom:-1px;
  transform:translateX(-50%);
  width:27%;
  height:76px;
  border:6px solid #5c554b;
  border-bottom:0;
  border-radius:48px 48px 0 0;
  background:
    repeating-linear-gradient(
      90deg,
      #855839 0 12px,
      #5f3d29 12px 15px
    );
  box-shadow:inset 0 0 0 3px #a7784d;
}

.gate:after{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:4px;
  transform:translateX(-50%);
  background:#503323;
}

/* ---------- KALE İÇİ ---------- */

.courtyard{
  position:absolute;
  z-index:0;
  top:61%;
  bottom:0;
  left:0;
  right:0;
  background:
    radial-gradient(circle at 20% 30%,#d8c28f 0 3px,transparent 4px),
    radial-gradient(circle at 77% 52%,#d8c28f 0 3px,transparent 4px),
    radial-gradient(circle at 43% 78%,#a58d62 0 2px,transparent 3px),
    linear-gradient(#c6aa73,#aa8b59);
}

.castle{
  position:absolute;
  z-index:2;
  bottom:9%;
  left:50%;
  transform:translateX(-50%);
  width:116px;
  height:90px;
  filter:drop-shadow(0 7px 3px #0004);
}

.keep{
  position:absolute;
  left:24px;
  bottom:0;
  width:68px;
  height:68px;
  background:#aaa89d;
  border:4px solid #65645f;
  border-radius:5px;
}

.keep:before{
  content:"";
  position:absolute;
  top:-16px;
  left:-4px;
  width:68px;
  height:20px;
  background:
    repeating-linear-gradient(
      90deg,
      #aaa89d 0 15px,
      transparent 15px 23px
    );
}

.towerL,.towerR{
  position:absolute;
  bottom:0;
  width:32px;
  height:78px;
  background:#96958c;
  border:4px solid #5d5d58;
}

.towerL{left:0}
.towerR{right:0}

.towerL:before,.towerR:before{
  content:"";
  position:absolute;
  left:-4px;
  top:-14px;
  width:32px;
  height:18px;
  background:
    repeating-linear-gradient(
      90deg,
      #96958c 0 9px,
      transparent 9px 14px
    );
}

.keepDoor{
  position:absolute;
  left:50%;
  bottom:-4px;
  transform:translateX(-50%);
  width:23px;
  height:32px;
  background:#62442f;
  border:3px solid #4c3527;
  border-radius:14px 14px 0 0;
}

/* ---------- HUD ---------- */

.hud{
  position:absolute;
  z-index:30;
  top:max(8px,env(safe-area-inset-top));
  left:8px;
  right:8px;
  display:flex;
  justify-content:space-between;
  gap:6px;
}

.pill{
  min-width:88px;
  text-align:center;
  padding:8px 10px;
  border-radius:18px;
  font-size:14px;
  font-weight:900;
  background:linear-gradient(#344b40ee,#1e332aee);
  border:2px solid #ffffff80;
  box-shadow:0 4px 8px #0003,inset 0 1px #ffffff30;
}

/* ---------- YAPI SLOTLARI ---------- */

.slot{
  position:absolute;
  z-index:12;
  width:70px;
  height:70px;
  display:grid;
  place-items:center;
  text-align:center;
  border:3px dashed #715b3d;
  border-radius:50%;
  background:#f6dfaa66;
  color:#493b2c;
  font-size:12px;
  font-weight:900;
  box-shadow:0 3px 6px #0002;
}

.slot:not(.building):after{
  content:"";
  position:absolute;
  inset:7px;
  border-radius:50%;
  border:1px solid #fff7;
}

.building{
  overflow:visible!important;
  border:0!important;
  background:transparent!important;
  box-shadow:none!important;
}

.mini{
  position:relative;
  width:68px;
  height:64px;
  display:block;
  filter:drop-shadow(0 5px 2px #0004);
}

.mini .base{
  position:absolute;
  left:9px;
  right:9px;
  bottom:2px;
  height:38px;
  border:3px solid #5f4935;
  border-radius:6px;
  background:linear-gradient(#e1c38a,#b9905e);
}

.mini .roof{
  position:absolute;
  left:4px;
  right:4px;
  top:1px;
  height:31px;
  border:3px solid #614332;
  background:#a74d3d;
  clip-path:polygon(50% 0,100% 100%,0 100%);
}

.mini.archer .roof{background:#3f7797}
.mini.mage .roof{background:#714b9b}
.mini.tower .roof{background:#526d80}
.mini.catapult .roof{background:#80583e}

.mini .door{
  position:absolute;
  left:28px;
  bottom:4px;
  width:14px;
  height:19px;
  border:2px solid #543a29;
  border-radius:7px 7px 0 0;
  background:#704c33;
}

.mini .sign{
  position:absolute;
  z-index:4;
  right:-1px;
  top:21px;
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  border-radius:50%;
  border:2px solid #604833;
  background:#fff0c9;
  font-size:16px;
}

.lvl{
  position:absolute;
  z-index:6;
  left:1px;
  bottom:0;
  padding:2px 5px;
  border-radius:8px;
  background:#59398b;
  color:#fff;
  font-size:10px;
  box-shadow:0 2px 3px #0003;
}

.prod{
  position:absolute;
  left:8px;
  right:8px;
  bottom:-5px;
  height:7px;
  overflow:hidden;
  border:1px solid #fff;
  border-radius:8px;
  background:#26372e;
}

.prod i{
  display:block;
  width:0%;
  height:100%;
  border-radius:8px;
  background:#f4c953;
}

/* ---------- KARAKTERLER ---------- */

.enemy,.unit,.proj{
  position:absolute;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.enemy{
  z-index:10;
  font-size:28px;
  filter:drop-shadow(0 3px 2px #0005);
}

.unit{
  z-index:11;
  font-size:26px;
  filter:drop-shadow(0 3px 2px #0005);
}

.proj{
  z-index:20;
  font-size:18px;
  text-shadow:0 0 5px #fff;
}

.hp{
  position:absolute;
  left:50%;
  top:-7px;
  transform:translateX(-50%);
  width:32px;
  height:5px;
  overflow:hidden;
  border-radius:4px;
  background:#5b211e;
  border:1px solid #fff8;
}

.hp i{
  display:block;
  width:100%;
  height:100%;
  background:#56d260;
}

.slash{
  animation:slash .18s alternate 2;
}

@keyframes slash{
  to{
    transform:translate(-50%,-50%) rotate(22deg) scale(1.28);
  }
}

/* ---------- ALT BUTONLAR ---------- */

.controls{
  position:absolute;
  z-index:30;
  left:6px;
  right:6px;
  bottom:max(7px,env(safe-area-inset-bottom));
  display:flex;
  justify-content:center;
  gap:5px;
}

button{
  border:0;
  border-radius:13px;
  padding:10px 9px;
  font-weight:900;
  color:#26352d;
  background:linear-gradient(#fff,#e9e6da);
  box-shadow:0 4px 0 #0004;
  cursor:pointer;
}

.controls button{
  flex:1;
  max-width:180px;
  font-size:12px;
}

button:active{
  transform:translateY(2px);
  box-shadow:0 2px 0 #0004;
}

button:disabled{
  opacity:.4;
  transform:none;
}

/* ---------- PANELLER ---------- */

.panel{
  display:none;
  position:absolute;
  z-index:50;
  left:6%;
  right:6%;
  top:17%;
  padding:16px;
  text-align:center;
  border-radius:22px;
  border:2px solid #ffffff80;
  background:linear-gradient(#294439f7,#172c24f7);
  box-shadow:0 15px 40px #0007;
}

.panel h3{
  margin:0 0 12px;
  font-size:21px;
}

.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.choices button{
  min-height:59px;
}

.note{
  margin:10px 0;
  font-size:12px;
  opacity:.8;
}

/* küçük ekran */
@media(max-height:650px){
  .slot{width:62px;height:62px}
  .mini{transform:scale(.9)}
  .wall{height:67px}
  .castle{bottom:10%;transform:translateX(-50%) scale(.88)}
}
</style>
</head>

<body>
<div id="g">

  <div class="mountains">
    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
    <div class="mountain m3"></div>
  </div>

  <div class="road"></div>
  <div class="grassDetail"></div>

  <div class="farTrees">
    <span style="left:-10px;top:0">🌲</span>
    <span style="left:32px;top:45px">🌳</span>
    <span style="left:5px;top:115px">🌲</span>

    <span style="right:-8px;top:8px">🌲</span>
    <span style="right:32px;top:62px">🌳</span>
    <span style="right:4px;top:128px">🌲</span>
  </div>

  <div class="wall">
    <div class="gate"></div>
  </div>

  <div class="courtyard"></div>

  <div class="castle">
    <div class="towerL"></div>
    <div class="keep">
      <div class="keepDoor"></div>
    </div>
    <div class="towerR"></div>
  </div>

  <div class="hud">
    <span class="pill">🪙 <b id="money">300</b></span>
    <span class="pill">❤️ <b id="wallhp">1000</b></span>
    <span class="pill">🌊 <b id="wave">0</b></span>
  </div>

  <div class="controls">
    <button id="waveBtn">⚔️ Dalga Başlat</button>
    <button id="slotBtn">➕ Slot — <span id="slotPrice">100</span>🪙</button>
    <button id="speedBtn">⏩ x1</button>
  </div>

  <div id="panel" class="panel">
    <h3>🏗️ Yapı seç</h3>
    <div id="choices" class="choices"></div>
    <div class="note">
      Aynı tür ve seviyedeki iki yapıya sırayla dokun.
      Yapılar Lv.5'e kadar birleşebilir.
    </div>
    <button onclick="closePanel()">Kapat</button>
  </div>

  <div id="upgrade" class="panel">
    <h3>🏆 Dalga Tamamlandı</h3>
    <div class="choices">
      <button onclick="upgrade('dmg')">⚔️ Hasar +20%</button>
      <button onclick="upgrade('rate')">⏱️ Hız +15%</button>
      <button onclick="upgrade('wall')">❤️ Sur +100</button>
      <button onclick="upgrade('coin')">🪙 +100</button>
    </div>
  </div>

<script>
const G = document.getElementById('g');
const $ = id => document.getElementById(id);

let money = 300;
let wall = 1000;
let wave = 0;
let active = false;
let speed = 1;
let slotPrice = 100;

let sel = null;
let buildSlot = null;

let dmgMul = 1;
let rateMul = 1;

let enemies = [];
let units = [];
let projectiles = [];
let buildings = [];

let spawnLeft = 0;
let lastSpawn = 0;
let lastT = performance.now();

const slots = [
  {x:17,y:69,o:1},
  {x:38,y:74,o:1},
  {x:62,y:74,o:1},
  {x:83,y:69,o:0},
  {x:27,y:85,o:0},
  {x:73,y:85,o:0}
];

const D = {
  barracks:{
    n:'Kışla',
    i:'🛡️',
    c:75,
    r:2200,
    d:9
  },

  archer:{
    n:'Okçu Ocağı',
    i:'🏹',
    c:90,
    r:3300,
    d:12
  },

  mage:{
    n:'Büyücü Kulesi',
    i:'🔮',
    c:135,
    r:1700,
    d:20,
    def:1
  },

  tower:{
    n:'Okçu Kulesi',
    i:'🗼',
    c:125,
    r:1200,
    d:8,
    def:1
  },

  catapult:{
    n:'Mancınık',
    i:'☄️',
    c:150,
    r:2400,
    d:25,
    def:1
  }
};

function sync(){
  $('money').textContent = Math.floor(money);
  $('wallhp').textContent = Math.max(0,Math.floor(wall));
  $('wave').textContent = wave;
  $('slotPrice').textContent = slotPrice;

  $('slotBtn').disabled =
    money < slotPrice ||
    slots.every(s => s.o);

  choices();
}

function choices(){
  const c = $('choices');

  c.innerHTML = '';

  for(const [k,d] of Object.entries(D)){
    const b = document.createElement('button');

    b.innerHTML =
      `${d.i} ${d.n}<br>${d.c}🪙`;

    b.disabled = money < d.c;

    b.onclick = () => build(k);

    c.appendChild(b);
  }
}

function buildingHTML(b){

  let mark =
    b.t === 'barracks' ? '⚔️' :
    b.t === 'archer' ? '🏹' :
    b.t === 'mage' ? '🔮' :
    b.t === 'tower' ? '🏹' :
    '☄️';

  return `
    <span class="mini ${b.t}">
      <i class="base"></i>
      <i class="roof"></i>
      <i class="door"></i>
      <i class="sign">${mark}</i>
    </span>

    <span class="lvl">
      Lv.${b.l}
    </span>

    ${
      D[b.t].def
      ? ''
      : '<span class="prod"><i></i></span>'
    }
  `;
}

function render(){

  document
    .querySelectorAll('.slot')
    .forEach(x => x.remove());

  slots.forEach((sl,i) => {

    if(!sl.o) return;

    const e = document.createElement('div');

    e.className = 'slot';
    e.dataset.slot = i;

    e.style.left =
      `calc(${sl.x}% - 35px)`;

    e.style.top =
      `calc(${sl.y}% - 35px)`;

    const b =
      buildings.find(q => q.s === i);

    if(b){

      e.classList.add('building');

      e.innerHTML = buildingHTML(b);

      e.onclick = () => tap(b);

    }else{

      e.innerHTML = '＋<br>Yapı';

      e.onclick = () => openPanel(i);
    }

    G.appendChild(e);
  });
}

function openPanel(i){

  buildSlot = i;

  $('panel').style.display = 'block';

  choices();
}

function closePanel(){

  $('panel').style.display = 'none';

  buildSlot = null;
}

function build(t){

  const d = D[t];

  if(
    buildSlot == null ||
    money < d.c
  ) return;

  money -= d.c;

  buildings.push({
    s:buildSlot,
    t:t,
    l:1,
    last:performance.now()
  });

  closePanel();
  render();
  sync();
}

function tap(b){

  if(!sel){

    sel = b;

    return;
  }

  if(sel === b){

    sel = null;

    return;
  }

  if(
    sel.t === b.t &&
    sel.l === b.l &&
    b.l < 5
  ){

    b.l++;

    buildings =
      buildings.filter(x => x !== sel);

    sel = null;

    render();

  }else{

    sel = b;
  }
}

$('slotBtn').onclick = () => {

  const s =
    slots.find(x => !x.o);

  if(
    !s ||
    money < slotPrice
  ) return;

  money -= slotPrice;

  s.o = 1;

  slotPrice += 50;

  render();
  sync();
};

$('speedBtn').onclick = () => {

  speed =
    speed === 1 ? 2 :
    speed === 2 ? 3 :
    1;

  $('speedBtn').textContent =
    '⏩ x' + speed;
};

$('waveBtn').onclick = () => {

  if(active) return;

  wave++;

  active = true;

  spawnLeft =
    5 + wave * 2;

  const now =
    performance.now();

  buildings.forEach(
    b => b.last = now
  );

  $('waveBtn').disabled = true;

  sync();
};

function spawnEnemy(){

  const e = {

    x:25 + Math.random()*50,

    y:7,

    hp:30 + wave*10,

    max:30 + wave*10,

    v:.0062 + wave*.00022,

    last:0,

    engageX:
      42 + Math.random()*16,

    el:
      document.createElement('div')
  };

  e.el.className = 'enemy';

  e.el.innerHTML =
    '👹<div class="hp"><i></i></div>';

  G.appendChild(e.el);

  enemies.push(e);
}

function spawnUnit(b){

  const s = slots[b.s];

  const u = {

    x:
      s.x +
      (Math.random()-.5)*3,

    y:s.y-3,

    d:
      D[b.t].d *
      b.l *
      dmgMul,

    t:b.t,

    last:0,

    hp:
      24 + 8*b.l,

    wander:
      (Math.random()-.5)*.003,

    el:
      document.createElement('div')
  };

  u.el.className = 'unit';

  u.el.textContent =
    b.t === 'barracks'
    ? '🛡️⚔️'
    : '🏹';

  G.appendChild(u.el);

  units.push(u);
}

function shoot(x,y,e,d,kind){

  if(!e) return;

  const p = {

    x:x,
    y:y,
    e:e,
    d:d,
    kind:kind,

    el:
      document.createElement('div')
  };

  p.el.className = 'proj';

  p.el.textContent =
    kind === 'arrow'
    ? '➶'
    : kind === 'magic'
    ? '✦'
    : '●';

  G.appendChild(p.el);

  projectiles.push(p);
}

function dist(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function near(x,y){

  let z = null;
  let bd = Infinity;

  for(const e of enemies){

    const d =
      (e.x-x)**2 +
      (e.y-y)**2;

    if(d < bd){

      bd = d;

      z = e;
    }
  }

  return z;
}

function hit(e,d){

  if(!e || !enemies.includes(e))
    return;

  e.hp -= d;

  if(e.hp <= 0){

    money +=
      8 + wave*2;

    e.el.remove();

    enemies =
      enemies.filter(x => x !== e);

    sync();
  }
}

function loop(t){

  const dt =
    Math.min(
      40,
      t-lastT
    ) * speed;

  lastT = t;

  /* DÜŞMAN ÜRET */

  if(
    active &&
    spawnLeft > 0 &&
    t-lastSpawn > 650/speed
  ){

    spawnEnemy();

    spawnLeft--;

    lastSpawn = t;
  }

  /* DÜŞMAN AI */

  for(const e of [...enemies]){

    let defender = null;
    let bd = Infinity;

    for(const u of units){

      const dd =
        dist(e,u);

      if(dd < bd){

        bd = dd;
        defender = u;
      }
    }

    if(units.length){

      const front =
        units.reduce(
          (p,u) =>
            !p || u.y < p.y
            ? u
            : p,
          null
        );

      const target =
        bd < 10
        ? defender
        : front;

      const tx =
        bd < 10
        ? target.x
        : e.engageX;

      const ty =
        target.y - 2.8;

      const dx =
        tx-e.x;

      const dy =
        ty-e.y;

      const di =
        Math.hypot(dx,dy) || 1;

      if(
        bd <= 3.8 &&
        defender
      ){

        if(
          t-e.last >
          900/rateMul
        ){

          e.last = t;

          defender.hp =
            (defender.hp || 24) -
            (4 + wave*.6);

          defender.el
            .classList
            .add('slash');

          setTimeout(() => {

            if(
              defender &&
              defender.el
            ){

              defender.el
                .classList
                .remove('slash');
            }

          },180);

          if(defender.hp <= 0){

            defender.el.remove();

            units =
              units.filter(
                x => x !== defender
              );
          }
        }

      }else{

        e.x +=
          dx/di *
          e.v *
          dt;

        e.y +=
          dy/di *
          e.v *
          dt;
      }

    }else{

      const dx =
        e.engageX-e.x;

      e.x +=
        Math.sign(dx) *
        Math.min(
          Math.abs(dx),
          e.v*dt*.45
        );

      e.y +=
        e.v*dt;
    }

    e.x =
      Math.max(
        18,
        Math.min(82,e.x)
      );

    if(
      e.y >= 54 &&
      units.length === 0
    ){

      wall -= 35;

      e.el.remove();

      enemies =
        enemies.filter(
          x => x !== e
        );

      sync();

      if(wall <= 0){

        active = false;

        $('waveBtn').disabled = true;

        setTimeout(() => {
          alert(
            'Sur yıkıldı! Sayfayı yenileyerek tekrar başlayabilirsin.'
          );
        },100);
      }

    }else{

      e.el.style.left =
        e.x + '%';

      e.el.style.top =
        e.y + '%';

      const hp =
        e.el.querySelector('.hp i');

      if(hp){

        hp.style.width =
          Math.max(
            0,
            100*e.hp/e.max
          ) + '%';
      }
    }
  }

  /* YAPILAR */

  if(active){

    for(const b of buildings){

      const d =
        D[b.t];

      const rate =
        d.r /
        (1+(b.l-1)*.22) /
        rateMul;

      const se =
        document.querySelector(
          `.slot[data-slot="${b.s}"]`
        );

      if(
        se &&
        !d.def
      ){

        const bar =
          se.querySelector(
            '.prod i'
          );

        if(bar){

          bar.style.width =
            Math.min(
              100,
              Math.max(
                0,
                (t-b.last) /
                (rate/speed) *
                100
              )
            ) + '%';
        }
      }

      if(
        t-b.last >
        rate/speed
      ){

        b.last = t;

        if(d.def){

          const s =
            slots[b.s];

          const e =
            near(s.x,s.y);

          if(
            e &&
            Math.hypot(
              e.x-s.x,
              e.y-s.y
            ) < 45
          ){

            shoot(
              s.x,
              s.y,
              e,
              d.d *
              b.l *
              dmgMul,
              b.t === 'tower'
              ? 'arrow'
              : b.t === 'mage'
              ? 'magic'
              : 'stone'
            );
          }

        }else{

          spawnUnit(b);
        }
      }
    }
  }

  /* ASKER AI */

  for(const u of [...units]){

    const e =
      near(u.x,u.y);

    if(!e){

      u.el.style.left =
        u.x+'%';

      u.el.style.top =
        u.y+'%';

      continue;
    }

    const dx =
      e.x-u.x;

    const dy =
      e.y-u.y;

    const di =
      Math.hypot(dx,dy) || 1;

    if(
      u.t === 'barracks'
    ){

      if(di < 3.2){

        if(
          t-u.last >
          650/rateMul
        ){

          u.last = t;

          u.el.classList
            .remove('slash');

          void u.el.offsetWidth;

          u.el.classList
            .add('slash');

          hit(e,u.d);
        }

      }else{

        u.x +=
          dx/di *
          .0105 *
          dt +
          u.wander*dt;

        u.y +=
          dy/di *
          .0105 *
          dt;
      }

    }else{

      const range = 25;

      if(di > range){

        u.x +=
          dx/di *
          .0075 *
          dt +
          u.wander*dt;

        u.y +=
          dy/di *
          .0075 *
          dt;

      }else if(
        di < range-7
      ){

        u.x -=
          dx/di *
          .005 *
          dt;

        u.y -=
          dy/di *
          .005 *
          dt;

      }else if(
        t-u.last >
        900/rateMul
      ){

        u.last = t;

        shoot(
          u.x,
          u.y,
          e,
          u.d,
          'arrow'
        );
      }
    }

    u.el.style.left =
      u.x+'%';

    u.el.style.top =
      u.y+'%';
  }

  /* MERMİLER */

  for(
    const p of [...projectiles]
  ){

    if(
      !p.e ||
      !enemies.includes(p.e)
    ){

      p.el.remove();

      projectiles =
        projectiles.filter(
          x => x !== p
        );

      continue;
    }

    const dx =
      p.e.x-p.x;

    const dy =
      p.e.y-p.y;

    const di =
      Math.hypot(dx,dy) || 1;

    if(di < 2){

      hit(p.e,p.d);

      p.el.remove();

      projectiles =
        projectiles.filter(
          x => x !== p
        );

    }else{

      const v =
        p.kind === 'stone'
        ? .020
        : .032;

      p.x +=
        dx/di*v*dt;

      p.y +=
        dy/di*v*dt;

      p.el.style.left =
        p.x+'%';

      p.el.style.top =
        p.y+'%';
    }
  }

  /* DALGA BİTİŞ */

  if(
    active &&
    spawnLeft === 0 &&
    enemies.length === 0
  ){

    active = false;

    document
      .querySelectorAll('.prod i')
      .forEach(
        x => x.style.width='0%'
      );

    for(const u of units)
      u.el.remove();

    units = [];

    for(const p of projectiles)
      p.el.remove();

    projectiles = [];

    $('waveBtn').disabled = false;

    $('upgrade').style.display =
      'block';
  }

  requestAnimationFrame(loop);
}

function upgrade(k){

  if(k === 'dmg')
    dmgMul *= 1.2;

  if(k === 'rate')
    rateMul *= 1.15;

  if(k === 'wall')
    wall =
      Math.min(
        1500,
        wall+100
      );

  if(k === 'coin')
    money += 100;

  $('upgrade').style.display =
    'none';

  sync();
}

render();
sync();
requestAnimationFrame(loop);
</script>

</div>
</body>
</html>
