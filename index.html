<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sur Savunması V13.3</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101713;
  font-family:Arial,Helvetica,sans-serif;
  user-select:none;
}
#game{
  position:relative;
  width:min(100vw,560px);
  height:100dvh;
  margin:auto;
  overflow:hidden;
  touch-action:none;
  background:#79add0;
}

/* =========================
   GÖKYÜZÜ
========================= */
#sky{
  position:absolute;
  inset:0 0 72% 0;
  background:
    radial-gradient(circle at 80% 22%,#fff6c6 0 4%,#ffe899 5%,transparent 13%),
    linear-gradient(#66a5d0,#b5d3d3);
}
.cloud{
  position:absolute;
  height:15px;
  width:80px;
  border-radius:30px;
  background:#ffffffa8;
}
.cloud:before,.cloud:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:#ffffffa8;
}
.cloud:before{
  width:34px;height:34px;left:12px;top:-17px;
}
.cloud:after{
  width:43px;height:43px;right:8px;top:-23px;
}
.cloud1{left:6%;top:8%;transform:scale(.7)}
.cloud2{right:8%;top:14%;transform:scale(.48)}
.cloud3{left:42%;top:5%;transform:scale(.4)}

#mountains{
  position:absolute;
  z-index:1;
  left:0;right:0;
  top:13%;
  height:17%;
  overflow:hidden;
}
.mountain{
  position:absolute;
  width:210px;
  height:210px;
  bottom:-145px;
  transform:rotate(45deg);
  background:linear-gradient(135deg,#6f8874,#425d50);
  border-radius:15px;
}
.mountain:before{
  content:"";
  position:absolute;
  width:65px;height:65px;
  left:0;top:0;
  background:#d8dfd5;
  clip-path:polygon(0 0,100% 0,0 100%);
}
.mountain:nth-child(1){left:-70px}
.mountain:nth-child(2){
  left:130px;
  transform:rotate(45deg) scale(1.2);
}
.mountain:nth-child(3){right:-80px}

/* =========================
   SAVAŞ ALANI
========================= */
#field{
  position:absolute;
  z-index:2;
  left:0;right:0;
  top:22%;
  height:43%;
  background:
    radial-gradient(circle at 8% 18%,#3f703b 0 3px,transparent 4px),
    radial-gradient(circle at 19% 60%,#477b40 0 3px,transparent 4px),
    radial-gradient(circle at 80% 35%,#426e3b 0 3px,transparent 4px),
    linear-gradient(#729c55,#64894b 60%,#617f48);
}
#battleRoad{
  position:absolute;
  z-index:3;
  left:28%;
  width:44%;
  top:22%;
  height:44%;
  clip-path:polygon(43% 0,57% 0,91% 100%,9% 100%);
  background:
    radial-gradient(circle at 35% 22%,#756249 0 2px,transparent 3px),
    radial-gradient(circle at 62% 43%,#79664b 0 2px,transparent 3px),
    linear-gradient(90deg,#75664d,#a99268 25%,#bca778 50%,#a99268 75%,#75664d);
}

.grass{
  position:absolute;
  z-index:4;
  width:2px;height:12px;
  background:#315f32;
}
.g1{left:7%;top:31%;transform:rotate(-20deg)}
.g2{left:14%;top:45%;transform:rotate(15deg)}
.g3{right:9%;top:35%;transform:rotate(20deg)}
.g4{right:16%;top:51%;transform:rotate(-13deg)}

.rock{
  position:absolute;
  z-index:4;
  width:17px;height:10px;
  border-radius:55%;
  background:linear-gradient(#85887d,#555b54);
  box-shadow:3px 4px 3px #0003;
}
.r1{left:10%;top:38%}
.r2{right:11%;top:43%;transform:scale(.7)}

/* =========================
   SUR
========================= */
#wallShadow{
  position:absolute;
  z-index:20;
  left:-3%;
  width:106%;
  top:64%;
  height:30px;
  border-radius:50%;
  background:#0005;
  filter:blur(9px);
}
#wall{
  position:absolute;
  z-index:30;
  left:-2%;
  width:104%;
  top:61%;
  height:92px;
  border-top:6px solid #595b57;
  border-bottom:9px solid #494b48;
  background:
    linear-gradient(90deg,
      transparent 0 9%,#6e706b 9.5% 10%,
      transparent 10.5% 23%,#72746f 23.5% 24%,
      transparent 24.5% 38%,#737570 38.5% 39%,
      transparent 39.5% 56%,#747670 56.5% 57%,
      transparent 57.5% 74%,#70726d 74.5% 75%,
      transparent 75.5% 90%,#70726c 90.5% 91%,
      transparent 91.5%),
    repeating-linear-gradient(0deg,transparent 0 22px,#72746f 22px 25px),
    repeating-linear-gradient(90deg,#aaa99f 0 37px,#858781 37px 40px,#b6b4aa 40px 78px);
  box-shadow:
    inset 0 6px #d0cec2,
    inset 0 -9px #666863,
    0 11px 15px #0006;
}
#wall:before{
  content:"";
  position:absolute;
  left:0;right:0;
  height:25px;
  top:-23px;
  background:
    repeating-linear-gradient(
      90deg,
      #aaa99f 0 24px,
      #aaa99f 24px 26px,
      transparent 26px 39px
    );
}

#gateFrame{
  position:absolute;
  z-index:5;
  left:50%;
  bottom:-7px;
  transform:translateX(-50%);
  width:31%;
  height:92px;
  border:9px solid #50514e;
  border-bottom:0;
  border-radius:60px 60px 0 0;
}
#gate{
  position:absolute;
  inset:7px 7px 0;
  border-radius:48px 48px 0 0;
  overflow:hidden;
  background:
    repeating-linear-gradient(90deg,#775036 0 10px,#4d3224 10px 13px);
}
#gate:before,#gate:after{
  content:"";
  position:absolute;
  left:0;right:0;
  height:7px;
  background:#343a3c;
}
#gate:before{top:31px}
#gate:after{top:61px}

/* =========================
   SUR KULELERİ
========================= */
.wallTower{
  position:absolute;
  z-index:40;
  bottom:-7px;
  width:72px;
  height:126px;
  border:6px solid #535652;
  background:
    repeating-linear-gradient(0deg,#9d9d95 0 23px,#777974 23px 26px);
  box-shadow:
    inset 8px 0 #ffffff13,
    inset -8px 0 #00000012,
    5px 6px 5px #0004;
}
.wallTower.left{left:1%}
.wallTower.right{right:1%}

.wallTower:before{
  content:"";
  position:absolute;
  left:-7px;
  top:-23px;
  width:74px;
  height:27px;
  background:
    repeating-linear-gradient(90deg,#a5a59d 0 15px,transparent 15px 23px);
}

.wallTower.selected{
  filter:
    drop-shadow(0 0 8px #ffe46a)
    drop-shadow(0 0 14px #ffb52d);
}

.towerTap{
  position:absolute;
  z-index:100;
  top:-45px;
  left:-8px;
  width:76px;
  height:160px;
}

.towerArchers{
  position:absolute;
  z-index:80;
  left:-2px;
  top:-40px;
  width:66px;
  height:48px;
  pointer-events:none;
}

.towerArcher{
  position:absolute;
  width:20px;
  height:36px;
  filter:drop-shadow(1px 2px 1px #0006);
}
.towerArcher:nth-child(1){left:0;top:9px}
.towerArcher:nth-child(2){left:15px;top:2px}
.towerArcher:nth-child(3){left:31px;top:2px}
.towerArcher:nth-child(4){left:46px;top:9px}

.taHead{
  position:absolute;
  z-index:5;
  left:6px;top:1px;
  width:9px;height:10px;
  border-radius:50%;
  background:#d49a71;
  border:1px solid #60412f;
}
.taHood{
  position:absolute;
  z-index:6;
  left:4px;top:-1px;
  width:13px;height:9px;
  border-radius:8px 8px 2px 2px;
  background:#425d3c;
}
.taBody{
  position:absolute;
  z-index:4;
  left:4px;top:10px;
  width:13px;height:15px;
  border-radius:4px;
  background:linear-gradient(90deg,#344c36,#66805c);
}
.taLeg{
  position:absolute;
  top:24px;
  width:4px;height:10px;
  background:#403b34;
}
.taLeg.l{left:6px}
.taLeg.r{left:12px}
.taBow{
  position:absolute;
  z-index:7;
  right:-3px;
  top:8px;
  width:10px;
  height:20px;
  border-right:2px solid #724b29;
  border-radius:0 100% 100% 0;
}
.taBow:after{
  content:"";
  position:absolute;
  right:6px;
  top:1px;
  width:1px;
  height:18px;
  background:#eee;
}
.towerArcher.fire .taBow{
  animation:towerBowFire .22s;
}
@keyframes towerBowFire{
  50%{transform:scaleX(.45)}
}

.towerCount{
  position:absolute;
  z-index:90;
  left:50%;
  top:14px;
  transform:translateX(-50%);
  min-width:34px;
  padding:3px 5px;
  border-radius:10px;
  background:#1a2b23e8;
  border:1px solid #ffffff99;
  color:white;
  text-align:center;
  font-size:9px;
  font-weight:900;
  pointer-events:none;
}

/* =========================
   AVLU
========================= */
#yard{
  position:absolute;
  z-index:2;
  left:0;right:0;
  top:68%;
  bottom:0;
  background:
    radial-gradient(circle at 11% 20%,#735a40 0 2px,transparent 3px),
    radial-gradient(circle at 88% 37%,#7b6246 0 2px,transparent 3px),
    radial-gradient(circle at 35% 68%,#816548 0 2px,transparent 3px),
    linear-gradient(#b59a69,#8d704c);
}

/* =========================
   HUD
========================= */
#hud{
  position:absolute;
  z-index:500;
  top:max(7px,env(safe-area-inset-top));
  left:7px;right:7px;
  display:flex;
  gap:5px;
}
.hudBox{
  flex:1;
  padding:8px 4px;
  text-align:center;
  border-radius:16px;
  border:2px solid #ffffff55;
  background:linear-gradient(#354e43ee,#172820ee);
  color:#fff;
  font-weight:900;
  font-size:13px;
  box-shadow:0 5px 9px #0005;
}

/* =========================
   10 BİNA ALANI
========================= */
.slot{
  position:absolute;
  z-index:100;
  width:60px;
  height:60px;
  transform:translate(-50%,-50%);
  border:2px dashed #59442e;
  border-radius:50%;
  display:grid;
  place-items:center;
  text-align:center;
  color:#473621;
  background:#efd49780;
  font-size:9px;
  font-weight:bold;
}
.slot.building{
  border:0;
  background:transparent;
}
.slot.dragging{opacity:.22}

.buildingModel{
  position:relative;
  width:60px;
  height:58px;
  filter:drop-shadow(4px 6px 3px #0005);
}
.bHouse{
  position:absolute;
  left:7px;right:7px;
  bottom:4px;
  height:34px;
  border:3px solid #4d3c2d;
  background:linear-gradient(90deg,#99704a,#c69f69,#88613f);
}
.bRoof{
  position:absolute;
  left:2px;right:2px;
  top:0;
  height:27px;
  clip-path:polygon(50% 0,100% 100%,0 100%);
  background:#914339;
  border-bottom:4px solid #54332b;
}
.archerBuilding .bRoof{background:#456f45}
.cavalryBuilding .bRoof{background:#496a84}
.artilleryBuilding .bRoof{background:#555452}

.bDoor{
  position:absolute;
  width:13px;height:18px;
  left:24px;bottom:5px;
  background:#543728;
  border-radius:8px 8px 0 0;
}
.bFlag{
  position:absolute;
  right:2px;top:15px;
  width:23px;height:23px;
  display:grid;
  place-items:center;
  border:2px solid #4d3c2d;
  border-radius:50%;
  background:#e4d09d;
}
.level{
  position:absolute;
  left:-1px;
  bottom:-4px;
  padding:2px 5px;
  border-radius:7px;
  color:#fff;
  background:#4c3476;
  font-size:8px;
}
.prod{
  position:absolute;
  left:6px;right:6px;
  bottom:-9px;
  height:5px;
  border-radius:5px;
  overflow:hidden;
  border:1px solid #fff;
  background:#1d2a23;
}
.prod i{
  display:block;
  height:100%;
  width:0;
  background:#e4bb42;
}

/* =========================
   BİRLEŞME IŞIĞI
========================= */
.slot.canMerge{z-index:115}
.slot.canMerge:before{
  content:"";
  position:absolute;
  z-index:-2;
  width:72px;height:72px;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(circle,#fffbd0cc 0%,#ffe05a88 25%,#ffb51f55 48%,transparent 72%);
  animation:mergeAura 1s ease-in-out infinite alternate;
}
.slot.canMerge:after{
  content:"";
  position:absolute;
  z-index:-1;
  width:63px;height:63px;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:2px solid #ffe875;
  box-shadow:
    0 0 7px #fff,
    0 0 13px #ffd43b,
    0 0 23px #ff9f1c;
  animation:mergeRing 1s infinite;
}
.slot.canMerge .buildingModel{
  animation:mergeGlow .85s ease-in-out infinite alternate;
}
@keyframes mergeAura{
  to{
    opacity:.45;
    transform:translate(-50%,-50%) scale(1.17);
  }
}
@keyframes mergeRing{
  to{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.35);
  }
}
@keyframes mergeGlow{
  to{
    transform:translateY(-3px) scale(1.06);
    filter:
      drop-shadow(0 0 7px #fffbd0)
      drop-shadow(0 0 15px #ffd43b)
      drop-shadow(0 0 24px #ff9f1c);
  }
}
.slot.mergeTarget .buildingModel{
  transform:scale(1.17);
  filter:
    drop-shadow(0 0 10px white)
    drop-shadow(0 0 25px #ffd32c);
}
.dragGhost{
  position:absolute;
  z-index:900;
  pointer-events:none;
  width:60px;height:60px;
  transform:translate(-50%,-50%) scale(1.15);
}

/* =========================
   SAHA ASKERLERİ
   KULE OKÇUSU BOYUNA YAKIN
========================= */
.unit{
  position:absolute;
  z-index:80;
  width:52px;
  height:70px;
  transform:
    translate(-50%,-50%)
    scale(.58);
  transform-origin:center;
  pointer-events:none;
}

.shadow{
  position:absolute;
  left:8px;
  bottom:2px;
  width:35px;
  height:8px;
  border-radius:50%;
  background:#0006;
  filter:blur(2px);
}

.soldier{
  position:absolute;
  left:6px;top:1px;
  width:42px;height:62px;
}

.sHead{
  position:absolute;
  z-index:8;
  left:14px;top:5px;
  width:15px;height:17px;
  border-radius:48%;
  border:1px solid #6d4935;
  background:linear-gradient(90deg,#a86e4c,#e0a47b);
}
.face{
  position:absolute;
  z-index:10;
  left:24px;top:11px;
  width:2px;height:2px;
  border-radius:50%;
  background:#241c18;
}
.hair{
  position:absolute;
  z-index:9;
  left:13px;top:3px;
  width:17px;height:8px;
  border-radius:10px 10px 3px 3px;
  background:#39291f;
}
.helmet{
  position:absolute;
  z-index:11;
  left:11px;top:1px;
  width:20px;height:13px;
  border:2px solid #414a4e;
  border-radius:11px 11px 3px 3px;
  background:linear-gradient(90deg,#555f64,#b6bec0,#4d575c);
}
.chest{
  position:absolute;
  z-index:6;
  left:10px;top:21px;
  width:23px;height:23px;
  border-radius:6px;
  border:1px solid #42382f;
  background:#775c44;
}
.waist{
  position:absolute;
  z-index:8;
  left:9px;top:39px;
  width:25px;height:5px;
  background:#3e2c20;
}
.arm{
  position:absolute;
  z-index:5;
  top:23px;
  width:7px;height:23px;
  border-radius:5px;
  background:#a47454;
  transform-origin:50% 2px;
}
.arm.left{left:5px}
.arm.right{right:3px}
.leg{
  position:absolute;
  z-index:4;
  top:42px;
  width:8px;height:19px;
  border-radius:4px;
  background:#393a37;
  transform-origin:50% 1px;
}
.leg.left{left:11px}
.leg.right{right:8px}

.unit.walk .soldier{
  animation:bodyWalk .28s infinite alternate;
}
.unit.walk .leg.left{animation:legA .28s infinite alternate}
.unit.walk .leg.right{animation:legB .28s infinite alternate}
.unit.walk .arm.left{animation:legB .28s infinite alternate}
.unit.walk .arm.right{animation:legA .28s infinite alternate}

@keyframes bodyWalk{to{transform:translateY(-2px)}}
@keyframes legA{from{transform:rotate(25deg)}to{transform:rotate(-25deg)}}
@keyframes legB{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}

/* PİYADE */
.warrior .chest{
  background:linear-gradient(90deg,#59656a,#a9b1b2,#505a60);
}
.sword{
  position:absolute;
  z-index:15;
  right:-5px;top:15px;
  width:5px;height:37px;
  border-radius:2px;
  background:linear-gradient(90deg,#536065,#f1f3f1,#68757a);
  border:1px solid #414a4e;
  transform:rotate(-25deg);
  transform-origin:50% 88%;
}
.shield{
  position:absolute;
  z-index:14;
  left:-6px;top:23px;
  width:22px;height:28px;
  border:3px solid #4c3829;
  border-radius:10px 10px 15px 15px;
  background:
    linear-gradient(90deg,#87352f 0 45%,#d3a53c 46% 54%,#87352f 55%);
}
.unit.melee .sword{
  animation:swordSwing .32s;
}
@keyframes swordSwing{
  0%{transform:rotate(-60deg)}
  45%{transform:rotate(95deg)}
  100%{transform:rotate(-25deg)}
}

/* OKÇU */
.archerSoldier .chest{
  background:linear-gradient(90deg,#36583b,#68825b,#314e35);
}
.bow{
  position:absolute;
  z-index:15;
  right:-10px;top:15px;
  width:22px;height:38px;
  border-right:4px solid #714b28;
  border-radius:0 100% 100% 0;
}
.bow:after{
  content:"";
  position:absolute;
  right:15px;top:1px;
  width:1px;height:35px;
  background:#eee;
}
.quiver{
  position:absolute;
  left:2px;top:18px;
  width:9px;height:29px;
  border:2px solid #49311f;
  border-radius:4px;
  background:#76502f;
  transform:rotate(18deg);
}

/* =========================
   SÜVARİ
========================= */
.cavalryUnit{
  width:96px;
  height:78px;
  transform:
    translate(-50%,-50%)
    scale(.67);
}

}

}
.horseNeck{
  position:absolute;

  width:17px;height:38px;

  border-radius:12px;

.horseHead{
  position:absolute;
  z-index:7;

  border:2px solid #4a3023;
  border-radius:12px;
  background:#8d5f3f;
}
.hLeg{
  position:absolute;
  top:36px;
  width:8px;height:25px;
  border-radius:5px;
  background:#795037;
  transform-origin:50% 1px;
}
.hl1{left:20px}
.hl2{left:34px}
.hl3{right:26px}
.hl4{right:12px}

.saddle{
  position:absolute;
  z-index:8;
  left:34px;top:8px;
  width:29px;height:15px;
  border-radius:9px;
  background:#6c4931;
}
.rider{
  position:absolute;
  z-index:15;
  left:40px;top:-11px;
  width:39px;height:44px;
  transform:scale(.82);
  transform-origin:center bottom;
}
.rider .sHead{left:11px}
.rider .helmet{left:8px}
.rider .hair{left:10px}
.rider .chest{
  left:7px;top:21px;
  width:24px;height:21px;
  background:#7b8588;
}
.lance{
  position:absolute;
  z-index:18;
  left:53px;top:-4px;
  width:5px;height:70px;
  background:#795032;
  transform:rotate(69deg);
  transform-origin:50% 80%;
}

.cavalryUnit.walk .horse{
  animation:horseBob .2s infinite alternate;
}
.cavalryUnit.walk .hl1,
.cavalryUnit.walk .hl3{
  animation:horseLeg1 .2s infinite alternate;
}
.cavalryUnit.walk .hl2,
.cavalryUnit.walk .hl4{
  animation:horseLeg2 .2s infinite alternate;
}

<script>
const game=document.getElementById("game");
const $=id=>document.getElementById(id);

let money=400;
let wallHP=1000;
let wave=0;

let waveActive=false;
let gameSpeed=1;

let damageBonus=1;
let productionBonus=1;

let buildings=[];
let units=[];
let enemies=[];
let projectiles=[];

let buildSlot=null;
let drag=null;

let enemiesToSpawn=0;

let realLastFrame=performance.now();
let gameTime=0;
let lastSpawnGameTime=0;

/* =========================
   KULELER
========================= */

const TOWER_ARCHER_COST=60;
const TOWER_CAPACITY=4;
const TOWER_RANGE=52;
const TOWER_ATTACK_RATE=1050;
const TOWER_BASE_DAMAGE=12;

const towers={

  left:{
    side:"left",
    count:0,
    x:8,
    y:56.5,
    lastAttacks:[0,0,0,0]
  },

  right:{
    side:"right",
    count:0,
    x:92,
    y:56.5,
    lastAttacks:[0,0,0,0]
  }

};

let selectedTower=null;

/* =========================
   10 BİNA ALANI
========================= */

const slots=[

  {x:10,y:74},
  {x:30,y:74},
  {x:50,y:74},
  {x:70,y:74},
  {x:90,y:74},

  {x:10,y:87},
  {x:30,y:87},
  {x:50,y:87},
  {x:70,y:87},
  {x:90,y:87}

];

const BUILDINGS={

  barracks:{
    name:"Kışla",
    icon:"⚔",
    cost:75,
    rate:2700
  },

  archer:{
    name:"Okçu Ocağı",
    icon:"➶",
    cost:90,
    rate:3600
  },

  cavalry:{
    name:"Süvari Kışlası",
    icon:"♞",
    cost:130,
    rate:4500
  },

  artillery:{
    name:"Topçu Kışlası",
    icon:"●",
    cost:150,
    rate:5400
  }

};

const MONSTERS=[

  {type:"goblin",name:"Goblin",unlock:1,hp:.65,speed:1.25,damage:3,wall:18,reward:4},

  {type:"orc",name:"Ork",unlock:2,hp:.95,speed:1,damage:4,wall:25,reward:6},

  {type:"wolf",name:"Kurt Yaratık",unlock:3,hp:.72,speed:1.55,damage:4,wall:22,reward:7},

  {type:"raider",name:"Yağmacı",unlock:4,hp:1.15,speed:1.12,damage:5,wall:30,reward:8},

  {type:"armored",name:"Zırhlı Ork",unlock:5,hp:1.65,speed:.82,damage:7,wall:40,reward:11},

  {type:"brute",name:"Vahşi",unlock:6,hp:2,speed:.75,damage:8,wall:48,reward:14},

  {type:"ogre",name:"Ogre",unlock:7,hp:2.6,speed:.62,damage:10,wall:60,reward:18},

  {type:"warlord",name:"Savaş Lordu",unlock:8,hp:3.1,speed:.68,damage:12,wall:70,reward:22},

  {type:"demon",name:"İblis",unlock:9,hp:3.7,speed:.72,damage:13,wall:80,reward:27},

  {type:"boss",name:"Kadim Muhafız",unlock:10,hp:5,speed:.58,damage:17,wall:100,reward:40}

];

/* =========================
   UI
========================= */

function showNotice(text){

  const notice=$("notice");

  notice.textContent=text;

  notice.classList.add("show");

  clearTimeout(showNotice.timer);

  showNotice.timer=setTimeout(()=>{
    notice.classList.remove("show");
  },1500);

}

function sync(){

  $("money").textContent=Math.floor(money);

  $("wallHP").textContent=
    Math.max(0,Math.floor(wallHP));

  $("wave").textContent=wave;

  renderBuildChoices();

  renderTowerArchers();

}

/* =========================
   KULE PANELİ
========================= */

document
.querySelectorAll(".towerTap")
.forEach(tap=>{

  tap.addEventListener(
    "pointerup",
    ()=>openTowerPanel(
      tap.dataset.tower
    )
  );

});

function openTowerPanel(side){

  selectedTower=side;

  $("leftTower").classList.toggle(
    "selected",
    side==="left"
  );

  $("rightTower").classList.toggle(
    "selected",
    side==="right"
  );

  $("towerTitle").textContent=
    side==="left"
      ?"🏹 Sol Sur Kulesi"
      :"🏹 Sağ Sur Kulesi";

  $("buildPanel").style.display="none";

  $("towerPanel").style.display="block";

  updateTowerPanel();

}

function updateTowerPanel(){

  if(!selectedTower)return;

  const tower=
    towers[selectedTower];

  $("towerCurrent").textContent=
    tower.count;

  const button=
    $("towerAdd");

  if(tower.count>=TOWER_CAPACITY){

    button.textContent=
      "✓ Kule Dolu — 4/4";

    button.disabled=true;

  }else{

    button.textContent=
      "🏹 Okçu Yerleştir — "+
      TOWER_ARCHER_COST+
      " 🪙";

    button.disabled=
      money<TOWER_ARCHER_COST;

  }

}

$("towerAdd").onclick=()=>{

  if(!selectedTower)return;

  const tower=
    towers[selectedTower];

  if(
    tower.count>=
    TOWER_CAPACITY
  )return;

  if(
    money<
    TOWER_ARCHER_COST
  ){

    showNotice(
      "Yeterli altın yok."
    );

    return;

  }

  money-=
    TOWER_ARCHER_COST;

  tower.count++;

  tower.lastAttacks[
    tower.count-1
  ]=gameTime-2000;

  sync();

  updateTowerPanel();

  showNotice(
    (selectedTower==="left"
      ?"Sol"
      :"Sağ")+
    " kule: "+
    tower.count+
    "/4"
  );

};

$("closeTower").onclick=()=>{

  selectedTower=null;

  $("towerPanel").style.display=
    "none";

  $("leftTower").classList.remove(
    "selected"
  );

  $("rightTower").classList.remove(
    "selected"
  );

};

function towerArcherHTML(index){

  return `
    <div
      class="towerArcher"
      data-archer="${index}"
    >
      <i class="taLeg l"></i>
      <i class="taLeg r"></i>
      <i class="taBody"></i>
      <i class="taHead"></i>
      <i class="taHood"></i>
      <i class="taBow"></i>
    </div>
  `;

}

function renderTowerArchers(){

  ["left","right"].forEach(side=>{

    const tower=
      towers[side];

    const box=
      $(side+"Archers");

    box.innerHTML="";

    for(
      let i=0;
      i<tower.count;
      i++
    ){

      box.insertAdjacentHTML(
        "beforeend",
        towerArcherHTML(i)
      );

    }

    $(side+"Count").textContent=
      tower.count+"/4";

  });

  updateTowerPanel();

}

/* =========================
   BİNALAR
========================= */

function renderBuildChoices(){

  const box=
    $("buildChoices");

  box.innerHTML="";

  Object.entries(BUILDINGS)
  .forEach(([type,data])=>{

    const button=
      document.createElement(
        "button"
      );

    button.innerHTML=
      data.icon+
      " "+
      data.name+
      "<br>"+
      data.cost+
      " 🪙";

    button.disabled=
      money<data.cost;

    button.onclick=
      ()=>build(type);

    box.appendChild(button);

  });

}

function buildingHTML(building){

  const extra=
    building.type==="archer"
      ?"archerBuilding"
    :building.type==="cavalry"
      ?"cavalryBuilding"
    :building.type==="artillery"
      ?"artilleryBuilding"
      :"";

  return `
    <div class="buildingModel ${extra}">
      <i class="bHouse"></i>
      <i class="bRoof"></i>
      <i class="bDoor"></i>
      <i class="bFlag">
        ${BUILDINGS[building.type].icon}
      </i>
    </div>

    <span class="level">
      Lv.${building.level}
    </span>

    <span class="prod">
      <i></i>
    </span>
  `;

}

function updateMergeLights(){

  document
  .querySelectorAll(".slot")
  .forEach(element=>{

    element.classList.remove(
      "canMerge"
    );

  });

  buildings.forEach(building=>{

    if(building.level>=5)return;

    const partner=
      buildings.find(other=>

        other!==building &&

        other.type===
        building.type &&

        other.level===
        building.level

      );

    if(partner){

      document
      .querySelector(
        `.slot[data-slot="${building.slot}"]`
      )
      ?.classList.add(
        "canMerge"
      );

    }

  });

}

function renderSlots(){

  document
  .querySelectorAll(".slot")
  .forEach(
    element=>element.remove()
  );

  slots.forEach(
    (slot,index)=>{

      const element=
        document.createElement(
          "div"
        );

      element.className="slot";

      element.dataset.slot=index;

      element.style.left=
        slot.x+"%";

      element.style.top=
        slot.y+"%";

      const building=
        buildings.find(
          b=>b.slot===index
        );

      if(building){

        element.classList.add(
          "building"
        );

        element.innerHTML=
          buildingHTML(building);

        element.addEventListener(
          "pointerdown",
          event=>{
            startBuildingDrag(
              event,
              building,
              element
            );
          }
        );

      }else{

        element.innerHTML=
          "＋<br>YAPI";

        element.addEventListener(
          "pointerup",
          ()=>{

            if(drag)return;

            buildSlot=index;

            $("towerPanel")
              .style.display="none";

            $("buildPanel")
              .style.display="block";

            renderBuildChoices();

          }
        );

      }

      game.appendChild(element);

    }
  );

  updateMergeLights();

}

function build(type){

  if(buildSlot===null)return;

  const data=
    BUILDINGS[type];

  if(money<data.cost)return;

  money-=data.cost;

  buildings.push({

    slot:buildSlot,

    type,

    level:1,

    lastProduction:
      gameTime

  });

  buildSlot=null;

  $("buildPanel").style.display=
    "none";

  renderSlots();

  sync();

}

$("closeBuild").onclick=()=>{

  buildSlot=null;

  $("buildPanel").style.display=
    "none";

};

/* =========================
   SÜRÜKLE / BİRLEŞTİR
========================= */

function startBuildingDrag(
  event,
  building,
  source
){

  event.preventDefault();

  drag={

    building,

    source,

    startX:event.clientX,

    startY:event.clientY,

    moved:false,

    ghost:null

  };

  source.setPointerCapture?.(
    event.pointerId
  );

  source.addEventListener(
    "pointermove",
    moveBuilding
  );

  source.addEventListener(
    "pointerup",
    dropBuilding
  );

  source.addEventListener(
    "pointercancel",
    dropBuilding
  );

}

function moveBuilding(event){

  if(!drag)return;

  const movement=
    Math.hypot(

      event.clientX-
      drag.startX,

      event.clientY-
      drag.startY

    );

  if(
    !drag.moved &&
    movement<7
  )return;

  if(!drag.moved){

    drag.moved=true;

    drag.source.classList.add(
      "dragging"
    );

    const ghost=
      document.createElement(
        "div"
      );

    ghost.className=
      "dragGhost";

    ghost.innerHTML=
      buildingHTML(
        drag.building
      );

    game.appendChild(ghost);

    drag.ghost=ghost;

  }

  const rect=
    game.getBoundingClientRect();

  drag.ghost.style.left=
    event.clientX-
    rect.left+
    "px";

  drag.ghost.style.top=
    event.clientY-
    rect.top+
    "px";

  document
  .querySelectorAll(".slot")
  .forEach(element=>{

    element.classList.remove(
      "mergeTarget"
    );

  });

  const target=
    findMergeTarget(

      event.clientX,

      event.clientY,

      drag.building

    );

  if(target!==null){

    document
    .querySelector(
      `.slot[data-slot="${target}"]`
    )
    ?.classList.add(
      "mergeTarget"
    );

  }

}

function findMergeTarget(
  x,
  y,
  source
){

  let target=null;

  let best=58;

  document
  .querySelectorAll(
    ".slot.building"
  )
  .forEach(element=>{

    const slot=
      Number(
        element.dataset.slot
      );

    if(
      slot===
      source.slot
    )return;

    const other=
      buildings.find(
        b=>b.slot===slot
      );

    if(
      !other ||

      other.type!==
      source.type ||

      other.level!==
      source.level ||

      other.level>=5
    )return;

    const rect=
      element
      .getBoundingClientRect();

    const distance=
      Math.hypot(

        x-
        (
          rect.left+
          rect.width/2
        ),

        y-
        (
          rect.top+
          rect.height/2
        )

      );

    if(distance<best){

      best=distance;

      target=slot;

    }

  });

  return target;

}

function dropBuilding(event){

  if(!drag)return;

  const old=drag;

  old.source.removeEventListener(
    "pointermove",
    moveBuilding
  );

  old.source.removeEventListener(
    "pointerup",
    dropBuilding
  );

  old.source.removeEventListener(
    "pointercancel",
    dropBuilding
  );

  if(old.moved){

    const targetSlot=
      findMergeTarget(

        event.clientX,

        event.clientY,

        old.building

      );

    if(targetSlot!==null){

      const target=
        buildings.find(
          b=>
          b.slot===
          targetSlot
        );

      if(
        target &&

        target.type===
        old.building.type &&

        target.level===
        old.building.level &&

        target.level<5
      ){

        target.level++;

        target.lastProduction=
          gameTime;

        buildings=
          buildings.filter(
            b=>
            b!==old.building
          );

        showNotice(
          BUILDINGS[
            target.type
          ].name+
          " → Lv."+
          target.level
        );

      }

    }

  }

  old.ghost?.remove();

  drag=null;

  renderSlots();

  sync();

}

/* =========================

========================= */

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}

function nearestEnemy(unit){

  let target=null;

  let best=Infinity;

  enemies.forEach(enemy=>{

    const d=
      distance(
        unit,
        enemy
      );

    if(d<best){

      best=d;

      target=enemy;

    }

  });

  return target;

}

function nearestDefender(enemy){

  let target=null;

  let best=Infinity;

  units.forEach(unit=>{

    const d=
      distance(
        enemy,
        unit
      );

    if(d<best){

      best=d;

      target=unit;

    }

  });

  return target;

}

function nearestTowerTarget(
  tower
){

  let target=null;

  let best=Infinity;

  enemies.forEach(enemy=>{

    const d=
      Math.hypot(

        enemy.x-
        tower.x,

        enemy.y-
        tower.y

      );

    if(
      d<=TOWER_RANGE &&
      d<best
    ){

      best=d;

      target=enemy;

    }

  });

  return target;

}

function fireTowerArrow(
  tower,
  index,
  target
){

  const projectile={

    x:tower.x,

    y:tower.y-2.5,

    target,

    type:"towerArrow",

    damage:
      (
        TOWER_BASE_DAMAGE+
        wave*.45
      )*
      damageBonus,

    element:
      document.createElement(
        "div"
      )

  };

  projectile.element.className=
    "projectile towerArrow";

  game.appendChild(
    projectile.element
  );

  projectiles.push(
    projectile
  );

  const archer=
    $(tower.side+"Archers")
    .querySelector(
      `[data-archer="${index}"]`
    );

  if(archer){

    archer.classList.remove(
      "fire"
    );

    void archer.offsetWidth;

    archer.classList.add(
      "fire"
    );

  }

}

function updateTowerArchers(){

  if(
    !waveActive ||
    enemies.length===0
  )return;

  ["left","right"]
  .forEach(side=>{

    const tower=
      towers[side];

    for(
      let i=0;
      i<tower.count;
      i++
    ){

      if(
        gameTime-
        tower.lastAttacks[i]<
        TOWER_ATTACK_RATE
      )continue;

      const target=
        nearestTowerTarget(
          tower
        );

      if(target){

        tower.lastAttacks[i]=
          gameTime;

        fireTowerArrow(
          tower,
          i,
          target
        );

      }

    }

  });

}

function updateBuildings(){

      const productionTime=

        data.rate/

      const slot=

          `.slot[data-slot="${building.slot}"]`
        );

        );

      const progress=

      if(bar){

        bar.style.width=
          Math.min(
            100,
            progress/
            productionTime*
            100
          )+
          "%";

      }

      if(
        progress>=
        productionTime
      ){

        building.lastProduction=
          gameTime;

        spawnUnit(
          building
        );

      }

    }
  );

}

   ASKER AI
========================= */

function moveUnit(
  unit,
  dx,
  dy,
  d,
  amount,
  dt
){

  unit.x+=
    dx/d*
    amount*
    dt;

  unit.y+=
    dy/d*
    amount*
    dt;

  unit.element
    .classList.add(
      "walk"
    );

}

function drawUnit(unit){

  unit.element.style.left=
    unit.x+"%";

  unit.element.style.top=
    unit.y+"%";

}

function updateUnits(dt){

  for(
    const unit
    of [...units]
  ){

    const enemy=
      nearestEnemy(unit);

    if(!enemy){

      const dx=
        50-unit.x;

      const dy=
        unit.preferredY-
        unit.y;

      const d=
        Math.hypot(
          dx,
          dy
        )||1;

      if(d>2){

        moveUnit(
          unit,
          dx,
          dy,
          d,
          unit.speed*.45,
          dt
        );

      }else{

        unit.element
          .classList.remove(
            "walk"
          );

      }

      drawUnit(unit);

      continue;

    }

    const dx=
      enemy.x-
      unit.x;

    const dy=
      enemy.y-
      unit.y;

    const d=
      Math.hypot(
        dx,
        dy
      )||1;

    if(
      unit.type===
      "barracks"
    ){

      if(
        d>
        unit.range
      ){

        moveUnit(
          unit,
          dx,
          dy,
          d,
          unit.speed,
          dt
        );

      }else{

        unit.element
          .classList.remove(
            "walk"
          );

        if(
          gameTime-
          unit.lastAttack>=
          unit.attackRate
        ){

          unit.lastAttack=
            gameTime;

          unit.element
            .classList.remove(
              "melee"
            );

          void unit.element.offsetWidth;

          unit.element
            .classList.add(
              "melee"
            );

          damageEnemy(
            enemy,
            unit.damage
          );

        }

      }

    }

    else if(
      unit.type===
      "archer"
    ){

      if(
        d>
        unit.range
      ){

        moveUnit(
          unit,
          dx,
          dy,
          d,
          unit.speed,
          dt
        );

      }

      else if(d<11){

        moveUnit(
          unit,
          -dx,
          -dy,
          d,
          unit.speed*.55,
          dt
        );

      }

      else if(
        gameTime-
        unit.lastAttack>=
        unit.attackRate
      ){

        unit.lastAttack=
          gameTime;

        fireProjectile(
          unit,
          enemy,
          "arrow"
        );

      }

    }

    else if(
      unit.type===
      "cavalry"
    ){

      if(
        d>
        unit.range
      ){

        moveUnit(
          unit,
          dx,
          dy,
          d,
          unit.speed,
          dt
        );

      }else if(
        gameTime-
        unit.lastAttack>=
        unit.attackRate
      ){

        unit.lastAttack=
          gameTime;

        let damage=
          unit.damage;

        if(unit.charged){

          damage*=1.8;

          unit.charged=false;

        }

        damageEnemy(
          enemy,
          damage
        );

      }

    }

    else if(
      unit.type===
      "artillery"
    ){

      if(
        d>
        unit.range
      ){

        moveUnit(
          unit,
          dx,
          dy,
          d,
          unit.speed,
          dt
        );

      }

      else if(d<14){

        moveUnit(
          unit,
          -dx,
          -dy,
          d,
          unit.speed*.7,
          dt
        );

      }

      else if(
        gameTime-
        unit.lastAttack>=
        unit.attackRate
      ){

        unit.lastAttack=
          gameTime;

        fireProjectile(
          unit,
          enemy,
          "cannon"
        );

      }

    }

    unit.x=
      Math.max(
        6,
        Math.min(
          94,
          unit.x
        )
      );

    unit.y=
      Math.max(
        25,
        Math.min(
          62,
          unit.y
        )
      );

    drawUnit(unit);

  }

}

function updateEnemies(dt){

  for(
    const enemy
    of [...enemies]
  ){

    if(units.length>0){

      const defender=
        nearestDefender(
          enemy
        );

      if(defender){

        const dx=
          defender.x-
          enemy.x;

        const dy=
          defender.y-
          enemy.y;

        const d=
          Math.hypot(
            dx,
            dy
          )||1;

        if(d>3.7){

          enemy.x+=
            dx/d*
            enemy.speed*
            dt;

          enemy.y+=
            dy/d*
            enemy.speed*
            dt;

        }

        else if(
          gameTime-
          enemy.lastAttack>=
          850
        ){

          enemy.lastAttack=
            gameTime;

          damageUnit(
            defender,
            enemy.damage
          );

        }

      }

    }else{

      const dx=
        50-
        enemy.x;

      const dy=
        61-
        enemy.y;

      const d=
        Math.hypot(
          dx,
          dy
        )||1;

      enemy.x+=
        dx/d*
        enemy.speed*
        dt;

      enemy.y+=
        dy/d*
        enemy.speed*
        dt;

      if(d<1.6){

        wallHP-=
          enemy.wallDamage;

        enemy.element.remove();

        enemies=
          enemies.filter(
            e=>e!==enemy
          );

        if(wallHP<=0){

          wallHP=0;

          waveActive=false;

          $("waveButton").disabled=
            true;

          showNotice(
            "SUR YIKILDI!"
          );

        }

        sync();

        continue;

      }

    }

    enemy.element.style.left=
      enemy.x+"%";

    enemy.element.style.top=
      enemy.y+"%";

    const hp=
      enemy.element
      .querySelector(
        ".hpbar i"
      );

    if(hp){

      hp.style.width=
        Math.max(
          0,
          enemy.hp/
          enemy.maxHP*
          100
        )+
        "%";

    }

  }

}

/* =========================
   MERMİ HAREKETİ
========================= */

function updateProjectiles(dt){

  for(
    const projectile
    of [...projectiles]
  ){

    if(
      !projectile.target ||
      !enemies.includes(
        projectile.target
      )
    ){

      projectile.element.remove();

      projectiles=
        projectiles.filter(
          p=>p!==projectile
        );

      continue;

    }

    const dx=
      projectile.target.x-
      projectile.x;

    const dy=
      projectile.target.y-
      projectile.y;

    const d=
      Math.hypot(
        dx,
        dy
      )||1;

    let speed=.045;

    if(
      projectile.type===
      "cannon"
    )speed=.024;

    if(
      projectile.type===
      "towerArrow"
    )speed=.055;

    if(d<1.7){

      const x=
        projectile.target.x;

      const y=
        projectile.target.y;

      if(
        projectile.type===
        "cannon"
      ){

        createExplosion(
          x,
          y,
          projectile.damage,
          projectile.level
        );

      }else{

        damageEnemy(
          projectile.target,
          projectile.damage
        );

      }

      projectile.element.remove();

      projectiles=
        projectiles.filter(
          p=>p!==projectile
        );

      continue;

    }

    projectile.x+=
      dx/d*
      speed*
      dt;

    projectile.y+=
      dy/d*
      speed*
      dt;

    projectile.element.style.left=
      projectile.x+"%";

    projectile.element.style.top=
      projectile.y+"%";

    if(
      projectile.type===
      "arrow" ||

      projectile.type===
      "towerArrow"
    ){

      projectile.element.style.transform=
        `translate(-50%,-50%)
         rotate(
          ${Math.atan2(dy,dx)*180/Math.PI}deg
         )`;

    }

  }

}

/* =========================
   DALGA SONU
========================= */

function checkWaveEnd(){

  if(
    !waveActive ||

    enemiesToSpawn>0 ||

    enemies.length>0
  )return;

  waveActive=false;

  units.forEach(
    unit=>
    unit.element.remove()
  );

  units=[];

  projectiles.forEach(
    projectile=>
    projectile.element.remove()
  );

  projectiles=[];

  document
  .querySelectorAll(
    ".prod i"
  )
  .forEach(
    element=>
    element.style.width="0%"
  );

  $("waveButton").disabled=
    false;

  $("upgradePanel").style.display=
    "block";

}

/* =========================
   GELİŞTİRME
========================= */

document
.querySelectorAll(
  "[data-up]"
)
.forEach(button=>{

  button.onclick=()=>{

    const type=
      button.dataset.up;

    if(
      type===
      "damage"
    ){

      damageBonus*=1.20;

    }

    if(
      type===
      "production"
    ){

      productionBonus*=1.15;

    }

    if(
      type===
      "wall"
    ){

      wallHP=
        Math.min(
          1500,
          wallHP+100
        );

    }

    if(
      type===
      "money"
    ){

      money+=120;

    }

    $("upgradePanel")
      .style.display="none";

    sync();

  };

});

/* =========================
   OYUN DÖNGÜSÜ
========================= */

function loop(realTime){

  const realDT=
    Math.min(
      40,
      realTime-
      realLastFrame
    );

  realLastFrame=
    realTime;

  const dt=
    realDT*
    gameSpeed;

  gameTime+=dt;

  if(
    waveActive &&

    enemiesToSpawn>0 &&

    gameTime-
    lastSpawnGameTime>=
    700
  ){

    spawnEnemy();

    enemiesToSpawn--;

    lastSpawnGameTime=
      gameTime;

  }

  updateBuildings();

  updateUnits(dt);

  updateTowerArchers();

  updateEnemies(dt);

  updateProjectiles(dt);

  checkWaveEnd();

  requestAnimationFrame(
    loop
  );

}

/* =========================
   BAŞLAT
========================= */

renderSlots();

renderTowerArchers();

sync();

requestAnimationFrame(
  loop
);

</script>
